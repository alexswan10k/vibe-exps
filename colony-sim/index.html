<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colony Sim</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <!-- Tool mode indicator -->
        <div id="mode-indicator" class="hud-chip">
            <span id="mode-name">Inspect</span>
            <span id="mode-hint">Pick an order below, or click a colonist</span>
        </div>

        <!-- Time HUD -->
        <div id="time-hud" class="hud-chip">
            <span id="hud-day">Day 1</span>
            <span id="hud-clock">07:12</span>
            <span class="hud-sep"></span>
            <button id="speed-pause" title="Pause (Space)">⏸</button>
            <button id="speed-1" class="active" title="Normal speed (1)">▶</button>
            <button id="speed-2" title="Fast (2)">▶▶</button>
            <button id="speed-4" title="Very fast (3)">▶▶▶</button>
            <span class="hud-sep"></span>
            <span title="Colonists">👥 <b id="stat-pop">0</b></span>
        </div>

        <!-- Tile inspector -->
        <div id="tile-inspector"></div>

        <!-- Command bar -->
        <div id="command-bar">
            <div class="cmd-group">
                <h4>Orders</h4>
                <button id="tool-chop">🪓 Chop trees</button>
                <button id="tool-mine">⛏ Mine iron</button>
                <button id="tool-mine-rock">⛰ Quarry rock</button>
                <button id="tool-harvest">🌾 Harvest food</button>
            </div>
            <div class="cmd-group">
                <h4>Zones</h4>
                <button id="tool-zone-stockpile">📦 Stockpile</button>
                <button id="tool-zone-growing">🌱 Growing</button>
            </div>
            <div class="cmd-group">
                <h4>Build</h4>
                <button id="tool-build-wall">▓ Wall</button>
                <button id="tool-build-door">🚪 Door</button>
                <button id="tool-build-table">🛠 Table</button>
                <button id="tool-build-bed">🛏 Bed</button>
                <button id="tool-build-chair">🪑 Chair</button>
            </div>
            <div class="cmd-group">
                <h4>Craft</h4>
                <button id="tool-craft-meal">🍲 Cook meals</button>
                <button id="tool-craft-tools">🔧 Make tools</button>
            </div>
        </div>

        <!-- Sidebar -->
        <aside id="sidebar">
            <section class="panel">
                <h3>Colony</h3>
                <div id="resource-list"></div>
            </section>

            <section class="panel">
                <h3>Colonists</h3>
                <div id="pawn-list"></div>
            </section>

            <section class="panel">
                <h3>Jobs</h3>
                <div id="job-list"></div>
            </section>

            <section class="panel grow">
                <h3>Messages</h3>
                <div id="message-list"></div>
            </section>

            <section class="panel">
                <button id="btn-priorities" class="wide">⚙ Work priorities</button>
            </section>
        </aside>

        <!-- Game over overlay -->
        <div id="game-over">
            <div class="game-over-box">
                <h2>The colony has fallen</h2>
                <p class="game-over-sub"></p>
                <button id="close-game-over">Try again</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="noise.js"></script>
    <script src="pathfinding.js"></script>
    <script src="entities.js"></script>
    <script src="task-manager.js"></script>
    <script src="pawn.js"></script>
    <script src="world.js"></script>
    <script src="renderer.js"></script>
    <script src="input-manager.js"></script>
    <script src="ui-manager.js"></script>
    <script src="game.js"></script>
    <script src="main.js"></script>
</body>
</html>
