        for (const el of this.sgLayer.children) {
            const sg = this.model.sgs.find(s => s.id === el.dataset.id);
            if (!sg) continue;
            if (!sg.members.some(id => ids.has(id))) continue;
            const b = this.sgBounds(sg);
            const rect = el.querySelector('rect');
            const label = el.querySelector('text');
            rect.setAttribute('x', b.x); rect.setAttribute('y', b.y);
            rect.setAttribute('width', b.w); rect.setAttribute('height', b.h);
            label.setAttribute('x', b.x + 12); label.setAttribute('y', b.y + 17);
        }
        this.positionPill();
    }

    redrawEdge(e) {
        const g = this.edgeLayer.querySelector(`[data-id="${e.id}"]`);
        if (!g) return;
        const geo = this.edgeGeom(e);
        if (!geo) return;
        g.querySelector('.hit').setAttribute('d', geo.d);
        g.querySelector('.line').setAttribute('d', geo.d);
        const lab = g.querySelector('.elabel');
        if (lab) {
            lab.remove();
            this.buildEdgeLabel(g, e, geo);
        }
    }

    edgeGeom(e) {
        const a = this.nodeById(e.from), b = this.nodeById(e.to);
        if (!a || !b) return null;
        if (a.id === b.id) {
            const sx = a.x + a.w * 0.25, sy = a.y - a.h / 2;
            const ex = a.x + a.w / 2, ey = a.y - a.h * 0.25;
            const mx = (sx + ex) / 2 + 62, my = (sy + ey) / 2 - 62;
            return { d: `M${sx},${sy} C ${sx + 105},${sy - 105} ${ex + 105},${ey - 105} ${ex},${ey}`, mx, my };
        }
        const s1 = sideTowards(a, b.x, b.y), s2 = sideTowards(b, a.x, a.y);
        const p1 = anchorOf(a, s1), p2 = anchorOf(b, s2);
        const par = this.model.edges.filter(o =>
            (o.from === e.from && o.to === e.to) || (o.from === e.to && o.to === e.from));
        const pi = par.indexOf(e);
        const off = pi <= 0 ? 0 : (pi % 2 ? 1 : -1) * Math.ceil(pi / 2) * 24;
        const dirV = v => v === 'l' ? [-1, 0] : v === 'r' ? [1, 0] : v === 't' ? [0, -1] : [0, 1];
        const dv1 = dirV(s1), dv2 = dirV(s2);
        const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const k = Math.min(Math.max(dist * 0.34, 26), 140);
        let nx = 0, ny = 0;
        if (off) {
            const lx = (p2.x - p1.x) / dist, ly = (p2.y - p1.y) / dist;
            nx = -ly * off; ny = lx * off;
        }
        const c1 = { x: p1.x + dv1[0] * k + nx, y: p1.y + dv1[1] * k + ny };
        const c2 = { x: p2.x + dv2[0] * k + nx, y: p2.y + dv2[1] * k + ny };
        const d = `M${p1.x},${p1.y} C ${c1.x},${c1.y} ${c2.x},${c2.y} ${p2.x},${p2.y}`;
        const mx = (p1.x + 3 * c1.x + 3 * c2.x + p2.x) / 8;
        const my = (p1.y + 3 * c1.y + 3 * c2.y + p2.y) / 8;
        return { d, mx, my };
    }

    buildEdgeLabel(g, e, geo) {
        if (!e.label) return;
        const w = textWidth(e.label) + 12;
        const h = 18;
        const lab = svgEl('g', { class: 'elabel', transform: `translate(${geo.mx},${geo.my})` });
        lab.appendChild(svgEl('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: 5 }));
        const txt = svgEl('text', { 'text-anchor': 'middle', dy: '4' });
        txt.textContent = e.label;
        lab.appendChild(txt);
        g.appendChild(lab);
    }

    renderEdges() {
        this.edgeLayer.innerHTML = '';
        for (const e of this.model.edges) {
            const geo = this.edgeGeom(e);
            if (!geo) continue;
            const g = svgEl('g', { class: 'edge k-' + e.kind + (this.selEdges.has(e.id) ? ' sel' : ''), 'data-id': e.id });
            g.appendChild(svgEl('path', { class: 'hit', d: geo.d }));
            const lineAttrs = { class: 'line', d: geo.d };
            const col = this.selEdges.has(e.id) ? 's' : 'n';
            const mk = e.kind === 'thick' ? `url(#ah-${col}-big)` :
                (e.kind === 'arrow' || e.kind === 'dotted') ? `url(#ah-${col})` : null;
            if (mk) lineAttrs['marker-end'] = mk;
            g.appendChild(svgEl('path', lineAttrs));
            this.buildEdgeLabel(g, e, geo);
            this.edgeLayer.appendChild(g);
        }
    }

    sgBounds(sg) {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const id of sg.members) {
            const n = this.nodeById(id);
            if (!n) continue;
            minX = Math.min(minX, n.x - n.w / 2);
            minY = Math.min(minY, n.y - n.h / 2);
            maxX = Math.max(maxX, n.x + n.w / 2);
            maxY = Math.max(maxY, n.y + n.h / 2);
        }
        if (minX === Infinity) return { x: 0, y: 0, w: 10, h: 10 };
        return { x: minX - 26, y: minY - 48, w: maxX - minX + 52, h: maxY - minY + 76 };
    }

    renderSgs() {
        this.sgLayer.innerHTML = '';
        for (const sg of this.model.sgs) {
            const b = this.sgBounds(sg);
            const g = svgEl('g', { class: 'sg-box' + (this.selSg === sg.id ? ' sel' : ''), 'data-id': sg.id });
            g.appendChild(svgEl('rect', { x: b.x, y: b.y, width: b.w, height: b.h }));
            const t = svgEl('text', { x: b.x + 12, y: b.y + 19 });
            t.textContent = sg.title || sg.id;
            g.appendChild(t);
            this.sgLayer.appendChild(g);
        }
    }

    renderNodes() {
        this.nodeLayer.innerHTML = '';
        for (const n of this.model.nodes) {
            const g = svgEl('g', {
                class: 'node' + (this.selNodes.has(n.id) ? ' sel' : ''),
                'data-id': n.id,
                transform: `translate(${n.x},${n.y})`,
            });
            for (const spec of drawShape(n.shape, n.w, n.h)) {
                const isDetail = spec.attrs.fill === 'none';
                const el = svgEl(spec.tag, spec.attrs);
                el.classList.add(isDetail ? 'shape-detail' : 'shape');
                if (!isDetail) {
                    if (n.style && n.style.fill) el.setAttribute('fill', n.style.fill);
                    if (n.style && n.style.stroke) el.setAttribute('stroke', n.style.stroke);
                }
                g.appendChild(el);
            }
            const lines = n._lines || [n.label];
            const blockH = lines.length * LH;
            const startY = -blockH / 2 + LH * 0.74;
            const txt = svgEl('text', { 'text-anchor': 'middle' });
            lines.forEach((ln, i) => {
                const ts = svgEl('tspan', { x: 0, y: startY + i * LH });
                ts.textContent = ln;
                txt.appendChild(ts);
            });
            if (n.style && n.style.color) txt.setAttribute('fill', n.style.color);
            g.appendChild(txt);
            for (const side of ['t', 'r', 'b', 'l']) {
                const p = { t: [0, -n.h / 2], r: [n.w / 2, 0], b: [0, n.h / 2], l: [-n.w / 2, 0] }[side];
                const hd = svgEl('circle', { class: 'handle', 'data-side': side, cx: p[0], cy: p[1] });
                g.appendChild(hd);
            }
            this.nodeLayer.appendChild(g);
        }
    }

    renderAll() {
        if (!this.model) return;
        this.renderSgs();
        this.renderEdges();
        this.renderNodes();
    }

    showPill() {
        if (!this.selNodes.size) { this.hidePill(); return; }
        this.pill.style.display = 'flex';
        if (this.selNodes.size === 1) {
            const n = this.nodeById([...this.selNodes][0]);
            this.pillName.textContent = SHAPES[n.shape].name;
        } else {
            this.pillName.textContent = this.selNodes.size + ' nodes';
        }
        this.buildPillSwatches();
        this.positionPill();
    }

    hidePill() { this.pill.style.display = 'none'; }

    buildPillSwatches() {
        const box = this.pilSw;
        box.innerHTML = '';
        let curIdx = 0;
        if (this.selNodes.size === 1) {
            const n = this.nodeById([...this.selNodes][0]);
            SWATCHES.forEach((s, i) => {
                if (JSON.stringify(s.style) === JSON.stringify(n.style)) curIdx = i;
            });
        }
        SWATCHES.forEach((s, i) => {
            const b = document.createElement('button');
            b.className = 'sw' + (s.style ? '' : ' default') + (i === curIdx ? ' cur' : '');
            if (s.style) {
                b.style.background = s.style.fill;
                b.style.borderColor = s.style.stroke;
            }
            b.title = s.name;
            b.addEventListener('click', () => this.applySwatch(s.style));
            box.appendChild(b);
        });
    }

    positionPill() {
        if (this.pill.style.display === 'none' || !this.selNodes.size || !this.model) return;
        let minX = Infinity, minY = Infinity, maxX = -Infinity;
        for (const id of this.selNodes) {
            const n = this.nodeById(id);
            if (!n) continue;
            minX = Math.min(minX, n.x - n.w / 2); maxX = Math.max(maxX, n.x + n.w / 2);
            minY = Math.min(minY, n.y - n.h / 2);
        }
        if (minX === Infinity) { this.hidePill(); return; }
        const tl = this.worldToScreen((minX + maxX) / 2, minY);
        const pw = this.pill.offsetWidth || 280;
        let x = tl.x - pw / 2;
        x = Math.max(8, Math.min(x, this.svg.clientWidth - pw - 8));
        let y = Math.max(8, tl.y - 44);
        this.pill.style.left = x + 'px';
        this.pill.style.top = y + 'px';
    }

    openEditor(screenX, screenY, width, value, onCommit) {
        this.editorMode = { onCommit };
        this.editor.style.display = 'block';
        this.editor.value = value;
        this.editor.style.left = Math.round(screenX - width / 2) + 'px';
        this.editor.style.top = Math.round(screenY) + 'px';
        this.autosizeEditor();
        this.editor.focus();
        this.editor.select();
    }
    autosizeEditor() {
        this.editor.style.width = 'auto';
        this.editor.style.height = 'auto';
        const w = Math.max(90, Math.min(this.editor.scrollWidth + 18, 260));
        this.editor.style.width = w + 'px';
        this.editor.style.height = Math.min(this.editor.scrollHeight + 4, 120) + 'px';
    }
    closeEditor(cancel) {
        if (this.editor.style.display !== 'block') return false;
        const val = this.editor.value;
        const cb = this.editorMode && this.editorMode.onCommit;
        this.editor.style.display = 'none';
        this.editorMode = null;
        if (!cancel && cb) cb(val);
        return true;
    }
    hasOpenEditor() { return this.editor.style.display === 'block'; }

    openNodeEditor(id) {
        const n = this.nodeById(id);
        if (!n) return;
        const p = this.worldToScreen(n.x, n.y - n.h / 2 - 8);
        this.openEditor(p.x, p.y, Math.max(110, n.w * this.view.k), n.label, v => {
            this.svc.pushUndo(null);
            n.label = v.trim() || n.id;
            sizeNode(n);
            this.changed({ keepView: true });
        });
    }
    openEdgeEditor(id) {
        const e = this.model.edges.find(x => x.id === id);
        if (!e) return;
        const geo = this.edgeGeom(e);
        const p = this.worldToScreen(geo.mx, geo.my);
        this.openEditor(p.x, p.y - 12, 110, e.label, v => {
            this.svc.pushUndo(null);
            e.label = v.trim();
            this.changed({ keepView: true });
        });
    }
    openTitleEditor(sg) {
        const b = this.sgBounds(sg);
        const p = this.worldToScreen(b.x + 12, b.y + 4);
        this.openEditor(p.x, p.y, 130, sg.title, v => {
            this.svc.pushUndo(null);
            sg.title = v.trim() || sg.id;
            this.changed({ keepView: true });
        });
    }

    selectAll() {
        this.clearSelection();
        this.model.nodes.forEach(n => this.selNodes.add(n.id));
        this.refreshSelClasses();
        this.showPill();
    }

    onKeyDown(e) {
        if (!this.active || !this.model) return false;
        const tag = (e.target.tagName || '').toLowerCase();
        const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
        if (e.key === ' ' && !typing) { this.spaceDown = true; this.svg.style.cursor = 'grab'; }
        if (typing) return false;
        if (this.svc.isHelpOpen()) return false;
        const mod = e.ctrlKey || e.metaKey;
        if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); this.duplicateSel(); return true; }
        if (mod && e.key.toLowerCase() === 'a') { e.preventDefault(); this.selectAll(); return true; }
        if (mod && e.key.toLowerCase() === 'g') { e.preventDefault(); e.shiftKey ? this.ungroupSel() : this.groupSel(); return true; }
        if (mod) return false;
        if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); this.deleteSel(); return true; }
        if (e.key === 'Escape') { this.clearSelection(); this.refreshSelClasses(); return true; }
        if (e.key === 'Enter') { if (this.selNodes.size === 1) { e.preventDefault(); this.openNodeEditor([...this.selNodes][0]); } return true; }
        if (e.key === 'f' || e.key === 'F') { this.fitView(); return true; }
        if (e.key.startsWith('Arrow')) {
            e.preventDefault();
            if (!this.selNodes.size) return true;
            const step = e.shiftKey ? 1 : GRID;
            const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
            this.svc.pushUndo(null);
            const touched = new Set();
            for (const id of this.selNodes) {
                const n = this.nodeById(id);
                if (!n) continue;
                n.x += d[0]; n.y += d[1];
                touched.add(id);
            }
            this.fastUpdatePositions(touched);
            this.changed({ keepView: true });
            return true;
        }
        return false;
    }
}

window.StudioCore.Board = Board;

})();
</script>

<script type="text/babel">
'use strict';

const { useState, useEffect, useRef, useMemo, useCallback, useReducer } = React;
const C = window.StudioCore;
const { PIE_COLORS, GANTT_STATUS_STYLE, polarPt, slicePath, pieBounds, fmtIso, fmtDur, resolveGantt, niceTicks, dayLabel, seqLayout } = C;

const STORE_KEY = 'mermaid-studio-v2';

function loadSaved() {
    try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) {
            const j = JSON.parse(raw);
            if (j && j.v === 2 && j.docs) return j;
        }
        const legacy = localStorage.getItem('mermaid-studio-v1');
        if (legacy) {
            const j = JSON.parse(legacy);
            if (j && j.model && j.model.nodes) return { docs: { flowchart: { data: j.model } }, prefs: j.prefs || {} };
        }
    } catch (e) {}
    return null;
}

function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/&gt;/g, '&gt;');
}

const deepClone = o => JSON.parse(JSON.stringify(o));

function downloadBlob(name, blob) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
}

const PAL_ICONS = {
    rect: '<rect x="3" y="4" width="24" height="14" rx="3"/>',
    round: '<rect x="3" y="4" width="24" height="14" rx="7"/>',
    stadium: '<rect x="3" y="5" width="24" height="12" rx="6"/>',
    sub: '<rect x="3" y="4" width="24" height="14" rx="2"/><line x1="8" y1="4" x2="8" y2="18"/><line x1="22" y1="4" x2="22" y2="18"/>',
    cyl: '<path d="M3 7 a12 3.4 0 0 1 24 0 v8 a12 3.4 0 0 1 -24 0 z"/><path d="M3 7 a12 3.4 0 0 0 24 0"/>',
    circle: '<ellipse cx="15" cy="11" rx="10" ry="8"/>',
    diamond: '<polygon points="15,2 27,11 15,20 3,11"/>',
    hex: '<polygon points="8,4 22,4 27,11 22,18 8,18 3,11"/>',
    para: '<polygon points="7,4 27,4 27,18 7,18 3,11"/>',
};

function PalIcon({ shape }) {
    return (
        <svg viewBox="0 0 30 22"
            dangerouslySetInnerHTML={{ __html: PAL_ICONS[shape] || PAL_ICONS.rect }}
            style={{ fill: 'none', stroke: '#8fa6c2', strokeWidth: 1.6 }} />
    );
}

function UField({ value, onLive, onCommitPre, mono, placeholder, style, autoFocus }) {
    const u = useUndoablePre(onCommitPre);
    return (
        <input
            className={'sin' + (mono ? ' mono' : '')}
            value={value == null ? '' : value}
            placeholder={placeholder || ''}
            style={style}
            autoFocus={autoFocus}
            onFocus={u.grab}
            onChange={e => { u.grab(); onLive(e.target.value); u.arm(); }}
            onBlur={u.flush}
            onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); e.stopPropagation(); }}
        />
    );
}

function USelect({ value, onLive, onCommitPre, options, style }) {
    const u = useUndoablePre(onCommitPre);
    return (
        <select
            value={value}
            style={style}
            onFocus={u.grab}
            onChange={e => { u.grab(); onLive(e.target.value); u.flush(); }}
            onKeyDown={e => e.stopPropagation()}
        >
            {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
        </select>
    );
}

function UCheck({ checked, onLive, onCommitPre, label, title }) {
    const u = useUndoablePre(onCommitPre);
    return (
        <label title={title || ''} style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 12, color: 'var(--muted)', cursor: 'pointer', whiteSpace: 'nowrap' }}>
            <input
                type="checkbox"
                checked={!!checked}
                onFocus={u.grab}
                onChange={e => { u.grab(); onLive(e.target.checked); u.flush(); }}
                onKeyDown={e => e.stopPropagation()}
                style={{ accentColor: '#22d3ee' }}
            />
            {label}
        </label>
    );
}

function RowBtns({ onUp, onDown, onDel, upDis, downDis }) {
    return (
        <span style={{ display: 'inline-flex', gap: 3, marginLeft: 'auto' }}>
            <button type="button" className="mini-btn" title="Move up" disabled={upDis} onClick={onUp}>↑</button>
            <button type="button" className="mini-btn" title="Move down" disabled={downDis} onClick={onDown}>↓</button>
            <button type="button" className="mini-btn del" title="Delete" onClick={onDel}>✕</button>
        </span>
    );
}

function useUndoablePre(onCommitPre) {
    const pre = useRef(null);
    const timer = useRef(null);
    const grab = () => { if (pre.current == null) pre.current = onCommitPre.snap(); };
    const arm = () => {
        clearTimeout(timer.current);
        timer.current = setTimeout(() => {
            if (pre.current != null) { onCommitPre.push(pre.current); pre.current = null; }
        }, 900);
    };
    const flush = () => {
        clearTimeout(timer.current);
        if (pre.current != null) { onCommitPre.push(pre.current); pre.current = null; }
    };
    useEffect(() => () => {
        clearTimeout(timer.current);
        if (pre.current != null) { onCommitPre.push(pre.current); pre.current = null; }
    }, []);
    return { grab, arm, flush };
}

function makeApi({ data, commitData, snapOf, pushPre }) {
    return {
        edit: (fn, structural) => {
            if (structural) pushPre(snapOf());
            const d2 = deepClone(data);
            fn(d2);
            commitData(d2);
        },
        snap: () => snapOf(),
        pushPre,
        commit: fn => {
            const d2 = deepClone(data);
            fn(d2);
            commitData(d2);
        },
        data,
    };
}

function SeqSheet({ data, api }) {
    const participants = data.participants;
    const items = data.items || [];

    const renameParticipant = (oldId, newIdRaw) => {
        const newId = newIdRaw.trim().replace(/[^\w.\-]/g, '') || oldId;
        if (newId === oldId) return;
        if (participants.some(p => p.id === newId)) return;
        api.edit(d => {
            const p = d.participants.find(x => x.id === oldId);
            if (p) p.id = newId;
            for (const it of d.items) {
                if (it.kind === 'msg') {
                    if (it.from === oldId) it.from = newId;
                    if (it.to === oldId) it.to = newId;
                } else if (it.kind === 'note') {
                    it.who = it.who.map(w => (w === oldId ? newId : w));
                } else if (it.kind === 'act') {
                    if (it.who === oldId) it.who = newId;
                }
            }
        });
    };

    const pOpts = participants.map(p => ({ value: p.id, label: `${p.id}${p.label !== p.id ? ' · ' + p.label : ''}` }));
    const arrowOpts = ['->>', '-->>', '->', '-->', '-)', '--)', '-x', '--x'].map(a => ({ value: a, label: `${a}  ${SEQ_ARROW_LABELS[a]}` }));

    const addItem = kind => {
        api.edit(d => {
            if (!d.participants.length) {
                d.participants.push({ id: 'A', label: 'Alice', actor: false });
                d.participants.push({ id: 'B', label: 'Bob', actor: false });
            }
            const first = d.participants[0].id;
            const second = d.participants[1] ? d.participants[1].id : first;
            if (kind === 'msg') d.items.push({ kind: 'msg', from: first, arrow: '->>', to: second, text: 'message' });
            else if (kind === 'note') d.items.push({ kind: 'note', pos: 'over', who: [first], text: 'note' });
            else if (kind === 'act-on') d.items.push({ kind: 'act', on: true, who: first });
            else if (kind === 'act-off') d.items.push({ kind: 'act', on: false, who: first });
        }, true);
    };

    const moveItem = (i, dir) => api.edit(d => {
        const j = i + dir;
        if (j < 0 || j >= d.items.length) return;
        const t = d.items[i]; d.items[i] = d.items[j]; d.items[j] = t;
    }, true);

    return (
        <div>
            <div className="scard">
                <div className="scard-h">
                    <span>Participants</span>
                    <span className="grow"></span>
                    <button type="button" onClick={() => api.edit(d => {
                        let i = d.participants.length + 1;
                        while (d.participants.some(p => p.id === 'P' + i)) i++;
                        d.participants.push({ id: 'P' + i, label: 'P' + i, actor: false });
                    }, true)}>+ Participant</button>
                </div>
                {participants.length === 0 && <div className="sheet-empty">No participants yet.</div>}
                {participants.map((p, i) => (
                    <div className="trow" key={i}>
                        <UField style={{ width: 92 }} value={p.id} placeholder="id"
                            onLive={v => renameParticipant(p.id, v)}
                            onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                        <UField style={{ flex: 1, minWidth: 110 }} value={p.label} placeholder="display name"
                            onLive={v => api.edit(d => { const q = d.participants[i]; if (q) q.label = v; })}
                            onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                        <UCheck label="actor" checked={p.actor} title="Render as an actor stick figure"
                            onLive={v => api.edit(d => { const q = d.participants[i]; if (q) q.actor = v; })}
                            onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                        <RowBtns
                            upDis={i === 0} downDis={i === participants.length - 1}
                            onUp={() => api.edit(d => { const t = d.participants[i - 1]; d.participants[i - 1] = d.participants[i]; d.participants[i] = t; }, true)}
                            onDown={() => api.edit(d => { const t = d.participants[i + 1]; d.participants[i + 1] = d.participants[i]; d.participants[i] = t; }, true)}
                            onDel={() => api.edit(d => { d.participants.splice(i, 1); }, true)}
                        />
                    </div>
                ))}
            </div>

            <div className="scard">
                <div className="scard-h">
                    <span>Flow</span>
                    <span className="grow"></span>
                    <button type="button" onClick={() => addItem('msg')}>+ Message</button>
                    <button type="button" onClick={() => addItem('note')}>+ Note</button>
                    <button type="button" title="Activation bar" onClick={() => addItem('act-on')}>+ Act</button>
                    <button type="button" title="Deactivation" onClick={() => addItem('act-off')}>+ Deact</button>
                </div>
                {items.length === 0 && <div className="sheet-empty">Empty conversation — add a message above.</div>}
                {items.map((it, i) => (
                    <div className="trow" key={i}>
                        <USelect style={{ width: 96 }} value={it.kind}
                            options={[
                                { value: 'msg', label: 'Message' },
                                { value: 'note', label: 'Note' },
                                { value: 'act', label: it.kind === 'act' && !it.on ? 'Deactivate' : 'Activate' },
                            ]}
                            onLive={v => api.edit(d => {
                                const cur = d.items[i];
                                if (cur.kind === v) return;
                                if (v === 'msg') d.items[i] = { kind: 'msg', from: cur.from || cur.who && cur.who[0] || 'A', arrow: '->>', to: cur.to || cur.who && cur.who[1] || cur.who && cur.who[0] || 'B', text: cur.text || '' };
                                else if (v === 'note') d.items[i] = { kind: 'note', pos: 'over', who: [cur.from || (cur.who && cur.who[0]) || 'A'], text: cur.text || '' };
                                else if (v === 'act') d.items[i] = { kind: 'act', on: true, who: cur.from || (cur.who && cur.who[0]) || 'A' };
                            }, true)}
                            onCommitPre={{ snap: api.snap, push: api.pushPre }} />

                        {it.kind === 'msg' && (<React.Fragment>
                            <USelect style={{ width: 86 }} value={it.from} options={pOpts}
                                onLive={v => api.edit(d => { d.items[i].from = v; })}
                                onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                            <USelect style={{ width: 118 }} value={it.arrow} options={arrowOpts}
                                onLive={v => api.edit(d => { d.items[i].arrow = v; })}
                                onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                            <USelect style={{ width: 86 }} value={it.to} options={pOpts}
                                onLive={v => api.edit(d => { d.items[i].to = v; })}
                                onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                            <UField style={{ flex: 1, minWidth: 120 }} value={it.text} placeholder="what is said"
                                onLive={v => api.edit(d => { d.items[i].text = v; })}
                                onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                        </React.Fragment>)}

                        {it.kind === 'note' && (<React.Fragment>
                            <USelect style={{ width: 84 }} value={it.pos}
                                options={[{ value: 'over', label: 'over' }, { value: 'left', label: 'left of' }, { value: 'right', label: 'right of' }]}
                                onLive={v => api.edit(d => { d.items[i].pos = v; })}
                                onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                            <UField style={{ width: 120, fontFamily: 'ui-monospace, Menlo, monospace', fontSize: 11.5 }} value={(it.who || []).join(',')}
                                placeholder="A,B"
                                onLive={v => api.edit(d => { d.items[i].who = v.split(',').map(x => x.trim()).filter(Boolean); })}
                                onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                            <UField style={{ flex: 1, minWidth: 120 }} value={it.text} placeholder="note text"
                                onLive={v => api.edit(d => { d.items[i].text = v; })}
                                onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                        </React.Fragment>)}

                        {it.kind === 'act' && (<React.Fragment>
                            <span className="sheet-note" style={{ marginTop: 0 }}>{it.on ? 'activates' : 'deactivates'}</span>
                            <USelect style={{ width: 100 }} value={it.who} options={pOpts}
                                onLive={v => api.edit(d => { d.items[i].who = v; })}
                                onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                            <button type="button" className="mini-btn" title="Toggle activate/deactivate"
                                onClick={() => api.edit(d => { d.items[i].on = !d.items[i].on; }, true)}>⇄</button>
                        </React.Fragment>)}

                        <RowBtns upDis={i === 0} downDis={i === items.length - 1}
                            onUp={() => moveItem(i, -1)} onDown={() => moveItem(i, 1)}
                            onDel={() => api.edit(d => { d.items.splice(i, 1); }, true)} />
                    </div>
                ))}
                <div className="sheet-note">Tip — paste any sequenceDiagram source into the editor on the right and it becomes editable rows here. Loops/alt blocks and dividers are not supported by mermaid sequence diagrams and are ignored.</div>
            </div>
        </div>
    );
}

const SEQ_ARROW_LABELS = {
    '->': 'solid', '-->': 'dotted', '->>': 'solid arrowhead', '-->>': 'dotted arrowhead',
    '-)': 'open', '--)': 'open dashed', '-x': 'cross', '--x': 'cross dashed',
};

const GANTT_STATUS_OPTS = [
    { value: '', label: '—' },
    { value: 'done', label: '✓ done' },
    { value: 'active', label: '▶ active' },
    { value: 'crit', label: '‼ critical' },
    { value: 'milestone', label: '◆ milestone' },
];
const DUR_RE2 = /^\d+(\.\d+)?\s*[smhdwy]$/i;
const isIso = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');

function GanttSheet({ data, api }) {
    const sections = data.sections || [];
    const allTasks = [];
    for (const s of sections) for (const t of s.tasks) allTasks.push(t);

    const tasksOf = d => {
        const arr = [];
        for (const s of d.sections) for (const t of s.tasks) arr.push(t);
        return arr;
    };

    const pickAfter = (d, task, chosen) => {
        if (!chosen) { task.start = null; return; }
        if (!chosen.startsWith('\u0000')) { task.start = { kind: 'after', value: [chosen] }; return; }
        const flat = tasksOf(d);
        const target = flat[parseInt(chosen.slice(1), 10)];
        if (!target || target === task) { task.start = null; return; }
        if (!target.alias) {
            const taken = new Set(flat.map(t => t.alias).filter(Boolean));
            let i = Math.max(flat.indexOf(target) + 1, 1);
            let cand = 't' + i;
            while (taken.has(cand)) cand = 't' + (++i);
            target.alias = cand;
        }
        task.start = { kind: 'after', value: [target.alias] };
    };

    const depOptions = excludeTask => {
        const opts = [{ value: '', label: '(pick task)' }];
        allTasks.forEach((t, idx) => {
            if (t === excludeTask) return;
            if (!t.alias && !t.start && !t.dur && !t.end) return;
            const label = `${t.label || t.alias || '(untitled)'}${t.alias ? '' : ' #' + (idx + 1)}`;
            opts.push({ value: t.alias || '\u0000' + idx, label });
        });
        return opts;
    };

    return (
        <div>
            <div className="scard">
                <div className="scard-h"><span>Chart settings</span></div>
                <div className="trow">
                    <span style={{ fontSize: 11, color: 'var(--muted)', width: 74 }}>Title</span>
                    <UField style={{ flex: 1, minWidth: 160 }} value={data.title} placeholder="untitled plan"
                        onLive={v => api.edit(d => { d.title = v; })}
                        onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                </div>
                <div className="trow">
                    <span style={{ fontSize: 11, color: 'var(--muted)', width: 74 }}>dateFormat</span>
                    <UField mono style={{ width: 150 }} value={data.dateFormat}
                        onLive={v => api.edit(d => { d.dateFormat = v; })}
                        onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                    <span style={{ fontSize: 11, color: 'var(--muted)', width: 70, textAlign: 'right' }}>axisFormat</span>
                    <UField mono style={{ width: 110 }} value={data.axisFormat}
                        onLive={v => api.edit(d => { d.axisFormat = v; })}
                        onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                    <span style={{ fontSize: 11, color: 'var(--muted)', width: 60, textAlign: 'right' }}>excludes</span>
                    <UField mono style={{ width: 120 }} value={data.excludes} placeholder="weekends"
                        onLive={v => api.edit(d => { d.excludes = v; })}
                        onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                </div>
            </div>

            {sections.map((sec, si) => (
                <div className="scard" key={si}>
                    <div className="scard-h">
                        <span style={{ textTransform: 'none', letterSpacing: 0 }}>
                            <input className="sin" style={{ padding: '2px 7px', fontWeight: 600 }}
                                value={sec.name}
                                placeholder="section name"
                                onFocus={e => e.target.dataset.pre = api.snap()}
                                onChange={e => api.edit(d => { d.sections[si].name = e.target.value; })}
                                onBlur={e => { if (e.target.dataset.pre) { api.pushPre(e.target.dataset.pre); delete e.target.dataset.pre; } }}
                                onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); e.stopPropagation(); }}
                            />
                        </span>
                        <span className="grow"></span>
                        <button type="button" onClick={() => api.edit(d => {
                            d.sections[si].tasks.push({ label: 'New task', status: '', alias: '', start: { kind: 'date', value: todayIso() }, dur: '3d', end: '' });
                        }, true)}>+ Task</button>
                        <button type="button" className="danger" onClick={() => api.edit(d => { d.sections.splice(si, 1); }, true)}>Delete section</button>
                    </div>

                    {sec.tasks.length === 0 && <div className="sheet-empty">No tasks here yet.</div>}
                    {sec.tasks.map((t, ti) => {
                        const invalid = !t.label && !(t.start && ((t.start.kind === 'after' ? (t.start.value || []).length : t.start.value))) && !t.dur && !t.end;
                        const dateKind = t.start && t.start.kind === 'date';
                        const afterKind = t.start && t.start.kind === 'after';
                        return (
                            <div className={'trow' + (invalid ? ' row-warn' : '')} key={ti}>
                                <UField style={{ flex: 1, minWidth: 130 }} value={t.label} placeholder="task name"
                                    onLive={v => api.edit(d => { d.sections[si].tasks[ti].label = v; })}
                                    onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                                <USelect style={{ width: 108 }} value={t.status} options={GANTT_STATUS_OPTS}
                                    onLive={v => api.edit(d => { d.sections[si].tasks[ti].status = v; })}
                                    onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                                <UField mono style={{ width: 62 }} value={t.alias} placeholder="id"
                                    title="Optional task id, used by 'after' dependencies"
                                    onLive={v => api.edit(d => { d.sections[si].tasks[ti].alias = v.replace(/[^\w.\-]/g, ''); })}
                                    onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                                <USelect style={{ width: 82 }} value={dateKind ? 'date' : afterKind ? 'after' : 'none'}
                                    options={[{ value: 'none', label: 'start…' }, { value: 'date', label: 'on date' }, { value: 'after', label: 'after…' }]}
                                    onLive={v => api.edit(d => {
                                        const task = d.sections[si].tasks[ti];
                                        if (v === 'date') task.start = { kind: 'date', value: task.start && task.start.kind === 'date' ? task.start.value : todayIso() };
                                        else if (v === 'after') {
                                            const flat = tasksOf(d).filter(o => o !== task && o.alias);
                                            if (flat.length) task.start = { kind: 'after', value: [flat[0].alias] };
                                            else {
                                                const any = tasksOf(d).filter(o => o !== task);
                                                if (any.length) pickAfter(d, task, '\u0000' + tasksOf(d).indexOf(any[0]));
                                                else task.start = null;
                                            }
                                        }
                                        else task.start = null;
                                    }, true)}
                                    onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                                {dateKind && (
                                    <GanttDateInput value={t.start.value || ''} iso={isIso(t.start.value)}
                                        api={api}
                                        onSet={(d, v) => { d.sections[si].tasks[ti].start.value = v; }} />
                                )}
                                {afterKind && (
                                    <USelect style={{ width: 170 }} value={(t.start.value || [])[0] || ''}
                                        options={depOptions(t)}
                                        onLive={v => api.edit(d => { pickAfter(d, d.sections[si].tasks[ti], v); })}
                                        onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                                )}
                                <UField mono style={{ width: 96 }} value={t.dur || t.end || ''} placeholder="5d or date"
                                    title="Duration (5d) or end date"
                                    onLive={v => api.edit(d => {
                                        const task = d.sections[si].tasks[ti];
                                        if (DUR_RE2.test(v.trim())) { task.dur = v.trim(); task.end = ''; }
                                        else { task.end = v.trim(); task.dur = ''; }
                                    })}
                                    onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                                <RowBtns upDis={ti === 0} downDis={ti === sec.tasks.length - 1}
                                    onUp={() => api.edit(d => { const arr = d.sections[si].tasks; const tmp = arr[ti - 1]; arr[ti - 1] = arr[ti]; arr[ti] = tmp; }, true)}
                                    onDown={() => api.edit(d => { const arr = d.sections[si].tasks; const tmp = arr[ti + 1]; arr[ti + 1] = arr[ti]; arr[ti] = tmp; }, true)}
                                    onDel={() => api.edit(d => { d.sections[si].tasks.splice(ti, 1); }, true)} />
                            </div>
                        );
                    })}
                </div>
            ))}

            <button type="button" onClick={() => api.edit(d => {
                let i = d.sections.length + 1;
                while (d.sections.some(s => s.name === 'Phase ' + i)) i++;
                d.sections.push({ name: 'Phase ' + i, tasks: [] });
            }, true)}>+ Section</button>
            <div className="sheet-note">Rows outlined in amber are skipped until they have a name or dates. “after” dependencies chain automatically; give tasks an id to reference them.</div>
        </div>
    );
}

function GanttDateInput({ value, iso, api, onSet }) {
    const u = useUndoablePre({ snap: api.snap, push: api.pushPre });
    return (
        <input type={iso ? 'date' : 'text'} className="sin"
            value={value}
            onFocus={u.grab}
            onChange={e => { u.grab(); api.edit(d => onSet(d, e.target.value)); u.arm(); }}
            onBlur={u.flush}
            onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); e.stopPropagation(); }}
            style={{ width: 150 }} />
    );
}

function PieValueInput({ value, api, onSet }) {
    const u = useUndoablePre({ snap: api.snap, push: api.pushPre });
    return (
        <input type="number" step="any" className="sin"
            value={value}
            onFocus={u.grab}
            onChange={e => { u.grab(); const n = parseFloat(e.target.value); api.edit(d => onSet(d, isNaN(n) ? 0 : n)); u.arm(); }}
            onBlur={u.flush}
            onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); e.stopPropagation(); }}
            style={{ width: 96 }} />
    );
}

function todayIso() {
    try {
        return new Date().toISOString().slice(0, 10);
    } catch (e) { return '2026-01-01'; }
}

function PieSheet({ data, api }) {
    const slices = data.slices || [];
    const total = slices.reduce((a, s) => a + (Number(s.value) || 0), 0);
    return (
        <div>
            <div className="scard">
                <div className="scard-h"><span>Chart settings</span></div>
                <div className="trow">
                    <UCheck label="show data labels" checked={data.showData}
                        onLive={v => api.edit(d => { d.showData = v; })}
                        onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                    <span style={{ fontSize: 11, color: 'var(--muted)', marginLeft: 8 }}>Title</span>
                    <UField style={{ flex: 1, minWidth: 140 }} value={data.title} placeholder="untitled chart"
                        onLive={v => api.edit(d => { d.title = v; })}
                        onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                </div>
            </div>
            <div className="scard">
                <div className="scard-h">
                    <span>Slices · total {Math.round(total * 100) / 100}</span>
                    <span className="grow"></span>
                    <button type="button" onClick={() => api.edit(d => {
                        d.slices.push({ label: 'Slice ' + (d.slices.length + 1), value: 10 });
                    }, true)}>+ Slice</button>
                </div>
                {slices.length === 0 && <div className="sheet-empty">No slices yet.</div>}
                {slices.map((s, i) => (
                    <div className="trow" key={i}>
                        <UField style={{ flex: 1, minWidth: 140 }} value={s.label} placeholder="label"
                            onLive={v => api.edit(d => { d.slices[i].label = v; })}
                            onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                        <PieValueInput value={s.value} api={api}
                            onSet={(d, v) => { d.slices[i].value = v; }} />
                        <RowBtns upDis={i === 0} downDis={i === slices.length - 1}
                            onUp={() => api.edit(d => { const t = d.slices[i - 1]; d.slices[i - 1] = d.slices[i]; d.slices[i] = t; }, true)}
                            onDown={() => api.edit(d => { const t = d.slices[i + 1]; d.slices[i + 1] = d.slices[i]; d.slices[i] = t; }, true)}
                            onDel={() => api.edit(d => { d.slices.splice(i, 1); }, true)} />
                    </div>
                ))}
                <div className="sheet-note">Percentages are computed by mermaid itself — absolute values are fine.</div>
            </div>
        </div>
    );
}

function useHostSize(ref, minW, h) {
    const [size, setSize] = useState({ w: Math.max(minW, 900), h });
    useEffect(() => {
        const m = () => {
            const el = ref.current;
            if (el) setSize({ w: Math.max(el.clientWidth || 0, minW), h });
        };
        m();
        window.addEventListener('resize', m);
        return () => window.removeEventListener('resize', m);
    }, [minW, h]);
    return size;
}

function clampPill(x, y, hostW) {
    return { left: Math.max(6, Math.min(x, hostW - 320)), top: Math.max(4, y) };
}

function PieVisual({ data, api }) {
    const hostRef = useRef(null);
    const [sel, setSel] = useState(-1);
    const dragRef = useRef(null);
    const [, tickState] = useReducer(v => v + 1, 0);
    useEffect(() => { setSel(-1); }, [data]);
    const size = useHostSize(hostRef, 520, 430);
    const w = size.w, h = size.h;
    const cx = w / 2, cy = h / 2 + 10;
    const R = Math.max(90, Math.min(w, h) / 2 - 52);
    const slices = data.slices || [];
    const rawTotal = slices.reduce((a, s) => a + (Number(s.value) || 0), 0);
    const eff = slices.map(s => (rawTotal > 0 ? (Number(s.value) || 0) : 1));
    const totEff = eff.reduce((a, b) => a + b, 0) || 1;
    const bounds = pieBounds(eff);
    if (dragRef.current) bounds[dragRef.current.i] = dragRef.current.a;

    const localPt = e => {
        const r = hostRef.current.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
    };
    const normA = a => {
        while (a < -Math.PI / 2) a += Math.PI * 2;
        while (a >= -Math.PI / 2 + Math.PI * 2) a -= Math.PI * 2;
        return a;
    };

    const startDrag = (i, e) => {
        e.stopPropagation();
        setSel(i - 1 < 0 ? slices.length - 1 : i - 1);
        const preSnap = api.snap();
        let armed = false;
        dragRef.current = { i, a: bounds[i] };
        const move = ev => {
            if (!armed) { armed = true; api.pushPre(preSnap); }
            const p = localPt(ev);
            const a = normA(Math.atan2(p.y - cy, p.x - cx));
            const lo = bounds[i - 1] + 0.02, hi = bounds[i + 1] - 0.02;
            dragRef.current.a = Math.min(hi, Math.max(lo, a));
            tickState();
        };
        const up = () => {
            window.removeEventListener('pointermove', move);
            window.removeEventListener('pointerup', up);
            const dr = dragRef.current;
            dragRef.current = null;
            if (dr && slices[i - 1 >= 0 ? i - 1 : slices.length - 1] != null) {
                const span = dr.a - bounds[i - 1];
                const val = Math.round(span / (Math.PI * 2) * totEff * 100) / 100;
                const idx = i - 1;
                api.commit(d => {
                    if (d.slices[idx]) d.slices[idx].value = val;
                });
            }
            tickState();
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
    };

    const selSlice = sel >= 0 && sel < slices.length ? sel : -1;
    let pill = null;
    if (selSlice >= 0) {
        const mid = (bounds[selSlice] + bounds[selSlice + 1]) / 2;
        const [px, py] = polarPt(cx, cy, R * 0.62, mid);
        pill = (
            <div className="fpill" style={clampPill(px + 14, py - 16, w)}>
                <UField style={{ width: 110 }} value={slices[selSlice].label} placeholder="label"
                    onLive={v => api.edit(d => { if (d.slices[selSlice]) d.slices[selSlice].label = v; })}
                    onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                <input type="number" step="any" className="sin" style={{ width: 76 }} value={slices[selSlice].value}
                    onChange={e => { const n = parseFloat(e.target.value); api.edit(d => { if (d.slices[selSlice]) d.slices[selSlice].value = isNaN(n) ? 0 : n; }); }}
                    onKeyDown={e => e.stopPropagation()} />
                <button type="button" className="mini-btn del" title="Delete slice"
                    onClick={() => { api.edit(d => { d.slices.splice(selSlice, 1); }, true); setSel(-1); }}>✕</button>
            </div>
        );
    }

    return (
        <div className="viz-body" ref={hostRef} onPointerDown={() => setSel(-1)}>
            <svg width={w} height={h}>
                <text className="p-title" x={18} y={24}>{data.title || ''}</text>
                {slices.map((s, i) => (
                    <path key={i} className={'p-slice' + (sel === i ? ' sel' : '')}
                        d={slicePath(cx, cy, R, bounds[i], bounds[i + 1])}
                        fill={PIE_COLORS[i % PIE_COLORS.length]}
                        opacity={sel === -1 || sel === i ? 1 : 0.45}
                        onPointerDown={e => { e.stopPropagation(); setSel(i); }} />
                ))}
                {bounds.map((a, i) => {
                    if (i === 0 || i === bounds.length - 1) return null;
                    const [hx, hy] = polarPt(cx, cy, R * 0.88, a);
                    return (
                        <circle key={'h' + i} className="p-handle" cx={hx} cy={hy} r={7}
                            onPointerDown={e => startDrag(i, e)} />
                    );
                })}
                <text className="p-total" x={cx} y={cy + 4}>
                    {Math.round(rawTotal * 100) / 100}
                </text>
                <text className="p-total" x={cx} y={cy + 20} style={{ fontSize: 9.5, fill: '#64748b' }}>
                    total
                </text>
            </svg>
            {!slices.length && <div className="viz-empty">No slices — switch to Rows or paste pie source.</div>}
            {pill}
        </div>
    );
}

function GanttVisual({ data, api }) {
    const hostRef = useRef(null);
    const [sel, setSel] = useState(null);
    const dragRef = useRef(null);
    const [, tickState] = useReducer(v => v + 1, 0);
    useEffect(() => { setSel(null); }, [data]);
    const size = useHostSize(hostRef, 720, 470);
    const W = size.w;
    const DAY = 86400000;
    const Rg = resolveGantt(data);
    const LG = 178, PADR = 20, AXIS = 30;
    const H = AXIS + (data.sections || []).length * 26 + Rg.flat.length * 34 + 34;
    const plotW = Math.max(W - LG - PADR, 60);
    const xOf = ms => LG + (ms - Rg.min) / (Rg.max - Rg.min) * plotW;
    const colMs = () => (Rg.max - Rg.min) / plotW;

    const rowYs = [];
    let yy = AXIS;
    (data.sections || []).forEach((sec, si) => {
        yy += 26;
        sec.tasks.forEach((t, ti) => { rowYs.push({ t, si, ti, y: yy }); yy += 34; });
    });

    const viewOf = row => {
        const p = Rg.pos.get(row.t) || { sd: Date.now(), ed: Date.now() + DAY };
        if (dragRef.current && dragRef.current.si === row.si && dragRef.current.ti === row.ti) {
            return Object.assign({}, p, dragRef.current.over);
        }
        return p;
    };

    const barDown = (row, zone, e) => {
        e.stopPropagation();
        setSel({ si: row.si, ti: row.ti });
        const startX = e.clientX;
        const p0 = Rg.pos.get(row.t);
        const sd0 = p0.sd, ed0 = p0.ed;
        const preSnap = api.snap();
        let armed = false;
        dragRef.current = { si: row.si, ti: row.ti, over: {} };
        const move = ev => {
            if (!armed && Math.abs(ev.clientX - startX) > 3) { armed = true; api.pushPre(preSnap); }
            const dd = Math.round((ev.clientX - startX) * colMs() / DAY);
            const over = {};
            if (zone === 'body') { over.sd = sd0 + dd * DAY; over.ed = ed0 + dd * DAY; }
            else if (zone === 'l') { over.sd = Math.min(sd0 + dd * DAY, ed0 - DAY / 2); over.ed = ed0; }
            else { over.sd = sd0; over.ed = Math.max(ed0 + dd * DAY, sd0 + DAY / 2); }
            dragRef.current.over = over;
            tickState();
        };
        const up = () => {
            window.removeEventListener('pointermove', move);
            window.removeEventListener('pointerup', up);
            const over = dragRef.current ? dragRef.current.over : {};
            dragRef.current = null;
            const nsd = over.sd != null ? over.sd : sd0;
            const ned = over.ed != null ? over.ed : ed0;
            if (over.sd == null && over.ed == null) { tickState(); return; }
            api.commit(d => {
                const hit = d.sections[row.si] && d.sections[row.si].tasks[row.ti];
                if (!hit) return;
                if (zone === 'r') {
                    hit.end = fmtIso(ned);
                    hit.dur = '';
                    if (!hit.start || hit.start.kind !== 'date') hit.start = { kind: 'date', value: fmtIso(nsd) };
                } else {
                    hit.start = { kind: 'date', value: fmtIso(nsd) };
                    hit.dur = fmtDur(ned - nsd);
                    hit.end = '';
                }
            });
            tickState();
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
    };

    const addTaskToLast = () => api.edit(d => {
        if (!d.sections.length) d.sections.push({ name: 'Phase 1', tasks: [] });
        d.sections[d.sections.length - 1].tasks.push({ label: 'New task', status: '', alias: '', start: { kind: 'date', value: fmtIso(Date.now()) }, dur: '3d', end: '' });
    }, true);

    const addSection = () => api.edit(d => {
        let k = d.sections.length + 1;
        while (d.sections.some(s => s.name === 'Phase ' + k)) k++;
        d.sections.push({ name: 'Phase ' + k, tasks: [] });
    }, true);

    const selRow = sel ? rowYs.find(r => r.si === sel.si && r.ti === sel.ti) : null;
    let pill = null;
    if (selRow) {
        const v = viewOf(selRow);
        const px = xOf(zoneRight(v)) + 12;
        const py = selRow.y - 8;
        const task = data.sections[selRow.si] && data.sections[selRow.si].tasks[selRow.ti];
        pill = task ? (
            <div className="fpill" style={clampPill(px, py, W)}>
                <UField style={{ width: 118 }} value={task.label} placeholder="task name"
                    onLive={val => api.edit(d => { const hh = d.sections[selRow.si] && d.sections[selRow.si].tasks[selRow.ti]; if (hh) hh.label = val; })}
                    onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                <USelect style={{ width: 96 }} value={task.status} options={[
                    { value: '', label: '—' },
                    { value: 'done', label: 'done' },
                    { value: 'active', label: 'active' },
                    { value: 'crit', label: 'crit' },
                    { value: 'milestone', label: 'milestone' },
                ]}
                    onLive={val => api.edit(d => { const hh = d.sections[selRow.si] && d.sections[selRow.si].tasks[selRow.ti]; if (hh) hh.status = val; })}
                    onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                <button type="button" className="mini-btn del" title="Delete task"
                    onClick={() => { api.edit(d => { const sec = d.sections[selRow.si]; if (sec) sec.tasks.splice(selRow.ti, 1); }, true); setSel(null); }}>✕</button>
            </div>
        ) : null;
    }
    function zoneRight(v) { return v.ed; }

    const ticks = niceTicks(Rg.min, Rg.max);
    const today = Date.now();
    const isMilestone = t => t.status === 'milestone';

    return (
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0 }}>
            <div className="viz-head" style={{ borderBottom: 'none', paddingBottom: 0 }}>
                <button type="button" onClick={addTaskToLast}>+ Task</button>
                <button type="button" onClick={addSection}>+ Section</button>
                <span style={{ fontSize: 11, marginLeft: 8 }}>drag bars to reschedule · edges to resize · click for details</span>
            </div>
            <div className="viz-body" ref={hostRef} onPointerDown={() => setSel(null)}>
                <svg width={W} height={H}>
                    {ticks.map((t, i) => (
                        <g key={'tk' + i}>
                            <line className="g-tick" x1={xOf(t)} y1={AXIS - 4} x2={xOf(t)} y2={H - 8} />
                            <text className="g-tick-txt" x={xOf(t)} y={AXIS - 10} textAnchor="middle">{dayLabel(t)}</text>
                        </g>
                    ))}
                    {today > Rg.min && today < Rg.max && (
                        <line className="g-today" x1={xOf(today)} y1={AXIS} x2={xOf(today)} y2={H - 8} />
                    )}
                    {(data.sections || []).map((sec, si) => {
                        const rowsHere = rowYs.filter(r => r.si === si);
                        if (!rowsHere.length) return null;
                        const bandTop = rowsHere[0].y - 26;
                        const bandBot = rowsHere[rowsHere.length - 1].y + 34;
                        return (
                            <g key={'sec' + si}>
                                <rect className="g-sec-band" x={0} y={bandTop} width={W} height={bandBot - bandTop} />
                                <line className="g-sec-line" x1={0} y1={bandBot} x2={W} y2={bandBot} />
                                <text className="g-tick-txt" x={10} y={bandTop + 17} style={{ fontWeight: 700, fill: '#7f96b4' }}>{sec.name || ''}</text>
                            </g>
                        );
                    })}
                    {rowYs.map(row => {
                        const t = row.t;
                        const v = viewOf(row);
                        const hasStart = t.start && (t.start.kind === 'after' ? (t.start.value || []).length : t.start.value);
                        const invalid = !t.label && !hasStart && !t.dur && !t.end;
                        if (invalid) return null;
                        const [bg, bd] = GANTT_STATUS_STYLE[t.status] || GANTT_STATUS_STYLE[''];
                        const selected = sel && sel.si === row.si && sel.ti === row.ti;
                        const x0 = xOf(Math.max(v.sd, Rg.min));
                        const x1 = xOf(Math.min(v.ed, Rg.max));
                        if (isMilestone(t)) {
                            const mx = xOf(v.sd), my = row.y + 17, s = 9;
                            return (
                                <g key={row.si + '-' + row.ti} className={'g-ms' + (selected ? ' g-bar sel' : '')}
                                   onPointerDown={e => barDown(row, 'body', e)}>
                                    <polygon
                                        points={`${mx},${my - s} ${mx + s},${my} ${mx},${my + s} ${mx - s},${my}`}
                                        fill={bg} stroke={bd} strokeWidth={2} />
                                    <text className="g-label" x={12} y={my + 4}>{t.label}</text>
                                </g>
                            );
                        }
                        return (
                            <g key={row.si + '-' + row.ti} className={'g-bar' + (selected ? ' sel' : '')}>
                                <rect x={x0} y={row.y + 8} width={Math.max(x1 - x0, 5)} height={19} rx={5}
                                    fill={bg} stroke={bd} strokeWidth={1.6}
                                    onPointerDown={e => barDown(row, 'body', e)} />
                                <rect className="g-grip" x={x0 - 3} y={row.y + 10} width={7} height={15} rx={3}
                                    onPointerDown={e => barDown(row, 'l', e)} />
                                <rect className="g-grip" x={x1 - 4} y={row.y + 10} width={7} height={15} rx={3}
                                    onPointerDown={e => barDown(row, 'r', e)} />
                                <text className="g-label" x={12} y={row.y + 22}
                                    onClick={e => { e.stopPropagation(); setSel({ si: row.si, ti: row.ti }); }}>{t.label}</text>
                            </g>
                        );
                    })}
                </svg>
                {!Rg.flat.length && <div className="viz-empty">No tasks yet — add one above.</div>}
                {pill}
            </div>
        </div>
    );
}

const SEQ_ARROW_STYLE = {
    solid: { dash: null, head: 's' },
    dotted: { dash: '5 4', head: 's' },
    open: { dash: null, head: 'o' },
    opendash: { dash: '5 4', head: 'o' },
    cross: { dash: null, head: 'x' },
    crossdash: { dash: '5 4', head: 'x' },
};
function seqArrowStyle(arrow) {
    if (arrow === '->>') return SEQ_ARROW_STYLE.solid;
    if (arrow === '-->>') return SEQ_ARROW_STYLE.dotted;
    if (arrow === '->') return SEQ_ARROW_STYLE.open;
    if (arrow === '-->') return SEQ_ARROW_STYLE.opendash;
    if (arrow === '-x') return SEQ_ARROW_STYLE.cross;
    if (arrow === '--x') return SEQ_ARROW_STYLE.crossdash;
    if (arrow === '-)' || arrow === '--)') return SEQ_ARROW_STYLE.open;
    return SEQ_ARROW_STYLE.solid;
}

function SeqVisual({ data, api }) {
    const hostRef = useRef(null);
    const [sel, setSel] = useState(null);
    const [ghostY, setGhostY] = useState(null);
    const [hotCol, setHotCol] = useState(null);
    const hotColRef = useRef(null);
    const [gapHover, setGapHover] = useState(null);
    const [, tickState] = useReducer(v => v + 1, 0);
    useEffect(() => { setSel(null); }, [data]);
    const size = useHostSize(hostRef, 760, 500);
    const W = size.w;
    const L = seqLayout(data, W);

    const ptX = e => { const r = hostRef.current.getBoundingClientRect(); return e.clientX - r.left; };
    const ptY = e => { const r = hostRef.current.getBoundingClientRect(); return e.clientY - r.top; };

    const insertMsgAt = idx => {
        const ps = data.participants;
        const a = ps[0] ? ps[0].id : 'A';
        const b = ps[1] ? ps[1].id : a;
        api.edit(d => { d.items.splice(idx, 0, { kind: 'msg', from: a, arrow: '->>', to: b, text: 'message' }); }, true);
        setSel({ type: 'item', idx });
    };

    const itemDown = (gi, e) => {
        e.stopPropagation();
        setSel({ type: 'item', idx: gi });
        const startY = e.clientY;
        let moved = false;
        const move = ev => {
            const dy = ev.clientY - startY;
            if (!moved && Math.abs(dy) > 6) moved = true;
            if (moved) setGhostY(Math.max(48, Math.min(L.height - 20, ptY(ev))));
        };
        const up = ev => {
            window.removeEventListener('pointermove', move);
            window.removeEventListener('pointerup', up);
            if (moved) {
                const gy = ptY(ev);
                const others = L.rows.filter(r => r.i !== gi);
                const target = others.filter(r => r.y + r.h / 2 < gy).length;
                if (target !== gi) {
                    api.edit(d => {
                        const [it] = d.items.splice(gi, 1);
                        d.items.splice(target, 0, it);
                    }, true);
                }
            }
            setGhostY(null);
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
    };

    const endPointDown = (gi, which, e) => {
        e.stopPropagation();
        const preSnap = api.snap();
        let armed = false;
        const move = ev => {
            if (!armed) { armed = true; api.pushPre(preSnap); }
            const x = ptX(ev);
            let best = null, bd = Infinity;
            for (const p of L.parts) {
                const d2 = Math.abs(L.cols[p.id] - x);
                if (d2 < bd) { bd = d2; best = p.id; }
            }
            hotColRef.current = best;
            setHotCol(best);
        };
        const up = () => {
            window.removeEventListener('pointermove', move);
            window.removeEventListener('pointerup', up);
            const target = hotColRef.current;
            hotColRef.current = null;
            setHotCol(null);
            if (target != null) {
                api.commit(d => {
                    const it = d.items[gi];
                    if (!it || it.kind !== 'msg') return;
                    if (which === 'from') it.from = target;
                    else it.to = target;
                });
            }
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
    };

    const headDown = (pi, id, e) => {
        e.stopPropagation();
        setSel({ type: 'part', pi });
        const startX = e.clientX;
        const gap = L.colGap || 120;
        const move = () => {};
        const up = ev => {
            window.removeEventListener('pointermove', move);
            window.removeEventListener('pointerup', up);
            const k = Math.round((ev.clientX - startX) / gap);
            if (k !== 0) {
                api.edit(d => {
                    const j = Math.max(0, Math.min(d.participants.length - 1, pi + k));
                    const [p] = d.participants.splice(pi, 1);
                    d.participants.splice(j, 0, p);
                }, true);
            }
        };
        window.addEventListener('pointerup', up);
    };

    const delPart = pid => api.edit(d => {
        d.participants = d.participants.filter(p => p.id !== pid);
        d.items = d.items.filter(it => {
            if (it.kind === 'msg') return it.from !== pid && it.to !== pid;
            if (it.kind === 'note') return !(it.who || []).includes(pid);
            if (it.kind === 'act') return it.who !== pid;
            return true;
        });
    }, true);

    const selItem = sel && sel.type === 'item' && L.rows.find(r => r.i === sel.idx);
    let pill = null;
    if (selItem) {
        const g = selItem;
        const it = g.it;
        const baseY = g.y + g.h + 6;
        const baseX = it.kind === 'msg' ? Math.max(g.x1, g.x2) + 14 : (g.x || L.M) + (g.w || 0) + 12;
        const pos = clampPill(baseX, baseY, W);
        if (it.kind === 'msg') {
            const pOpts = L.parts.map(p => ({ value: p.id, label: p.id }));
            pill = (
                <div className="fpill" style={pos}>
                    <USelect style={{ width: 74 }} value={it.from} options={pOpts}
                        onLive={v => api.edit(d => { if (d.items[g.i]) d.items[g.i].from = v; })}
                        onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                    <USelect style={{ width: 92 }} value={it.arrow} options={['->>', '-->>', '->', '-->', '-)', '--)', '-x', '--x'].map(a => ({ value: a, label: a }))}
                        onLive={v => api.edit(d => { if (d.items[g.i]) d.items[g.i].arrow = v; })}
                        onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                    <USelect style={{ width: 74 }} value={it.to} options={pOpts}
                        onLive={v => api.edit(d => { if (d.items[g.i]) d.items[g.i].to = v; })}
                        onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                    <UField style={{ width: 130 }} value={it.text} placeholder="message"
                        onLive={v => api.edit(d => { if (d.items[g.i]) d.items[g.i].text = v; })}
                        onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                    <button type="button" className="mini-btn del" title="Delete"
                        onClick={() => { api.edit(d => { d.items.splice(g.i, 1); }, true); setSel(null); }}>✕</button>
                </div>
            );
        } else if (it.kind === 'note') {
            pill = (
                <div className="fpill" style={pos}>
                    <USelect style={{ width: 84 }} value={it.pos} options={[{ value: 'over', label: 'over' }, { value: 'left', label: 'left of' }, { value: 'right', label: 'right of' }]}
                        onLive={v => api.edit(d => { if (d.items[g.i]) d.items[g.i].pos = v; })}
                        onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                    <UField mono style={{ width: 86 }} value={(it.who || []).join(',')} placeholder="A,B"
                        onLive={v => api.edit(d => { if (d.items[g.i]) d.items[g.i].who = v.split(',').map(x => x.trim()).filter(Boolean); })}
                        onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                    <UField style={{ width: 120 }} value={it.text} placeholder="note"
                        onLive={v => api.edit(d => { if (d.items[g.i]) d.items[g.i].text = v; })}
                        onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                    <button type="button" className="mini-btn del" title="Delete"
                        onClick={() => { api.edit(d => { d.items.splice(g.i, 1); }, true); setSel(null); }}>✕</button>
                </div>
            );
        } else if (it.kind === 'act') {
            const pOpts = L.parts.map(p => ({ value: p.id, label: p.id }));
            pill = (
                <div className="fpill" style={pos}>
                    <span style={{ fontSize: 11, color: 'var(--muted)' }}>{it.on ? 'activate' : 'deactivate'}</span>
                    <USelect style={{ width: 80 }} value={it.who} options={pOpts}
                        onLive={v => api.edit(d => { if (d.items[g.i]) d.items[g.i].who = v; })}
                        onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                    <button type="button" className="mini-btn" title="Toggle"
                        onClick={() => api.edit(d => { if (d.items[g.i]) d.items[g.i].on = !d.items[g.i].on; }, true)}>⇄</button>
                    <button type="button" className="mini-btn del" title="Delete"
                        onClick={() => { api.edit(d => { d.items.splice(g.i, 1); }, true); setSel(null); }}>✕</button>
                </div>
            );
        }
    }
    const selPart = sel && sel.type === 'part' ? (data.participants || [])[sel.pi] : null;
    if (selPart) {
        const px = L.cols[selPart.id] != null ? L.cols[selPart.id] : 100;
        pill = (
            <div className="fpill" style={clampPill(px - 90, 44, W)}>
                <UField style={{ width: 64 }} mono value={selPart.id} placeholder="id"
                    onLive={v => {
                        const nid = v.trim().replace(/[^\w.\-]/g, '');
                        const oldId = selPart.id;
                        if (!nid || nid === oldId) return;
                        if ((data.participants || []).some(p => p.id === nid)) return;
                        api.commit(d => {
                            const pp = d.participants[sel.pi];
                            if (!pp) return;
                            pp.id = nid;
                            for (const it of d.items) {
                                if (it.kind === 'msg') {
                                    if (it.from === oldId) it.from = nid;
                                    if (it.to === oldId) it.to = nid;
                                } else if (it.kind === 'note') {
                                    it.who = (it.who || []).map(w => (w === oldId ? nid : w));
                                } else if (it.kind === 'act') {
                                    if (it.who === oldId) it.who = nid;
                                }
                            }
                        });
                    }}
                    onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                <UField style={{ width: 104 }} value={selPart.label} placeholder="name"
                    onLive={v => api.edit(d => { const pp = d.participants[sel.pi]; if (pp) pp.label = v; })}
                    onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                <UCheck label="actor" checked={selPart.actor}
                    onLive={v => api.edit(d => { const pp = d.participants[sel.pi]; if (pp) pp.actor = v; })}
                    onCommitPre={{ snap: api.snap, push: api.pushPre }} />
                <button type="button" className="mini-btn del" title="Delete participant and its messages"
                    onClick={() => { delPart(selPart.id); setSel(null); }}>✕</button>
            </div>
        );
    }

    function markerId(head, accent) {
        return 'sq-' + head + (accent ? 'a' : '');
    }

    return (
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0 }}>
            <div className="viz-head" style={{ borderBottom: 'none', paddingBottom: 0 }}>
                <button type="button" onClick={() => insertMsgAt(L.items.length)}>+ Message</button>
                <button type="button" onClick={() => api.edit(d => {
                    const ps = d.participants;
                    const a = ps[0] ? ps[0].id : 'A';
                    d.items.push({ kind: 'note', pos: 'over', who: [a], text: 'note' });
                }, true)}>+ Note</button>
                <button type="button" onClick={() => api.edit(d => {
                    const ps = d.participants;
                    const a = ps[0] ? ps[0].id : 'A';
                    d.items.push({ kind: 'act', on: true, who: a });
                }, true)}>+ Act</button>
                <button type="button" onClick={() => api.edit(d => {
                    let i = d.participants.length + 1;
                    while (d.participants.some(p => p.id === 'P' + i)) i++;
                    d.participants.push({ id: 'P' + i, label: 'P' + i, actor: false });
                }, true)}>+ Participant</button>
                <span style={{ fontSize: 11, marginLeft: 8 }}>drag rows to reorder · dots to retarget · headers to reorder people</span>
            </div>
            <div className="viz-body" ref={hostRef} onPointerDown={() => setSel(null)}>
                <svg width={W} height={L.height}>
                    <defs>
                        {['s', 'o', 'x'].map(hd => ['n', 'a'].map(acc => (
                            <marker key={hd + acc} id={markerId(hd, acc === 'a')} viewBox="0 0 10 10" refX={hd === 'x' ? 6 : 8.5} refY="5"
                                markerWidth={hd === 'x' ? 9 : 7.5} markerHeight={hd === 'x' ? 9 : 7.5} orient="auto-start-reverse">
                                {hd === 's' && <path d="M0,0L10,5L0,10z" fill={acc === 'a' ? '#22d3ee' : '#8ba2bd'} />}
                                {hd === 'o' && <path d="M1,1L9,5L1,9" fill="none" stroke={acc === 'a' ? '#22d3ee' : '#8ba2bd'} strokeWidth="1.8" />}
                                {hd === 'x' && <path d="M2,2L8,8M8,2L2,8" stroke={acc === 'a' ? '#22d3ee' : '#8ba2bd'} strokeWidth="1.8" />}
                            </marker>
                        )))}
                    </defs>
                    {L.parts.map((p, pi) => {
                        const x = L.cols[p.id];
                        const hot = hotCol === p.id;
                        const isSel = sel && sel.type === 'part' && sel.pi === pi;
                        return (
                            <g key={p.id + pi}>
                                <line className={'s-life' + (hot ? ' s-life-hot' : '')} x1={x} y1={58} x2={x} y2={L.height - 14} />
                                <rect className={'s-head' + (p.actor ? ' actor-head' : '') + (isSel ? ' g-bar sel' : '')}
                                    x={x - 55} y={22} width={110} height={32} rx={8}
                                    onPointerDown={e => headDown(pi, p.id, e)}
                                    onDoubleClick={e => { e.stopPropagation(); setSel({ type: 'part', pi }); }} />
                                <text className="s-head-txt" x={x} y={42} textAnchor="middle">{p.id}{p.label !== p.id ? ' · ' + p.label : ''}</text>
                            </g>
                        );
                    })}
                    {L.spans.map((sp, i) => {
                        const x = L.cols[sp.who];
                        if (x == null) return null;
                        return <rect key={'ac' + i} className="s-act" x={x - 4.5} y={sp.y0 + 4} width={9} height={Math.max(sp.y1 - sp.y0 - 8, 8)} rx={2.5} />;
                    })}
                    {L.rows.map(g => {
                        const it = g.it;
                        const my = g.y + g.h / 2;
                        const isSel = sel && sel.type === 'item' && sel.idx === g.i;
                        if (it.kind === 'msg') {
                            const st = seqArrowStyle(it.arrow);
                            const acc = isSel;
                            const self = g.x1 === g.x2;
                            const dPath = self
                                ? `M${g.x1},${my} c 40,-14 52,8 4,12`
                                : `M${g.x1},${my} L${g.x2},${my}`;
                            const lw = C.textWidth(it.text || '') + 14;
                            return (
                                <g key={'r' + g.i} className={'s-msg' + (isSel ? ' sel' : '')}
                                    onPointerDown={e => itemDown(g.i, e)}>
                                    {data.autonumber && <text className="s-num" x={Math.min(g.x1, g.x2) - 26} y={my + 3}>{g.num}.</text>}
                                    <path className="line" d={dPath}
                                        strokeDasharray={st.dash || undefined}
                                        stroke={acc ? '#22d3ee' : '#8ba2bd'}
                                        markerEnd={`url(#${markerId(st.head, acc)})`} />
                                    <rect x={(g.x1 + g.x2) / 2 - lw / 2} y={my - 21} width={lw} height={15} rx={4}
                                        fill="rgba(13,21,38,.85)" stroke={isSel ? 'rgba(34,211,238,.5)' : 'transparent'} />
                                    <text className="s-msg-txt" x={(g.x1 + g.x2) / 2} y={my - 10} textAnchor="middle">{it.text}</text>
                                    {isSel && !self && (<React.Fragment>
                                        <circle className="s-endpoint" cx={g.x1} cy={my} r={5.5}
                                            onPointerDown={e => endPointDown(g.i, 'from', e)} />
                                        <circle className="s-endpoint" cx={g.x2} cy={my} r={5.5}
                                            onPointerDown={e => endPointDown(g.i, 'to', e)} />
                                    </React.Fragment>)}
                                </g>
                            );
                        }
                        if (it.kind === 'note') {
                            const nw = g.w || 80;
                            return (
                                <g key={'r' + g.i} onPointerDown={e => itemDown(g.i, e)}>
                                    <rect className={'s-note-box' + (isSel ? ' sel' : '')} x={g.x} y={my - 13} width={nw} height={26} rx={6} />
                                    <text className="s-note-txt" x={g.x + nw / 2} y={my + 4} textAnchor="middle">{it.text}</text>
                                </g>
                            );
                        }
                        return (
                            <g key={'r' + g.i} onPointerDown={e => itemDown(g.i, e)}>
                                <rect className={'s-act' + (isSel ? ' g-bar sel' : '')} x={(L.cols[it.who] || 0) - 4.5} y={g.y} width={9} height={g.h} rx={2.5} />
                            </g>
                        );
