<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mermaid Studio — visual ⇄ mermaid diagram editor</title>
<style>
:root {
    --bg: #0b1220;
    --card: #111a2e;
    --card2: #0e1626;
    --border: #223047;
    --border2: #2d405e;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #22d3ee;
    --accent-dim: rgba(34, 211, 238, 0.14);
    --good: #34d399;
    --warn: #fbbf24;
    --bad: #f43f5e;
    color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
}
#root { height: 100%; display: flex; flex-direction: column; }
button, select {
    font-family: inherit;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 12.5px;
    padding: 6px 10px;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .05s;
    white-space: nowrap;
}
button:hover, select:hover { border-color: var(--border2); background: #14203a; }
button:active { transform: scale(.97); }
button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
button.primary { background: rgba(34,211,238,.12); border-color: rgba(34,211,238,.4); color: var(--accent); }
button.danger:hover { border-color: var(--bad); color: var(--bad); }
select { padding-right: 22px; }

#topbar {
    display: flex; align-items: center; gap: 8px;
    height: 50px; padding: 0 14px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    flex-wrap: nowrap; overflow-x: auto; overflow-y: visible; flex: none;
}
#topbar::-webkit-scrollbar { height: 0; }
.brand { display: flex; align-items: baseline; gap: 7px; margin-right: 10px; white-space: nowrap; }
.brand b { font-size: 15.5px; letter-spacing: -.01em; }
.brand .sub { color: var(--muted); font-size: 11px; }
.tb-sep { width: 1px; height: 22px; background: var(--border); flex: none; margin: 0 2px; }
.tb-group { display: flex; align-items: center; gap: 5px; }
.spacer { flex: 1; }
.saveChip {
    font-size: 11px; color: var(--muted); white-space: nowrap;
    transition: color .3s; min-width: 52px; text-align: right;
}
.saveChip.flash { color: var(--good); }
.icon-btn { width: 30px; text-align: center; padding: 6px 0; }

.mode-tabs { display: flex; align-items: center; gap: 4px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
.mode-tab { border: 1px solid transparent; background: transparent; border-radius: 7px; padding: 4px 10px; font-size: 12px; color: var(--muted); }
.mode-tab:hover { background: #14203a; color: var(--text); }
.mode-tab.on { background: var(--accent-dim); border-color: rgba(34,211,238,.45); color: var(--accent); }

#main { display: flex; flex: 1; min-height: 0; }

.palette {
    width: 158px; flex: none;
    background: var(--card);
    border-right: 1px solid var(--border);
    padding: 10px;
    overflow-y: auto;
    transition: width .18s ease, padding .18s ease;
}
body.pal-hidden .palette { width: 0; padding: 0; overflow: hidden; border-right-width: 0; }
.palette h3 {
    margin: 4px 2px 8px; font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted);
}
.pal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 16px; }
.pal-tile {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 8px 4px 6px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    cursor: grab; user-select: none;
    transition: border-color .15s, background .15s;
}
.pal-tile:hover { border-color: var(--accent); background: var(--accent-dim); }
.pal-tile:active { cursor: grabbing; }
.pal-tile svg { width: 30px; height: 22px; }
.pal-tile span { font-size: 9.5px; color: var(--muted); letter-spacing: .02em; }
.pal-tip { font-size: 10.5px; line-height: 1.55; color: var(--muted); padding: 0 2px; }
.pal-tip b { color: var(--text); font-weight: 600; }
.pal-tip code {
    background: var(--card2); border: 1px solid var(--border); border-radius: 4px;
    padding: 0 4px; font-size: 9.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}

.canvas-wrap {
    position: relative; flex: 1; min-width: 200px; overflow: hidden;
    background:
        radial-gradient(rgba(148,163,184,.13) 1px, transparent 1.4px),
        var(--bg);
    background-size: 22px 22px, auto;
}
.board { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

.board .node { cursor: move; }
.board .node .shape { fill: #131f36; stroke: #4a6079; stroke-width: 1.6; transition: filter .12s; }
.board .node .shape-detail { fill: none; stroke: #4a6079; stroke-width: 1.4; pointer-events: none; }
.board .node.sel .shape { stroke: var(--accent); filter: drop-shadow(0 0 6px rgba(34,211,238,.45)); }
.board .node text { fill: #dbe6f3; font-size: 13px; font-weight: 600; pointer-events: none; user-select: none; }
.board .node .handle { fill: #0b1220; stroke: var(--accent); stroke-width: 2; opacity: 0; cursor: crosshair; transition: opacity .12s; r: 5.5; }
.board .node:hover .handle, .board .node.sel .handle { opacity: 1; }
.board .handle:hover { fill: var(--accent); }

.board .edge .hit { stroke: transparent; stroke-width: 16; fill: none; pointer-events: stroke; cursor: pointer; }
.board .edge .line { stroke: #7e93ae; stroke-width: 1.7; fill: none; pointer-events: none; transition: stroke .12s; }
.board .edge.k-thick .line { stroke-width: 3; }
.board .edge.k-dotted .line { stroke-dasharray: 5 5; }
.board .edge:hover .line { stroke: #b9c8dc; }
.board .edge.sel .line { stroke: var(--accent); }
.board .edge .elabel rect { fill: rgba(13,21,38,.92); stroke: var(--border); }
.board .edge .elabel text { fill: #b6c4d8; font-size: 11.5px; font-weight: 500; user-select: none; }
.board .edge.sel .elabel rect { stroke: var(--accent); }

.board .sg-box { cursor: move; }
.board .sg-box rect { fill: rgba(34,211,238,.03); stroke: #35507a; stroke-width: 1.4; stroke-dasharray: 7 5; rx: 14; }
.board .sg-box.sel rect { stroke: var(--accent); fill: rgba(34,211,238,.06); }
.board .sg-box text { fill: #7f96b4; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; user-select: none; }

.band {
    position: absolute; display: none; z-index: 30;
    border: 1px solid var(--accent);
    background: rgba(34,211,238,.08);
    pointer-events: none;
}
.board .tempLayer path { stroke: var(--accent); stroke-width: 1.8; stroke-dasharray: 6 5; fill: none; pointer-events: none; }

.pill {
    position: absolute; z-index: 40; display: none;
    background: var(--card); border: 1px solid var(--border2); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    padding: 5px 6px; align-items: center; gap: 5px;
}
.pill button { padding: 4px 7px; font-size: 11.5px; border-radius: 6px; }
.pill .swatches { display: flex; gap: 4px; padding: 0 3px; }
.sw {
    width: 17px; height: 17px; border-radius: 5px; cursor: pointer;
    border: 1.6px solid transparent; padding: 0;
}
.sw.cur { border-color: #fff; }
.sw.default { background: linear-gradient(135deg, #16233c 55%, #4a6079 55%); }
.pill-shape-name { font-size: 11px; color: var(--muted); min-width: 56px; text-align: center; }

.editor-overlay {
    position: absolute; z-index: 50; display: none;
    background: #101c33; color: var(--text);
    border: 1px solid var(--accent); border-radius: 8px;
    font: 600 13px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 6px 8px; outline: none; resize: none;
    box-shadow: 0 8px 28px rgba(0,0,0,.55);
    min-width: 90px; max-width: 260px;
    line-height: 1.3; overflow: hidden;
}

.stats {
    position: absolute; left: 12px; bottom: 10px; z-index: 20;
    display: flex; gap: 6px; pointer-events: none;
}
.chip {
    background: rgba(13,21,38,.85); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px 10px; font-size: 10.5px; color: var(--muted);
    backdrop-filter: blur(4px);
}
.empty-hint {
    position: absolute; inset: 0; display: flex; z-index: 5;
    align-items: center; justify-content: center; text-align: center;
    color: var(--muted); font-size: 13.5px; line-height: 1.7; pointer-events: none;
}
.empty-hint b { color: var(--text); }

.sheet-shell {
    flex: 1; min-width: 200px; overflow-y: auto;
    padding: 16px 18px 40px;
}
.sheet-inner { max-width: 760px; margin: 0 auto; }
.scard {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 14px;
}
.scard-h {
    display: flex; align-items: center; gap: 8px;
    font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted);
    margin-bottom: 10px;
}
.scard-h .grow { flex: 1; }
.scard-h button { font-size: 10.5px; padding: 3px 8px; text-transform: none; letter-spacing: 0; }
.sin {
    font-family: inherit; font-size: 12.5px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
    padding: 5px 8px; outline: none; min-width: 0;
}
.sin:focus { border-color: var(--accent); }
.sin.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
.trow {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 6px 6px; border-radius: 8px; border: 1px solid transparent;
}
.trow + .trow { margin-top: 2px; }
.trow:hover { background: rgba(148,163,184,.05); }
.trow.row-warn { border-color: rgba(251,191,36,.35); background: rgba(251,191,36,.06); }
.mini-btn {
    width: 24px; height: 24px; padding: 0; text-align: center; font-size: 12px;
    border-radius: 6px; color: var(--muted); flex: none;
}
.mini-btn:hover { color: var(--text); }
.mini-btn.del:hover { color: var(--bad); border-color: var(--bad); }
.sheet-empty { color: var(--muted); font-size: 12px; padding: 8px 6px; font-style: italic; }
.sheet-note { color: var(--muted); font-size: 11.5px; margin-top: 8px; line-height: 1.6; }
.grow { flex: 1; }

.right-panel {
    width: 430px; flex: none; display: flex; flex-direction: column;
    background: var(--card); border-left: 1px solid var(--border);
    transition: width .18s ease, padding .18s ease;
    overflow: hidden;
}
body.focus-mode .right-panel { width: 0; border-left-width: 0; }
.rp-head {
    display: flex; align-items: center; gap: 6px;
    padding: 9px 12px 7px;
    font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap; flex: none;
}
.rp-head .grow { flex: 1; }
.rp-head button { font-size: 10.5px; padding: 3px 8px; text-transform: none; letter-spacing: 0; }
.code-ta {
    flex: 0 0 44%;
    width: 100%; resize: none; border: none; outline: none;
    background: var(--bg); color: #cfe3f5;
    caret-color: var(--accent);
    font: 12.5px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding: 12px 14px;
    tab-size: 4;
    white-space: pre;
}
.sync-row {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-bottom: 1px solid var(--border);
    min-height: 29px; font-size: 11.5px;
}
.sync-chip.ok::before { content: "✓ "; color: var(--good); }
.sync-chip.editing::before { content: "✍ "; color: var(--warn); }
.sync-chip.error { color: var(--bad); }
.err-chip { color: #fda4af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: right; }
.warn-chip { color: #fcd34d; }
.preview {
    flex: 1; overflow: auto; background: var(--bg);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 14px;
    min-height: 80px;
}
.preview svg { max-width: 100% !important; height: auto !important; }
.preview-msg { color: var(--muted); font-size: 12px; padding: 18px; text-align: center; line-height: 1.6; }
.preview-msg.err { color: #fda4af; }

.toasts {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 7px; z-index: 300;
    pointer-events: none;
}
.toast {
    background: #17233d; border: 1px solid var(--border2); color: var(--text);
    padding: 8px 16px; border-radius: 10px; font-size: 12.5px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    animation: toastIn .22s ease;
}
.toast.err { border-color: rgba(244,63,94,.5); color: #fecdd3; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }

.help-modal {
    position: fixed; inset: 0; z-index: 400;
    background: rgba(5,10,20,.72); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; padding: 20px;
}
.help-card {
    background: var(--card); border: 1px solid var(--border2); border-radius: 16px;
    max-width: 900px; width: 100%; max-height: 88vh; overflow-y: auto;
    padding: 26px 30px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
}
.help-card h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.01em; }
.help-card .hsub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
.help-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
.help-cols h4 { margin: 14px 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--accent); }
table.keys { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.keys td { padding: 4.5px 6px; border-bottom: 1px solid rgba(34,48,71,.55); vertical-align: top; }
table.keys td:first-child { white-space: nowrap; width: 130px; }
kbd {
    background: var(--card2); border: 1px solid var(--border2); border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 6px; font-size: 10.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
ul.syn { margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 1.75; color: #c3cfdd; }
ul.syn code { color: var(--accent); font-size: 11.5px; }
.muted-note { color: var(--muted); font-size: 12px; line-height: 1.6; margin-top: 10px; }
.help-close { float: right; }

.viz-shell {
    flex: 1; min-width: 200px; display: flex; flex-direction: column;
    background: var(--bg); overflow: hidden;
}
.viz-head {
    border-bottom: 1px solid var(--border);
    padding: 8px 12px; flex: none; text-transform: none; letter-spacing: 0;
    font-size: 12px; color: var(--muted);
}
.viz-head button { font-size: 11px; padding: 3px 9px; }
.viz-body {
    flex: 1; overflow: auto; position: relative;
    background:
        radial-gradient(rgba(148,163,184,.10) 1px, transparent 1.4px),
        var(--bg);
    background-size: 22px 22px, auto;
}
.viz-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; pointer-events: none; }

.fpill {
    position: absolute; z-index: 30;
    background: var(--card); border: 1px solid var(--border2); border-radius: 10px;
    box-shadow: 0 10px 26px rgba(0,0,0,.55);
    padding: 6px 7px; display: flex; align-items: center; gap: 5px; flex-wrap: nowrap;
}
.fpill .sin, .fpill select { font-size: 11.5px; padding: 3px 6px; }
.fpill button { padding: 3px 7px; font-size: 11.5px; border-radius: 6px; }

.g-sec-band { fill: rgba(34,211,238,.05); }
.g-sec-line { stroke: rgba(148,163,184,.14); stroke-width: 1; }
.g-tick { stroke: rgba(148,163,184,.12); stroke-width: 1; }
.g-tick-txt { fill: #64748b; font-size: 10px; user-select: none; }
.g-label { fill: #c3cfdd; font-size: 11.5px; font-weight: 600; cursor: pointer; user-select: none; }
.g-bar { cursor: grab; }
.g-bar:hover { filter: brightness(1.18); }
.g-bar.sel { filter: drop-shadow(0 0 6px rgba(34,211,238,.5)); }
.g-grip { fill: rgba(255,255,255,.22); cursor: ew-resize; }
.g-grip:hover { fill: rgba(255,255,255,.55); }
.g-ms { cursor: grab; }
.g-today { stroke: #fb7185; stroke-width: 1.4; stroke-dasharray: 4 4; opacity: .8; }

.s-life { stroke: rgba(148,163,184,.28); stroke-width: 1.2; stroke-dasharray: 5 5; }
.s-life-hot { stroke: var(--accent); stroke-width: 2; }
.s-head { fill: #16233c; stroke: #4a6079; stroke-width: 1.5; cursor: grab; rx: 8; }
.s-head.actor-head { fill: #172a44; stroke: #38bdf8; }
.s-head-txt { fill: #e2e8f0; font-size: 12px; font-weight: 700; user-select: none; pointer-events: none; }
.s-msg { cursor: pointer; }
.s-msg .line { stroke-width: 1.8; fill: none; }
.s-msg:hover .line { stroke-width: 2.6; }
.s-msg.sel .line { stroke: var(--accent); }
.s-msg-txt { fill: #b6c4d8; font-size: 11px; font-weight: 600; user-select: none; pointer-events: none; }
.s-num { fill: #64748b; font-size: 10px; font-weight: 700; }
.s-note-box { fill: rgba(251,191,36,.12); stroke: #b48a2a; stroke-width: 1.2; rx: 6; }
.s-note-txt { fill: #fde68a; font-size: 11px; font-weight: 600; user-select: none; pointer-events: none; }
.s-note-box.sel, .s-note-box:hover { stroke: var(--warn); }
.s-act { fill: rgba(34,211,238,.35); stroke: #67e8f9; stroke-width: 1; }
.s-endpoint { fill: #0b1220; stroke: var(--accent); stroke-width: 2; cursor: col-resize; }
.s-ins { fill: transparent; cursor: copy; }
.s-ins-btn { fill: #14203a; stroke: var(--accent); cursor: copy; }
.s-dragline { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; pointer-events: none; }

.p-slice { stroke: #0b1220; stroke-width: 2; cursor: pointer; transition: filter .12s; }
.p-slice:hover { filter: brightness(1.15); }
.p-slice.sel { filter: brightness(1.25) drop-shadow(0 0 8px rgba(34,211,238,.45)); }
.p-handle { fill: #0b1220; stroke: #e2e8f0; stroke-width: 1.6; cursor: move; }
.p-handle:hover { fill: var(--accent); }
.p-total { fill: #94a3b8; font-size: 12px; font-weight: 700; text-anchor: middle; user-select: none; pointer-events: none; }
.p-title { fill: #cbd5e1; font-size: 14px; font-weight: 700; user-select: none; }

@media (max-width: 900px) {

    .right-panel { position: absolute; right: 0; top: 50px; bottom: 0; z-index: 60; box-shadow: -12px 0 40px rgba(0,0,0,.5); }
    body:not(.focus-mode) .right-panel { width: min(430px, 86vw); }
    .palette { display: none; }
    .brand .sub { display: none; }
}
</style>

<div id="root"></div>

<script>
'use strict';

(function () {
const SVG_NS = 'http://www.w3.org/2000/svg';
const FONT_STACK = "ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
const LH = 17;
const GRID = 16;

const SHAPES = {
    rect:     { name: 'Box',       padX: 14, padY: 10, sx: 1,    sy: 1,    minW: 74, minH: 36, open: '[',  close: ']' },
    round:    { name: 'Rounded',   padX: 16, padY: 10, sx: 1,    sy: 1,    minW: 78, minH: 36, open: '(',  close: ')' },
    stadium:  { name: 'Stadium',   padX: 20, padY: 9,  sx: 1,    sy: 1,    minW: 86, minH: 38, open: '([', close: '])' },
    sub:      { name: 'Subroutine',padX: 20, padY: 10, sx: 1,    sy: 1,    minW: 88, minH: 40, open: '[[', close: ']]' },
    cyl:      { name: 'Database',  padX: 16, padY: 15, sx: 1,    sy: 1,    minW: 82, minH: 50, open: '[(', close: ')]' },
    circle:   { name: 'Circle',    padX: 18, padY: 14, sx: 1,    sy: 1,    minW: 58, minH: 58, square: true, open: '((', close: '))' },
    diamond:  { name: 'Decision',  padX: 4,  padY: 4,  sx: 1.55, sy: 1.62, minW: 98, minH: 68, open: '{',  close: '}' },
    hex:      { name: 'Hexagon',   padX: 14, padY: 9,  sx: 1.3,  sy: 1.4,  minW: 94, minH: 46, open: '{{', close: '}}' },
    para:     { name: 'Flag',      padX: 22, padY: 10, sx: 1,    sy: 1,    minW: 86, minH: 38, open: '>',  close: ']' },
};
const SHAPE_ORDER = Object.keys(SHAPES);

const SWATCHES = [
    { name: 'Default', style: null },
    { name: 'Sky',     style: { fill: '#0c4a6e', stroke: '#38bdf8', color: '#e0f2fe' } },
    { name: 'Emerald', style: { fill: '#064e3b', stroke: '#34d399', color: '#d1fae5' } },
    { name: 'Amber',   style: { fill: '#78350f', stroke: '#fbbf24', color: '#fffbeb' } },
    { name: 'Rose',    style: { fill: '#881337', stroke: '#fb7185', color: '#ffe4e6' } },
    { name: 'Violet',  style: { fill: '#4c1d95', stroke: '#a78bfa', color: '#ede9fe' } },
];

const KINDS = {
    arrow:  { op: '-->', head: true,  name: 'Arrow' },
    open:   { op: '---', head: false, name: 'Line' },
    dotted: { op: '-.->', head: true,  name: 'Dotted' },
    thick:  { op: '==>', head: true,  name: 'Thick' },
};

function escLabel(s) {
    return String(s).replace(/"/g, '#quot;').replace(/\n/g, ' ').trim();
}
function unescLabel(s) {
    return s.replace(/\\(["'])/g, '$1').replace(/(#quot;|&#quot;|#quot)/g, '"').trim();
}

let measCtx = null;
try { measCtx = typeof document !== 'undefined' ? document.createElement('canvas').getContext('2d') : null; } catch (e) { measCtx = null; }

function fontSpec() { return '600 13px ' + FONT_STACK; }
const textWidth = t => (measCtx ? measCtx.measureText(t).width : String(t).length * 7.4);

function wrapText(text) {
    if (measCtx) measCtx.font = fontSpec();
    const maxW = 180, out = [];
    const paras = String(text).split('\n');
    for (const p of paras) {
        const words = p.split(' ').filter(w => w !== '');
        if (!words.length) { out.push(''); continue; }
        let line = '';
        for (let word of words) {
            while (textWidth(word) > maxW && word.length > 4) {
                let k = word.length;
                while (k > 1 && textWidth(word.slice(0, k)) > maxW) k--;
                const head = word.slice(0, k), tail = word.slice(k);
                if (line) { out.push(line); line = ''; }
                out.push(head);
                word = tail;
            }
            const cand = line ? line + ' ' + word : word;
            if (textWidth(cand) <= maxW || !line) line = cand;
            else { out.push(line); line = word; }
        }
        if (line) out.push(line);
    }
    let tw = 0;
    for (const l of out) tw = Math.max(tw, textWidth(l));
    return { lines: out, tw };
}

function sizeNode(n) {
    const S = SHAPES[n.shape] || SHAPES.rect;
    const { lines, tw } = wrapText(n.label === '' || n.label == null ? n.id : n.label);
    const tW = Math.min(Math.max(tw, 24), 240);
    let w = Math.max((tW + S.padX * 2) * S.sx, S.minW);
    let h = Math.max((Math.max(lines.length, 1) * LH + S.padY * 2) * S.sy, S.minH);
    if (S.square) { const m = Math.max(w, h); w = h = m; }
    n.w = Math.round(w); n.h = Math.round(h);
    n._lines = lines;
}

function anchorOf(n, side) {
    switch (side) {
        case 'l': return { x: n.x - n.w / 2, y: n.y };
        case 'r': return { x: n.x + n.w / 2, y: n.y };
        case 't': return { x: n.x, y: n.y - n.h / 2 };
        default: return { x: n.x, y: n.y + n.h / 2 };
    }
}
function sideTowards(n, tx, ty) {
    const dx = tx - n.x, dy = ty - n.y;
    const fx = dx / Math.max(n.w / 2, 1), fy = dy / Math.max(n.h / 2, 1);
    return Math.abs(fx) > Math.abs(fy) ? (fx > 0 ? 'r' : 'l') : (fy > 0 ? 'b' : 't');
}

const ID_RE = /^[\p{L}_][\p{L}\p{N}_\-]*$/u;

function tryEdgeAt(s, i) {
    const rest = s.slice(i);
    let m;
    const finish = (kind, consumed, embedded) => {
        let len = consumed;
        let label = embedded != null ? embedded.trim() : null;
        const tail = rest.slice(consumed);
        const pm = /^[ \t]*\|([^|\n]*)\|[ \t]*/.exec(tail);
        if (pm) { label = pm[1]; len += pm[0].length; }
        else {
            const ws = /^[ \t]+/.exec(tail);
            if (ws) len += ws[0].length;
        }
        if (label != null) {
            const q = /^"([\s\S]*)"$/, sq = /^'([\s\S]*)'$/;
            const qm = q.exec(label) || sq.exec(label);
            if (qm) label = qm[1];
            label = unescLabel(label);
        }
        return { kind, label, len };
    };
    if ((m = /^-\.\s*([^\n.]*?)\s*\.+\s*-{1,3}>/.exec(rest))) return finish('dotted', m[0].length, m[1]);
    if ((m = /^-\.-*-*>/.exec(rest))) return finish('dotted', m[0].length);
    if ((m = /^-\.-/.exec(rest))) return finish('dotted', m[0].length);
    if (/^-->/.test(rest)) return finish('arrow', 3);
    if (/^---(?![\w-])/.test(rest)) return finish('open', 3);
    if (/^==>/.test(rest)) return finish('thick', 3);
    if (/^===/.test(rest)) return finish('open', 3);
    if ((m = /^={2}[ \t]*([^=\n]*?)[ \t]*={2,}>/.exec(rest))) return finish('thick', m[0].length, m[1]);
    if ((m = /^--[ \t]*([^>\n]*?)[ \t]*-->/.exec(rest))) return finish('arrow', m[0].length, m[1]);
    if ((m = /^--[ \t]*([^>\n]*?)[ \t]*---(?![->])/.exec(rest))) return finish('open', m[0].length, m[1]);
    if ((m = /^--[ \t]*([^>\-\n]*?)[ \t]*==>/.exec(rest))) return finish('thick', m[0].length, m[1]);
    if ((m = /^~~~/.exec(rest))) return finish('dotted', 3);
    return null;
}

function readChunk(s, i) {
    let j = i, depth = 0, q = null;
    while (j < s.length) {
        const c = s[j];
        if (q) {
            if (c === '\\') { j += 2; continue; }
            if (c === q) q = null;
            j++; continue;
        }
        if (c === '"' || c === "'") { q = c; j++; continue; }
        if (c === '[' || c === '(' || c === '{') depth++;
        else if (c === ']' || c === ')' || c === '}') {
            depth--;
            if (depth < 0) {
                if (c === ']' && s.slice(i, j).includes('>')) j++;
                break;
            }
        }
        else if (depth === 0) {
            if (c === '&') { j++; continue; }
            if (/[ \t]/.test(c)) {
                let k = j;
                while (k < s.length && /[ \t]/.test(s[k])) k++;
                const nxt = s[k];
                if (nxt == null) { j = k; break; }
                if (nxt === '&') { j = k + 1; continue; }
                if (tryEdgeAt(s, k)) break;
                j = k; continue;
            }
            if (j > i && (c === '-' || c === '=' || c === '|')) {
                if (tryEdgeAt(s, j)) break;
            }
        }
        j++;
    }
    return s.slice(i, j);
}

function splitRefs(chunk) {
    const out = [];
    let cur = '', depth = 0, q = null;
    for (let i = 0; i < chunk.length; i++) {
        const c = chunk[i];
        if (q) { cur += c; if (c === '\\') { cur += chunk[++i] || ''; continue; } if (c === q) q = null; continue; }
        if (c === '"' || c === "'") { q = c; cur += c; continue; }
        if ('([{'.includes(c)) depth++;
        if (')]}'.includes(c)) depth = Math.max(0, depth - 1);
        if (c === '&' && depth === 0) { out.push(cur); cur = ''; continue; }
        cur += c;
    }
    out.push(cur);
    return out.map(x => x.trim()).filter(Boolean);
}

function parseNodeDef(raw) {
    raw = raw.trim();
    let m = /^([\p{L}_][\p{L}\p{N}_\-]*)\s*([\s\S]*)$/u.exec(raw);
    if (!m) throw new Error('bad node "' + raw.slice(0, 24) + '"');
    const id = m[1];
    let rest = m[2].trim();
    let shape = 'rect', label = null;
    const stripQ = inner => {
        inner = inner.trim();
        const q = /^"([\s\S]*)"$/.exec(inner) || /^'([\s\S]*)'$/.exec(inner);
        return q ? q[1] : inner;
    };
    let mm;
    const defined = rest !== '';
    if (rest === '') {
        label = null;
    } else if ((mm = /^\(\[\s*([\s\S]*?)\s*\]\)$/.exec(rest))) { shape = 'stadium'; label = stripQ(mm[1]); }
    else if ((mm = /^\[\[\s*([\s\S]*?)\s*\]\]$/.exec(rest))) { shape = 'sub'; label = stripQ(mm[1]); }
    else if ((mm = /^\[\(\s*([\s\S]*?)\s*\)\]$/.exec(rest))) { shape = 'cyl'; label = stripQ(mm[1]); }
    else if ((mm = /^\(\(\s*([\s\S]*?)\s*\)\)$/.exec(rest))) { shape = 'circle'; label = stripQ(mm[1]); }
    else if ((mm = /^\{\{\s*([\s\S]*?)\s*\}\}$/.exec(rest))) { shape = 'hex'; label = stripQ(mm[1]); }
    else if ((mm = /^\{\s*([\s\S]*?)\s*\}$/.exec(rest))) { shape = 'diamond'; label = stripQ(mm[1]); }
    else if ((mm = /^>\s*"?([\s\S]*?)"?\s*\]$/.exec(rest))) { shape = 'para'; label = mm[1]; }
    else if ((mm = /^\[\s*([\s\S]*?)\s*\]$/.exec(rest))) { shape = 'rect'; label = stripQ(mm[1]); }
    else if ((mm = /^\(\s*([\s\S]*?)\s*\)$/.exec(rest))) { shape = 'round'; label = stripQ(mm[1]); }
    else throw new Error('unknown shape syntax "' + rest.slice(0, 24) + '"');
    return { id, label: label == null ? id : unescLabel(label), shape, defined };
}

function parseStyleKv(str) {
    const o = {};
    for (const part of str.split(',')) {
        const kv = part.split(':');
        if (kv.length < 2) continue;
        const key = kv.shift().trim().toLowerCase();
        const val = kv.join(':').trim();
        if (['fill', 'stroke', 'color'].includes(key) && val) o[key] = val;
    }
    return Object.keys(o).length ? o : null;
}

function nextSgIdFor(res) {
    let i = 1;
    const taken = new Set([...res.nodes.map(n => n.id), ...res.sgs.map(s => s.id)]);
    while (taken.has('SG' + i)) i++;
    return 'SG' + i;
}

function parseFlowchart(text) {
    const res = { dir: 'TB', nodes: [], edges: [], sgs: [], errors: [], warnings: [] };
    const index = new Map();
    const classDefs = new Map();
    const lines = text.split(/\r?\n/);
    let sawHeader = false;
    let sgStack = [];

    for (const t of lines) {
        const tt = t.trim();
        const cm = /^classDef\s+([\w-]+)\s+(.+)$/.exec(tt);
        if (cm) classDefs.set(cm[1], parseStyleKv(cm[2]));
    }

    const ensureNode = (def) => {
        let n = index.get(def.id);
        if (!n) {
            n = { id: def.id, label: def.label, shape: def.shape };
            index.set(def.id, n);
            res.nodes.push(n);
        } else if (def.defined) {
            n.label = def.label;
            n.shape = def.shape;
        }
        if (sgStack.length) {
            const sg = sgStack[sgStack.length - 1];
            if (!sg.members.includes(def.id)) sg.members.push(def.id);
        }
        return n;
    };

    for (let li = 0; li < lines.length; li++) {
        const t = lines[li].trim(), ln = li + 1;
        if (!t || t.startsWith('%%')) continue;
        let m;
        if (!sawHeader) {
            if ((m = /^(flowchart|graph)\s+(TB|TD|BT|RL|LR)$/i.exec(t))) {
                const d = m[2].toUpperCase();
                res.dir = d === 'TD' ? 'TB' : d;
                sawHeader = true;
            } else {
                res.errors.push({ line: ln, msg: 'expected a "flowchart TD" header first' });
                return res;
            }
            continue;
        }
        if ((m = /^classDef\s+/.exec(t))) continue;
        if ((m = /^class\s+([\w\s,-]+?)\s+([\w-]+)\s*$/.exec(t))) {
            const cd = classDefs.get(m[2]);
            if (cd) for (const id of m[1].split(',').map(x => x.trim()).filter(Boolean)) {
                const n = index.get(id);
                if (n) n.style = Object.assign({}, cd, n.style || {});
            }
            continue;
        }
        if ((m = /^style\s+([\w\s,-]+?)\s+(.+)$/.exec(t))) {
            const st = parseStyleKv(m[2]);
            if (st) for (const id of m[1].split(',').map(x => x.trim()).filter(Boolean)) {
                const n = index.get(id);
                if (n) n.style = Object.assign({}, n.style || {}, st);
            }
            continue;
        }
        if (/^(linkStyle|click|call|accTitle|accDescr)\b/.test(t)) { res.warnings.push({ line: ln, msg: t.split(/\s/)[0] + ' ignored' }); continue; }
        if ((m = /^direction\s+(TB|BT|RL|LR)\s*$/i.exec(t))) { res.warnings.push({ line: ln, msg: 'nested direction ignored' }); continue; }
        if ((m = /^subgraph\b\s*(.*)$/i.exec(t))) {
            const decl = m[1].trim();
            let id = null, title = null;
            const bm = /^([\w-]+)\s*(?:[(\[]\s*"?(.*?)"?\s*[)\]]|"?(.*?)"?)$/.exec(decl);
            if (decl.startsWith('"')) {
                title = unescLabel(decl.replace(/^"([\s\S]*)"$/, '$1'));
                id = nextSgIdFor(res);
            } else if (bm) {
                id = bm[1];
                title = unescLabel(bm[2] != null ? bm[2] : (bm[3] != null ? bm[3] : id));
            } else { id = decl.replace(/[^\w-]/g, '') || nextSgIdFor(res); title = id; }
            if (sgStack.length) res.warnings.push({ line: ln, msg: 'nested subgraphs flattened' });
            const sg = { id, title: title || id, members: [] };
            sgStack.push(sg);
            res.sgs.push(sg);
            continue;
        }
        if (/^end$/i.test(t)) { sgStack.pop(); continue; }
        if (/^(flowchart|graph)\b/i.test(t)) { res.errors.push({ line: ln, msg: 'only one flowchart per paste' }); return res; }

        try {
            const seq = [];
            let i = 0;
            while (i < t.length) {
                while (i < t.length && /[ \t]/.test(t[i])) i++;
                if (i >= t.length) break;
                const e = tryEdgeAt(t, i);
                if (e) { seq.push({ edge: e }); i += e.len; continue; }
                const ch = readChunk(t, i);
                if (!ch.trim()) { i += Math.max(ch.length, 1); continue; }
                const refs = splitRefs(ch);
                seq.push({ nodes: refs.map(r => ensureNode(parseNodeDef(r))) });
                i += ch.length;
            }
            let pend = null, pendEdge = null;
            for (const it of seq) {
                if (it.edge) {
                    if (!pend) throw new Error('link without a source node');
                    pendEdge = it.edge;
                } else {
                    if (pend && pendEdge) {
                        for (const a of pend) for (const b of it.nodes) {
                            res.edges.push({ from: a.id, to: b.id, kind: pendEdge.kind, label: pendEdge.label || '' });
                        }
                    }
                    pend = it.nodes;
                    pendEdge = null;
                }
            }
        } catch (err) {
            res.errors.push({ line: ln, msg: err.message });
        }
    }
    if (!sawHeader) res.errors.push({ line: 1, msg: 'expected a "flowchart TD" header first' });
    return res;
}

function genMermaid(m) {
    const L = ['flowchart ' + m.dir];
    const styleKey = n => n.style ? JSON.stringify([n.style.fill || '', n.style.stroke || '', n.style.color || '']) : null;
    const classMap = new Map();
    for (const n of m.nodes) {
        const k = styleKey(n);
        if (k && !classMap.has(k)) classMap.set(k, 'cd' + classMap.size);
    }
    for (const [k, cid] of classMap) {
        const st = JSON.parse(k);
        const parts = [];
        if (st[0]) parts.push('fill:' + st[0]);
        if (st[1]) parts.push('stroke:' + st[1]);
        if (st[2]) parts.push('color:' + st[2]);
        L.push('classDef ' + cid + ' ' + parts.join(','));
    }
    const wrapOf = n => {
        const S = SHAPES[n.shape] || SHAPES.rect;
        return n.id + S.open + '"' + escLabel(n.label) + '"' + S.close;
    };
    const inSg = new Set();
    for (const sg of m.sgs) {
        L.push('subgraph ' + sg.id + '["' + escLabel(sg.title || sg.id) + '"]');
        for (const id of sg.members) {
            const n = m.nodes.find(x => x.id === id);
            if (n) L.push('    ' + wrapOf(n));
            inSg.add(id);
        }
        L.push('end');
    }
    for (const n of m.nodes) {
        if (!inSg.has(n.id)) L.push('    ' + wrapOf(n));
    }
    for (const e of m.edges) {
        const K = KINDS[e.kind] || KINDS.arrow;
        const mid = e.label ? K.op + '|"' + escLabel(e.label) + '"|' : K.op;
        L.push('    ' + e.from + ' ' + mid + ' ' + e.to);
    }
    for (const [k, cid] of classMap) {
        const ids = m.nodes.filter(n => styleKey(n) === k).map(n => n.id);
        L.push('class ' + ids.join(',') + ' ' + cid);
    }
    return L.join('\n');
}

const SEQ_ARROWS = ['-->>', '->>', '--)', '--x', '-)', '-x', '-->', '->'];
const SEQ_ARROW_NAMES = {
    '->': 'solid →', '-->': 'dotted ⇢', '->>': 'solid ≫', '-->>': 'dotted ≫',
    '-)': 'open )', '--)': 'open dashed )', '-x': 'cross ×', '--x': 'cross dashed ×',
};
const SEQ_ID = /^[\w.\-]+$/;

function parseSequence(text) {
    const data = { autonumber: false, participants: [], items: [] };
    const errors = [], warnings = [];
    const lines = text.split(/\r?\n/);
    const byId = new Map();
    const ensureP = id => {
        let p = byId.get(id);
        if (!p) {
            p = { id, label: id, actor: false };
            byId.set(id, p);
            data.participants.push(p);
        }
        return p;
    };
    let sawHeader = false;
    for (let li = 0; li < lines.length; li++) {
        const t = lines[li].trim(), ln = li + 1;
        if (!t || t.startsWith('%%')) continue;
        if (!sawHeader) {
            if (/^sequenceDiagram\s*$/i.test(t)) { sawHeader = true; continue; }
            errors.push({ line: ln, msg: 'expected a "sequenceDiagram" header first' });
            return { data, errors, warnings };
        }
        let m;
        if ((m = /^autonumber\b/i.exec(t))) { data.autonumber = true; continue; }
        if ((m = /^(participant|actor)\s+([\w.\-]+)(?:\s+as\s+(.+))?$/i.exec(t))) {
            const p = ensureP(m[2]);
            if (m[3] != null && m[3] !== '') p.label = unescLabel(m[3]);
            if (/^actor$/i.test(m[1])) p.actor = true;
            continue;
        }
        if ((m = /^note\s+(left|right|over)(?:\s+of)?\s+([^:]+?)\s*:\s*(.*)$/i.exec(t))) {
            const who = m[2].split(',').map(x => x.trim()).filter(Boolean);
            if (!who.length) { errors.push({ line: ln, msg: 'note without a target' }); continue; }
            who.forEach(ensureP);
            data.items.push({ kind: 'note', pos: m[1].toLowerCase(), who, text: m[3] });
            continue;
        }
        if ((m = /^(activate|deactivate)\s+([\w.\-]+)$/i.exec(t))) {
            ensureP(m[2]);
            data.items.push({ kind: 'act', on: /^activate$/i.test(m[1]), who: m[2] });
            continue;
        }
        if (/^=+\s*.*\s*=+$/.exec(t)) { warnings.push({ line: ln, msg: 'dividers not supported by mermaid sequence diagrams' }); continue; }
        let matched = false;
        for (const ar of SEQ_ARROWS) {
            const re = new RegExp('^([\\w.\\-]+)\\s*' + ar.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*([\\w.\\-]+)\\s*:\\s?(.*)$');
            if ((m = re.exec(t))) {
                ensureP(m[1]); ensureP(m[2]);
                data.items.push({ kind: 'msg', from: m[1], arrow: ar, to: m[2], text: m[3] });
                matched = true;
                break;
            }
        }
        if (matched) continue;
        if (/^(loop|alt|opt|par|critical|break|and|else)\b/i.test(t)) { warnings.push({ line: ln, msg: t.split(/[\s:]/)[0] + ' blocks not supported yet' }); continue; }
        errors.push({ line: ln, msg: 'cannot parse "' + t.slice(0, 32) + '"' });
    }
    if (!sawHeader) errors.push({ line: 1, msg: 'expected a "sequenceDiagram" header first' });
    return { data, errors, warnings };
}

function genSequence(d) {
    const L = ['sequenceDiagram'];
    if (d.autonumber) L.push('    autonumber');
    for (const p of d.participants) {
        const kw = p.actor ? 'actor' : 'participant';
        L.push('    ' + kw + ' ' + p.id + (p.label && p.label !== p.id ? ' as ' + escLabel(p.label) : ''));
    }
    for (const it of d.items || []) {
        if (it.kind === 'msg') {
            L.push('    ' + it.from + it.arrow + it.to + ': ' + String(it.text || '').replace(/\n/g, ' '));
        } else if (it.kind === 'note') {
            const who = (it.who || []).filter(Boolean).join(',');
            const pos = it.pos === 'over' ? 'over ' + who : it.pos + ' of ' + who;
            L.push('    Note ' + pos + ': ' + String(it.text || '').replace(/\n/g, ' '));
        } else if (it.kind === 'act') {
            L.push('    ' + (it.on ? 'activate ' : 'deactivate ') + it.who);
        }
    }
    return L.join('\n');
}

const GANTT_STATUS = ['done', 'active', 'crit', 'milestone'];
const DUR_RE = /^\d+(\.\d+)?\s*[smhdwy]$/i;

function parseGantt(text) {
    const data = { title: '', dateFormat: 'YYYY-MM-DD', axisFormat: '%d %b', excludes: '', sections: [] };
    const errors = [], warnings = [];
    const lines = text.split(/\r?\n/);
    let cur = null;
    const rootTasks = [];
    const ensureCur = () => {
        if (!cur) { cur = { name: '', tasks: [] }; data.sections.push(cur); }
        return cur;
    };
    const parseMeta = (metaStr, task, ln) => {
        for (const segRaw of metaStr.split(',')) {
            const seg = segRaw.trim();
            if (!seg) continue;
            const words = seg.split(/\s+/);
            if (GANTT_STATUS.includes(words[0].toLowerCase())) {
                task.status = words[0].toLowerCase();
                words.shift();
                if (!words.length) continue;
            }
            if (words[0].toLowerCase() === 'after') {
                const deps = words.slice(1).filter(Boolean);
                if (deps.length) { task.start = { kind: 'after', value: deps }; continue; }
            }
            const w = words.join(' ');
            if (DUR_RE.test(w)) { task.dur = w; continue; }
            if (/^\d{4}-\d{2}-\d{2}/.test(w)) {
                if (!task.start) task.start = { kind: 'date', value: w };
                else task.end = w;
                continue;
            }
            if (!task.alias && !task.start) { task.alias = w; continue; }
            if (task.start && !task.end && !task.dur) { task.end = w; warnings.push({ line: ln, msg: 'non-ISO end date kept verbatim' }); continue; }
            warnings.push({ line: ln, msg: 'skipped meta "' + w.slice(0, 18) + '"' });
        }
    };
    let sawHeader = false;
    for (let li = 0; li < lines.length; li++) {
        const t = lines[li].trim(), ln = li + 1;
        if (!t || t.startsWith('%%')) continue;
        if (!sawHeader) {
            if (/^gantt\s*$/i.test(t)) { sawHeader = true; continue; }
            errors.push({ line: ln, msg: 'expected a "gantt" header first' });
            return { data, errors, warnings };
        }
        let m;
        if ((m = /^title\s+(.*)$/i.exec(t))) { data.title = m[1]; continue; }
        if ((m = /^dateFormat\s+(.+)$/i.exec(t))) { data.dateFormat = m[1].trim(); continue; }
        if ((m = /^axisFormat\s+(.+)$/i.exec(t))) { data.axisFormat = m[1].trim(); continue; }
        if ((m = /^excludes\s+(.*)$/i.exec(t))) { data.excludes = m[1].trim(); continue; }
        if ((m = /^section\s+(.*)$/i.exec(t))) {
            cur = { name: m[1], tasks: [] };
            data.sections.push(cur);
            continue;
        }
        const ci = t.indexOf(':');
        if (ci > 0) {
            const name = t.slice(0, ci).trim().replace(/^"+|"+$/g, '');
            const task = { label: name, status: '', alias: '', start: null, dur: '', end: '' };
            parseMeta(t.slice(ci + 1), task, ln);
            (cur ? cur.tasks : rootTasks).push(task);
            continue;
        }
        if (/^(tick|done|crit)\b/i.test(t)) { warnings.push({ line: ln, msg: 'theme tag ignored' }); continue; }
        warnings.push({ line: ln, msg: 'line ignored' });
    }
    if (rootTasks.length) data.sections.unshift({ name: '', tasks: rootTasks });
    if (!sawHeader) errors.push({ line: 1, msg: 'expected a "gantt" header first' });
    return { data, errors, warnings };
}

function ganttAutoAlias(tasks, i) {
    const taken = new Set(tasks.map(t => t.alias).filter(Boolean));
    let k = i + 1;
    while (taken.has('t' + k)) k++;
    return 't' + k;
}

function genGantt(d) {
    const L = ['gantt'];
    if (d.title) L.push('    title ' + d.title);
    L.push('    dateFormat ' + (d.dateFormat || 'YYYY-MM-DD'));
    if (d.axisFormat) L.push('    axisFormat ' + d.axisFormat);
    if (d.excludes) L.push('    excludes ' + d.excludes);
    const all = [];
    for (const s of d.sections) all.push(...s.tasks);
    for (const s of d.sections) {
        if (s.name) L.push('    section ' + s.name);
        for (let ti = 0; ti < s.tasks.length; ti++) {
            const t = s.tasks[ti];
            const hasStart = t.start && (t.start.kind === 'after' ? (t.start.value || []).length : !!t.start.value);
            const hasSpan = !!(t.dur || t.end);
            if (!t.label && !hasStart && !hasSpan) continue;
            let alias = t.alias;
            if (hasStart && t.start.kind === 'after') {
                if (!alias) alias = t.alias = ganttAutoAlias(all, ti);
            }
            const parts = [];
            if (t.status) parts.push(t.status);
            if (alias) parts.push(alias);
            if (hasStart) parts.push(t.start.kind === 'after' ? 'after ' + t.start.value.join(', ') : t.start.value);
            if (t.dur) parts.push(t.dur);
            else if (t.end) parts.push(t.end);
            L.push('    ' + (t.label || 'Task') + ' : ' + parts.join(', '));
        }
    }
    return L.join('\n');
}

function parsePie(text) {
    const data = { showData: false, title: '', slices: [] };
    const errors = [], warnings = [];
    const lines = text.split(/\r?\n/);
    let sawHeader = false;
    for (let li = 0; li < lines.length; li++) {
        const t = lines[li].trim(), ln = li + 1;
        if (!t || t.startsWith('%%')) continue;
        if (!sawHeader) {
            const m = /^pie(\s+showData)?\s*$/i.exec(t);
            if (m) { sawHeader = true; data.showData = !!m[1]; continue; }
            errors.push({ line: ln, msg: 'expected a "pie" header first' });
            return { data, errors, warnings };
        }
        let m;
        if ((m = /^title\s+(.*)$/i.exec(t))) { data.title = m[1]; continue; }
        if ((m = /^(?:"([^"]*)"|'([^']*)'|([^:\n]+?))\s*:\s*(-?[\d.]+)\s*$/.exec(t))) {
            const label = m[1] != null ? m[1] : m[2] != null ? m[2] : (m[3] || '').trim();
            const v = parseFloat(m[4]);
            data.slices.push({ label, value: isNaN(v) ? 0 : v });
            continue;
        }
        warnings.push({ line: ln, msg: 'line ignored' });
    }
    if (!sawHeader) errors.push({ line: 1, msg: 'expected a "pie" header first' });
    return { data, errors, warnings };
}

function genPie(d) {
    const L = ['pie' + (d.showData ? ' showData' : '')];
    if (d.title) L.push('    title ' + d.title);
    for (const s of d.slices) L.push('    "' + escLabel(s.label) + '" : ' + s.value);
    return L.join('\n');
}

function mergeIntoModel(prevModel, parsed, fallbackCenter) {
    const prev = new Map((prevModel ? prevModel.nodes : []).map(n => [n.id, n]));
    const nm = { dir: parsed.dir, nodes: [], edges: [], sgs: [] };
    for (const pn of parsed.nodes) {
        const o = prev.get(pn.id);
        nm.nodes.push({
            id: pn.id, label: pn.label, shape: pn.shape, style: pn.style || null,
            x: o ? o.x : null, y: o ? o.y : null, w: o ? o.w : 0, h: o ? o.h : 0,
        });
    }
    const ids = new Set(nm.nodes.map(n => n.id));
    let ei = 1;
    for (const pe of parsed.edges) {
        if (!ids.has(pe.from) || !ids.has(pe.to)) continue;
        nm.edges.push({ id: 'e' + ei++, from: pe.from, to: pe.to, kind: pe.kind, label: pe.label || '' });
    }
    for (const sg of parsed.sgs) {
        sg.members = [...new Set(sg.members)].filter(id => ids.has(id));
        if (sg.members.length) nm.sgs.push({ id: sg.id, title: sg.title, members: sg.members });
    }
    const placed = nm.nodes.filter(n => n.x != null);
    const free = (n, x, y) => {
        for (const p of placed) {
            if (p.id === n.id) continue;
            if (Math.abs(p.x - x) < (p.w + n.w) / 2 + 26 && Math.abs(p.y - y) < (p.h + n.h) / 2 + 26) return false;
        }
        return true;
    };
    for (const n of nm.nodes) {
        sizeNode(n);
        if (n.x != null) continue;
        let bx, by;
        if (placed.length) {
            let sx = 0, sy = 0;
            for (const e of nm.edges) {
                let other = null;
                if (e.from === n.id) other = e.to;
                else if (e.to === n.id) other = e.from;
                if (!other) continue;
                const o = placed.find(p => p.id === other);
                if (o) { sx += o.x; sy += o.y; }
            }
            bx = Math.round(sx / Math.max(placed.length, 1));
            by = Math.round(sy / Math.max(placed.length, 1));
        } else {
            bx = Math.round(fallbackCenter ? fallbackCenter.x : 0);
            by = Math.round(fallbackCenter ? fallbackCenter.y : 0);
        }
        if (free(n, bx, by)) { n.x = bx; n.y = by; placed.push(n); continue; }
        let done = false;
        for (let r = 1; r <= 12 && !done; r++) {
            for (let a = 0; a < 8; a++) {
                const ang = a * Math.PI / 4 + r * 0.4;
                const x = Math.round(bx + Math.cos(ang) * r * GRID * 2.4);
                const y = Math.round(by + Math.sin(ang) * r * GRID * 2.4);
                if (free(n, x, y)) { n.x = x; n.y = y; placed.push(n); done = true; break; }
            }
        }
        if (!done) { n.x = bx + GRID * 40; n.y = by; placed.push(n); }
    }
    return nm;
}

function autoLayoutModel(m) {
    if (!window.dagre || !m.nodes.length) return false;
    const g = new dagre.graphlib.Graph();
    g.setGraph({ rankdir: m.dir, nodesep: 64, ranksep: 84, marginx: 30, marginy: 30 });
    g.setDefaultEdgeLabel(() => ({}));
    for (const n of m.nodes) g.setNode(n.id, { width: n.w, height: n.h });
    for (const e of m.edges) g.setEdge(e.from, e.to);
    dagre.layout(g);
    for (const n of m.nodes) {
        const p = g.node(n.id);
        if (p) { n.x = Math.round(p.x - n.w / 2); n.y = Math.round(p.y - n.h / 2); }
    }
    return true;
}

function polarPt(cx, cy, r, a) {
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}
function slicePath(cx, cy, r, a0, a1) {
    const [x0, y0] = polarPt(cx, cy, r, a0);
    const [x1, y1] = polarPt(cx, cy, r, a1);
    const large = a1 - a0 > Math.PI ? 1 : 0;
    return `M${cx},${cy} L${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1} Z`;
}
function pieBounds(values) {
    const total = values.reduce((a, b) => a + b, 0) || 1;
    let a = -Math.PI / 2;
    const b = [a];
    for (const v of values) { a += (v / total) * Math.PI * 2; b.push(a); }
    return b;
}
function fmtIso(ms) {
    try { return new Date(ms).toISOString().slice(0, 10); } catch (e) { return '2026-01-01'; }
}
function fmtDur(ms) {
    return Math.max(1, Math.round(ms / 86400000)) + 'd';
}
function resolveGantt(data) {
    const DAY = 86400000;
    const flat = [];
    (data.sections || []).forEach(s => (s.tasks || []).forEach(t => flat.push(t)));
    const byAlias = new Map();
    flat.forEach(t => { if (t.alias) byAlias.set(t.alias, t); });
    const isoMs = v => { const t = new Date(String(v)).getTime(); return isNaN(t) ? NaN : t; };
    const durMs = t => {
        if (t.dur) {
            const m = /^(\d+(?:\.\d+)?)\s*([smhdwy])$/i.exec(String(t.dur).trim());
            if (m) return parseFloat(m[1]) * ({ s: 1e3, m: 6e4, h: 36e5, d: DAY, w: 7 * DAY, y: 365 * DAY })[m[2].toLowerCase()];
        }
        return NaN;
    };
    const memo = new Map();
    const visiting = new Set();
    let lastEd = Date.now();
    function calc(t) {
        if (memo.has(t)) return memo.get(t);
        if (visiting.has(t)) { const r0 = { sd: lastEd, ed: lastEd + DAY }; memo.set(t, r0); return r0; }
        visiting.add(t);
        let sd = NaN;
        if (t.start && t.start.kind === 'date') sd = isoMs(t.start.value);
        else if (t.start && t.start.kind === 'after') {
            let mx = NaN;
            for (const dep of (t.start.value || [])) {
                const dt = byAlias.get(dep);
                if (!dt) continue;
                const c = calc(dt);
                mx = isNaN(mx) ? c.ed : Math.max(mx, c.ed);
            }
            sd = mx;
        }
        if (sd == null || isNaN(sd)) sd = lastEd;
        let len = durMs(t);
        if (isNaN(len)) {
            if (t.end && t.start && t.start.kind === 'date') {
                const e = isoMs(t.end);
                len = !isNaN(e) && e > sd ? e - sd : DAY;
            } else len = DAY;
        }
        const r = { sd, ed: sd + len };
        visiting.delete(t);
        memo.set(t, r);
        lastEd = Math.max(lastEd, r.ed);
        return r;
    }
    for (const t of flat) calc(t);
    const pos = new Map(flat.map(t => [t, memo.get(t)]));
    let mn = Infinity, mx = -Infinity;
    for (const p of pos.values()) { mn = Math.min(mn, p.sd); mx = Math.max(mx, p.ed); }
    if (!isFinite(mn)) { const now = Date.now(); mn = now; mx = now + 7 * DAY; }
    return { flat, pos, min: mn - DAY, max: mx + DAY };
}
function niceTicks(min, max) {
    const DAY = 86400000;
    const span = Math.max(max - min, DAY);
    const steps = [DAY, 2 * DAY, 7 * DAY, 14 * DAY, 30 * DAY, 91 * DAY, 365 * DAY];
    let step = steps[steps.length - 1];
    for (const st of steps) { if (span / st <= 9) { step = st; break; } }
    const out = [];
    let t = Math.ceil(min / step) * step;
    while (t <= max) { out.push(t); t += step; }
    return out;
}

}

        const h = it.kind === 'msg' ? RH.msg : it.kind === 'note' ? RH.note : RH.act;
        const g = { it, i, y, h };
        if (it.kind === 'msg') {
            g.num = ++msgIdx;
            g.x1 = cols[it.from] != null ? cols[it.from] : M;
            g.x2 = cols[it.to] != null ? cols[it.to] : M + innerW;
        } else if (it.kind === 'note') {
            const who = (it.who || []).map(id => cols[id]).filter(v => v != null);
            const tw = Math.max(textWidth(it.text || ' ') + 24, 70);
            g.w = tw;
            if (!who.length) g.x = M;
            else if (it.pos === 'left') g.x = Math.max(6, who[0] - tw - 28);
            else if (it.pos === 'right') g.x = who[who.length - 1] + 28;
            else g.x = (Math.min(...who) + Math.max(...who)) / 2 - tw / 2;
        } else {
            g.who = it.who;
        }
        rows.push(g);
        y += h + 10;
    }
    const height = y + 58;
    const stacks = {};
    const spans = [];
    for (const g of rows) {
        if (g.it.kind !== 'act') continue;
        if (g.it.on) (stacks[g.it.who] = stacks[g.it.who] || []).push(g);
        else {
            const st = stacks[g.it.who];
            if (st && st.length) { const s0 = st.pop(); spans.push({ who: g.it.who, y0: s0.y, y1: g.y + g.h }); }
        }
    }
    for (const who of Object.keys(stacks)) for (const s0 of stacks[who]) spans.push({ who, y0: s0.y, y1: height - 26 });
    return { parts, items, cols, rows, height, spans, M, colGap };
}

function svgEl(tag, attrs) {
    const el = document.createElementNS(SVG_NS, tag);
    if (attrs) for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
}

const drawShape = (shape, w, h) => {
    const hw = w / 2, hh = h / 2;
    const pts = arr => arr.map(p => p.join(',')).join(' ');
    switch (shape) {
        case 'round': return [{ tag: 'rect', attrs: { x: -hw, y: -hh, width: w, height: h, rx: Math.min(16, hh) } }];
        case 'stadium': return [{ tag: 'rect', attrs: { x: -hw, y: -hh, width: w, height: h, rx: hh } }];
        case 'circle': return [{ tag: 'ellipse', attrs: { cx: 0, cy: 0, rx: hw, ry: hh } }];
        case 'diamond': return [{ tag: 'polygon', attrs: { points: pts([[-hw, 0], [0, -hh], [hw, 0], [0, hh]]) } }];
        case 'hex': {
            const d = w * 0.13;
            return [{ tag: 'polygon', attrs: { points: pts([[-hw + d, -hh], [hw - d, -hh], [hw, 0], [hw - d, hh], [-hw + d, hh], [-hw, 0]]) } }];
        }
        case 'para': {
            const d = 14;
            return [{ tag: 'polygon', attrs: { points: pts([[-hw + d, -hh], [hw, -hh], [hw, hh], [-hw + d, hh], [-hw, 0]]) } }];
        }
        case 'sub': return [
            { tag: 'rect', attrs: { x: -hw, y: -hh, width: w, height: h, rx: 4 } },
            { tag: 'path', attrs: { d: `M${-hw + 8},${-hh}V${hh}M${hw - 8},${-hh}V${hh}`, fill: 'none' } },
        ];
        case 'cyl': {
            const r = Math.min(11, hh * 0.5);
            return [
                { tag: 'path', attrs: { d: `M${-hw},${-hh + r} A ${hw} ${r} 0 0 1 ${hw},${-hh + r} L ${hw},${hh - r} A ${hw} ${r} 0 0 1 ${-hw},${hh - r} Z` } },
                { tag: 'path', attrs: { d: `M${-hw},${-hh + r} A ${hw} ${r} 0 0 0 ${hw},${-hh + r}`, fill: 'none' } },
            ];
        }
        default: return [{ tag: 'rect', attrs: { x: -hw, y: -hh, width: w, height: h, rx: 10 } }];
    }
};

class Board {
    constructor(hostWrap, boardHost, svc) {
        this.svc = svc;
        this.model = null;
        this.view = { x: 0, y: 0, k: 1 };
        this.selNodes = new Set();
        this.selEdges = new Set();
        this.selSg = null;
        this.drag = null;
        this.spaceDown = false;
        this.pendSnap = null;
        this.snapOn = true;
        this.active = true;
        this.editorMode = null;
        this.fitTimer = null;

        const wrap = hostWrap;
        this.svg = svgEl('svg', { class: 'board' });
        this.defsEl = svgEl('defs', {});
        this.world = svgEl('g', {});
        this.sgLayer = svgEl('g', {});
        this.edgeLayer = svgEl('g', {});
        this.nodeLayer = svgEl('g', {});
        this.tempLayer = svgEl('g', { class: 'tempLayer' });
        this.world.appendChild(this.sgLayer);
        this.world.appendChild(this.edgeLayer);
        this.world.appendChild(this.nodeLayer);
        this.world.appendChild(this.tempLayer);
        this.svg.appendChild(this.defsEl);
        this.svg.appendChild(this.world);
        this.band = document.createElement('div');
        this.band.className = 'band';
        this.pill = document.createElement('div');
        this.pill.className = 'pill';
        const mkBtn = (txt, title, cls) => {
            const b = document.createElement('button');
            b.textContent = txt;
            b.title = title || '';
            if (cls) b.className = cls;
            return b;
        };
        this.pilPrev = mkBtn('‹', 'Previous shape');
        this.pillName = document.createElement('span');
        this.pillName.className = 'pill-shape-name';
        this.pilNext = mkBtn('›', 'Next shape');
        this.pilSw = document.createElement('div');
        this.pilSw.className = 'swatches';
        this.pilEdit = mkBtn('✎', 'Edit label');
        this.pilDup = mkBtn('⧉', 'Duplicate');
        this.pilDel = mkBtn('🗑', 'Delete', 'danger');
        this.pill.appendChild(this.pilPrev);
        this.pill.appendChild(this.pillName);
        this.pill.appendChild(this.pilNext);
        this.pill.appendChild(this.pilSw);
        this.pill.appendChild(this.pilEdit);
        this.pill.appendChild(this.pilDup);
        this.pill.appendChild(this.pilDel);
        this.editor = document.createElement('textarea');
        this.editor.className = 'editor-overlay';
        this.editor.spellcheck = false;
        boardHost.appendChild(this.svg);
        boardHost.appendChild(this.band);
        boardHost.appendChild(this.pill);
        boardHost.appendChild(this.editor);

        this.buildDefs();

        this._onWheel = e => {
            if (!this.active) return;
            e.preventDefault();
            const p = this.screenPt(e);
            this.zoomAt(p.x, p.y, Math.exp(-e.deltaY * 0.0013));
        };
        this._onDown = e => this.onPointerDown(e);
        this._onMove = e => this.onPointerMove(e);
        this._onUp = e => this.onPointerUp(e);
        this._onDbl = e => this.onDblClick(e);
        this.svg.addEventListener('wheel', this._onWheel, { passive: false });
        this.svg.addEventListener('pointerdown', this._onDown);
        this.svg.addEventListener('pointermove', this._onMove);
        this.svg.addEventListener('pointerup', this._onUp);
        this.svg.addEventListener('dblclick', this._onDbl);

        this.pilPrev.addEventListener('click', () => this.cycleShape(-1));
        this.pilNext.addEventListener('click', () => this.cycleShape(1));
        this.pilEdit.addEventListener('click', () => {
            if (this.selNodes.size === 1) this.openNodeEditor([...this.selNodes][0]);
        });
        this.pilDup.addEventListener('click', () => this.duplicateSel());
        this.pilDel.addEventListener('click', () => this.deleteSel());

        this._edInput = () => this.autosizeEditor();
        this._edKey = e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.closeEditor(false); }
            if (e.key === 'Escape') { e.preventDefault(); this.closeEditor(true); }
            e.stopPropagation();
        };
        this._edBlur = () => this.closeEditor(false);
        this.editor.addEventListener('input', this._edInput);
        this.editor.addEventListener('keydown', this._edKey);
        this.editor.addEventListener('blur', this._edBlur);

        this._onKey = e => this.onKeyDown(e);
        this._onKeyUp = e => {
            if (e.key === ' ') { this.spaceDown = false; this.svg.style.cursor = ''; }
        };
        this._onResize = () => this.positionPill();
        window.addEventListener('keydown', this._onKey);
        window.addEventListener('keyup', this._onKeyUp);
        window.addEventListener('resize', this._onResize);

        wrap.addEventListener('dragover', e => e.preventDefault());
        wrap.addEventListener('drop', e => {
            e.preventDefault();
            const data = e.dataTransfer.getData('text/plain');
            if (!data.startsWith('shape:')) return;
            const shape = data.slice(6);
            if (!SHAPES[shape]) return;
            const p = this.screenPt(e);
            const w = this.screenToWorld(p.x, p.y);
            this.addShape(shape, w);
        });
    }

    destroy() {
        window.removeEventListener('keydown', this._onKey);
        window.removeEventListener('keyup', this._onKeyUp);
        window.removeEventListener('resize', this._onResize);
        clearTimeout(this.fitTimer);
    }

    buildDefs() {
        let html = '';
        const mk = (id, color, w) =>
            `<marker id="${id}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="${w}" markerHeight="${w}" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${color}"/></marker>`;
        html += mk('ah-n', '#7e93ae', 6.5) + mk('ah-s', '#22d3ee', 6.5) + mk('ah-n-big', '#7e93ae', 9) + mk('ah-s-big', '#22d3ee', 9);
        this.defsEl.innerHTML = html;
    }

    setModel(m) { this.model = m; this.renderAll(); }

    centerWorld() {
        return this.screenToWorld(this.svg.clientWidth / 2, this.svg.clientHeight / 2);
    }

    setActive(a) { this.active = a; }
    setSnap(b) { this.snapOn = b; }

    nodeById(id) { return this.model.nodes.find(n => n.id === id) || null; }
    nextNodeId() { let i = 1; while (this.nodeById('n' + i)) i++; return 'n' + i; }
    nextEdgeId() { let i = 1; while (this.model.edges.some(e => e.id === 'e' + i)) i++; return 'e' + i; }
    nextSgId() {
        let i = 1;
        const taken = new Set([...this.model.nodes.map(n => n.id), ...this.model.sgs.map(s => s.id)]);
        while (taken.has('SG' + i)) i++;
        return 'SG' + i;
    }

    addShape(shape, worldPt) {
        this.svc.pushUndo(null);
        const c = worldPt || this.centerWorld();
        const n = {
            id: this.nextNodeId(),
            label: SHAPES[shape].name,
            shape, x: 0, y: 0, w: 0, h: 0, style: null,
        };
        sizeNode(n);
        n.x = this.snapOn ? Math.round((c.x + (Math.random() * 60 - 30)) / GRID) * GRID : c.x;
        n.y = this.snapOn ? Math.round((c.y + (Math.random() * 60 - 30)) / GRID) * GRID : c.y;
        this.model.nodes.push(n);
        this.changed({ keepView: true });
        this.clearSelection();
        this.selNodes.add(n.id);
        this.refreshSelClasses();
        this.showPill();
    }

    normalizeModel() {
        this.model.nodes.forEach(sizeNode);
        this.model.edges = this.model.edges.filter(e => this.nodeById(e.from) && this.nodeById(e.to));
        const known = new Set(this.model.nodes.map(n => n.id));
        this.model.sgs.forEach(s => { s.members = s.members.filter(id => known.has(id)); });
        this.model.sgs = this.model.sgs.filter(s => s.members.length > 0);
    }

    changed(opts) {
        opts = opts || {};
        this.normalizeModel();
        this.renderAll();
        if (!opts.keepView) this.fitSoon();
        this.svc.onChanged();
    }

    fitSoon() {
        clearTimeout(this.fitTimer);
        this.fitTimer = setTimeout(() => this.fitView(), 60);
    }

    clearSelection() {
        this.selNodes.clear(); this.selEdges.clear(); this.selSg = null;
        this.hidePill();
    }

    refreshSelClasses() {
        for (const el of this.nodeLayer.children) {
            el.classList.toggle('sel', this.selNodes.has(el.dataset.id));
        }
        for (const el of this.edgeLayer.children) {
            el.classList.toggle('sel', this.selEdges.has(el.dataset.id));
        }
        for (const el of this.sgLayer.children) {
            el.classList.toggle('sel', this.selSg === el.dataset.id);
        }
    }

    deleteSel() {
        if (!this.selNodes.size && !this.selEdges.size && !this.selSg) return;
        this.svc.pushUndo(null);
        for (const id of this.selEdges) this.model.edges = this.model.edges.filter(e => e.id !== id);
        if (this.selNodes.size) {
            this.model.nodes = this.model.nodes.filter(n => !this.selNodes.has(n.id));
            this.model.edges = this.model.edges.filter(e => !this.selNodes.has(e.from) && !this.selNodes.has(e.to));
        }
        if (this.selSg) this.model.sgs = this.model.sgs.filter(s => s.id !== this.selSg);
        this.clearSelection();
        this.changed({ keepView: true });
    }

    duplicateSel() {
        if (!this.selNodes.size) return;
        this.svc.pushUndo(null);
        const map = new Map();
        const clones = [];
        for (const id of this.selNodes) {
            const src = this.nodeById(id);
            const n = JSON.parse(JSON.stringify(src));
            n.id = this.nextNodeId();
            map.set(id, n.id);
            n.x += 28; n.y += 28;
            this.model.nodes.push(n);
            clones.push(n.id);
        }
        for (const e of this.model.edges.slice()) {
            if (map.has(e.from) && map.has(e.to)) {
                this.model.edges.push({ id: this.nextEdgeId(), from: map.get(e.from), to: map.get(e.to), kind: e.kind, label: e.label });
            }
        }
        this.clearSelection();
        clones.forEach(id => this.selNodes.add(id));
        this.changed({ keepView: true });
        this.refreshSelClasses();
        this.showPill();
    }

    groupSel() {
        if (!this.selNodes.size) { this.svc.toast('select some nodes first'); return; }
        this.svc.pushUndo(null);
        const existing = this.model.sgs.find(s => s.members.some(id => this.selNodes.has(id)));
        let sg;
        if (existing) {
            sg = existing;
            for (const id of this.selNodes) if (!sg.members.includes(id)) sg.members.push(id);
        } else {
            sg = { id: this.nextSgId(), title: 'Group ' + (this.model.sgs.length + 1), members: [...this.selNodes] };
            this.model.sgs.push(sg);
        }
        this.selSg = sg.id;
        this.changed({ keepView: true });
        this.svc.toast('grouped as ' + sg.id);
    }

    ungroupSel() {
        const hits = this.model.sgs.filter(s => (this.selSg === s.id) || s.members.some(id => this.selNodes.has(id)));
        if (!hits.length) { this.svc.toast('no group under selection'); return; }
        this.svc.pushUndo(null);
        this.model.sgs = this.model.sgs.filter(s => !hits.includes(s));
        this.selSg = null;
        this.changed({ keepView: true });
    }

    cycleShape(dir) {
        if (this.selNodes.size !== 1) return;
        const n = this.nodeById([...this.selNodes][0]);
        this.svc.pushUndo(null);
        let i = SHAPE_ORDER.indexOf(n.shape);
        i = (i + dir + SHAPE_ORDER.length) % SHAPE_ORDER.length;
        n.shape = SHAPE_ORDER[i];
        sizeNode(n);
        this.changed({ keepView: true });
    }

    applySwatch(style) {
        this.svc.pushUndo(null);
        for (const id of this.selNodes) {
            const n = this.nodeById(id);
            n.style = style ? Object.assign({}, style) : null;
        }
        this.changed({ keepView: true });
    }

    changeDir(d) {
        this.svc.pushUndo(null);
        this.model.dir = d;
        this.changed({ keepView: true });
    }

    layoutNow() {
        const ok = autoLayoutModel(this.model);
        if (!ok) { this.svc.toast(window.dagre ? 'nothing to lay out' : 'dagre not loaded — check connection', window.dagre ? undefined : 'err'); return false; }
        this.changed({ keepView: true });
        setTimeout(() => this.fitView(), 80);
        return true;
    }

    screenPt(e) {
        const r = this.svg.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    screenToWorld(px, py) {
        return { x: (px - this.view.x) / this.view.k, y: (py - this.view.y) / this.view.k };
    }
    worldToScreen(wx, wy) {
        return { x: wx * this.view.k + this.view.x, y: wy * this.view.k + this.view.y };
    }

    applyViewTransform() {
        this.world.setAttribute('transform', `translate(${this.view.x},${this.view.y}) scale(${this.view.k})`);
        this.svc.onZoom(Math.round(this.view.k * 100));
        this.positionPill();
    }

    zoomAt(px, py, factor) {
        const k2 = Math.min(3, Math.max(0.2, this.view.k * factor));
        factor = k2 / this.view.k;
        this.view.x = px - (px - this.view.x) * factor;
        this.view.y = py - (py - this.view.y) * factor;
        this.view.k = k2;
        this.applyViewTransform();
    }

    zoomCenter(f) { this.zoomAt(this.svg.clientWidth / 2, this.svg.clientHeight / 2, f); }

    fitView() {
        const m = this.model;
        if (!m || !m.nodes.length) { this.view = { x: 0, y: 0, k: 1 }; this.applyViewTransform(); return; }
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const n of m.nodes) {
            minX = Math.min(minX, n.x - n.w / 2); maxX = Math.max(maxX, n.x + n.w / 2);
            minY = Math.min(minY, n.y - n.h / 2); maxY = Math.max(maxY, n.y + n.h / 2);
        }
        const cw = this.svg.clientWidth, ch = this.svg.clientHeight;
        const pad = 70;
        const k = Math.min((cw - pad * 2) / Math.max(maxX - minX, 1), (ch - pad * 2) / Math.max(maxY - minY, 1), 1.4);
        this.view.k = Math.max(k, 0.2);
        this.view.x = (cw - (minX + maxX) * this.view.k) / 2;
        this.view.y = (ch - (minY + maxY) * this.view.k) / 2;
        this.applyViewTransform();
    }

    onPointerDown(e) {
        if (!this.active || !this.model) return;
        if (e.button === 2) return;
        this.closeEditor(true);
        const sp = this.screenPt(e);
        const t = e.target;
        const handleEl = t.closest && t.closest('.handle');
        if (handleEl) {
            const nid = handleEl.closest('.node').dataset.id;
            const n = this.nodeById(nid);
            this.drag = { mode: 'link', from: nid, side: handleEl.dataset.side, start: anchorOf(n, handleEl.dataset.side), hover: null };
            this.pendSnap = this.svc.snapshot();
            const temp = svgEl('path', {});
            this.tempLayer.appendChild(temp);
            this.drag.temp = temp;
            try { if (this.svg.setPointerCapture) this.svg.setPointerCapture(e.pointerId); } catch (err) {}
            return;
        }
        const ng = t.closest && t.closest('.node');
        if (ng) {
            const id = ng.dataset.id;
            if (e.shiftKey) {
                this.selNodes.has(id) ? this.selNodes.delete(id) : this.selNodes.add(id);
            } else if (!this.selNodes.has(id)) {
                this.clearSelection();
                this.selNodes.add(id);
            }
            this.refreshSelClasses();
            this.showPill();
            const wp = this.screenToWorld(sp.x, sp.y);
            const orig = new Map();
            for (const nid of this.selNodes) { const n = this.nodeById(nid); orig.set(nid, { x: n.x, y: n.y }); }
            this.drag = { mode: 'nodes', startW: wp, orig, moved: false, sx: sp.x, sy: sp.y };
            this.pendSnap = this.svc.snapshot();
            try { if (this.svg.setPointerCapture) this.svg.setPointerCapture(e.pointerId); } catch (err) {}
            return;
        }
        const eg = t.closest && t.closest('.edge');
        if (eg) {
            const id = eg.dataset.id;
            if (e.shiftKey) this.selEdges.has(id) ? this.selEdges.delete(id) : this.selEdges.add(id);
            else { this.clearSelection(); this.selEdges.add(id); }
            this.refreshSelClasses();
            this.hidePill();
            return;
        }
        const sgEl = t.closest && t.closest('.sg-box');
        if (sgEl) {
            const sid = sgEl.dataset.id;
            this.selSg = sid;
            this.refreshSelClasses();
            const sg = this.model.sgs.find(s => s.id === sid);
            const orig = new Map();
            for (const id of sg.members) { const n = this.nodeById(id); if (n) orig.set(id, { x: n.x, y: n.y }); }
            this.drag = { mode: 'sg', sid, startW: this.screenToWorld(sp.x, sp.y), orig, moved: false };
            this.pendSnap = this.svc.snapshot();
            try { if (this.svg.setPointerCapture) this.svg.setPointerCapture(e.pointerId); } catch (err) {}
            return;
        }
        if (this.spaceDown || e.button === 1) {
            this.drag = { mode: 'pan', sx: sp.x, sy: sp.y, vx: this.view.x, vy: this.view.y };
            try { if (this.svg.setPointerCapture) this.svg.setPointerCapture(e.pointerId); } catch (err) {}
            return;
        }
        if (e.shiftKey) {
            this.drag = { mode: 'band', sx: sp.x, sy: sp.y };
            this.band.style.display = 'block';
            this.band.style.left = sp.x + 'px'; this.band.style.top = sp.y + 'px';
            this.band.style.width = '0px'; this.band.style.height = '0px';
            this.drag.baseSel = new Set(this.selNodes);
            try { if (this.svg.setPointerCapture) this.svg.setPointerCapture(e.pointerId); } catch (err) {}
        } else {
            this.clearSelection();
            this.refreshSelClasses();
            this.drag = { mode: 'pan', sx: sp.x, sy: sp.y, vx: this.view.x, vy: this.view.y };
            try { if (this.svg.setPointerCapture) this.svg.setPointerCapture(e.pointerId); } catch (err) {}
        }
    }

    onPointerMove(e) {
        const drag = this.drag;
        if (!drag || !this.active) return;
        const sp = this.screenPt(e);
        if (drag.mode === 'pan') {
            this.view.x = drag.vx + (sp.x - drag.sx);
            this.view.y = drag.vy + (sp.y - drag.sy);
            this.applyViewTransform();
            return;
        }
        if (drag.mode === 'band') {
            const x = Math.min(drag.sx, sp.x), y = Math.min(drag.sy, sp.y);
            this.band.style.left = x + 'px'; this.band.style.top = y + 'px';
            this.band.style.width = Math.abs(sp.x - drag.sx) + 'px';
            this.band.style.height = Math.abs(sp.y - drag.sy) + 'px';
            const a = this.screenToWorld(drag.sx, drag.sy), b = this.screenToWorld(sp.x, sp.y);
            const r = { x1: Math.min(a.x, b.x), y1: Math.min(a.y, b.y), x2: Math.max(a.x, b.x), y2: Math.max(a.y, b.y) };
            this.selNodes = new Set(drag.baseSel);
            for (const n of this.model.nodes) {
                if (n.x + n.w / 2 >= r.x1 && n.x - n.w / 2 <= r.x2 && n.y + n.h / 2 >= r.y1 && n.y - n.h / 2 <= r.y2) this.selNodes.add(n.id);
            }
            this.refreshSelClasses();
            return;
        }
        if (drag.mode === 'nodes') {
            const wp = this.screenToWorld(sp.x, sp.y);
            let dx = wp.x - drag.startW.x, dy = wp.y - drag.startW.y;
            if (!drag.moved && Math.abs(sp.x - drag.sx) + Math.abs(sp.y - drag.sy) < 3) return;
            if (!drag.moved) { this.svc.pushUndo(this.pendSnap); drag.moved = true; }
            if (this.snapOn && drag.orig.size === 1) {
                const o = [...drag.orig.values()][0];
                dx = Math.round((o.x + dx) / GRID) * GRID - o.x;
                dy = Math.round((o.y + dy) / GRID) * GRID - o.y;
            } else {
                dx = Math.round(dx); dy = Math.round(dy);
            }
            const touched = new Set();
            for (const [nid, o] of drag.orig) {
                const n = this.nodeById(nid);
                if (!n) continue;
                n.x = o.x + dx; n.y = o.y + dy;
                touched.add(nid);
            }
            this.fastUpdatePositions(touched);
            return;
        }
        if (drag.mode === 'sg') {
            const wp = this.screenToWorld(sp.x, sp.y);
            const dx = Math.round(wp.x - drag.startW.x), dy = Math.round(wp.y - drag.startW.y);
            if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 3) return;
            if (!drag.moved) { this.svc.pushUndo(this.pendSnap); drag.moved = true; }
            const touched = new Set();
            for (const [nid, o] of drag.orig) {
                const n = this.nodeById(nid);
                if (!n) continue;
                n.x = o.x + dx; n.y = o.y + dy;
                touched.add(nid);
            }
            this.fastUpdatePositions(touched);
            return;
        }
        if (drag.mode === 'link') {
            const wp = this.screenToWorld(sp.x, sp.y);
            let best = null, bestD = Infinity;
            for (const n of this.model.nodes) {
                if (n.id === drag.from) continue;
                const d = (n.x - wp.x) ** 2 + (n.y - wp.y) ** 2;
                const rad = Math.max(Math.hypot(n.w, n.h) / 2 + 34 / this.view.k, 52 / this.view.k);
                if (d < rad * rad && d < bestD) { best = n; bestD = d; }
            }
            drag.hover = best ? best.id : null;
            const end = best
                ? anchorOf(best, sideTowards(best, drag.start.x, drag.start.y))
                : wp;
            drag.temp.setAttribute('d', `M${drag.start.x},${drag.start.y} Q ${(drag.start.x + end.x) / 2},${Math.min(drag.start.y, end.y) - 40} ${end.x},${end.y}`);
        }
    }

    onPointerUp(e) {
        const drag = this.drag;
        if (!drag) return;
        if (drag.mode === 'link') {
            drag.temp.remove();
            if (drag.hover) {
                this.svc.pushUndo(this.pendSnap);
                this.model.edges.push({ id: this.nextEdgeId(), from: drag.from, to: drag.hover, kind: 'arrow', label: '' });
                this.changed({ keepView: true });
            }
        } else if ((drag.mode === 'nodes' || drag.mode === 'sg') && drag.moved) {
            this.changed({ keepView: true });
        }
        this.band.style.display = 'none';
        this.drag = null;
        this.pendSnap = null;
    }

    onDblClick(e) {
        if (!this.active || !this.model) return;
        const t = e.target;
        const ng = t.closest && t.closest('.node');
        if (ng) { this.openNodeEditor(ng.dataset.id); return; }
        const eg = t.closest && t.closest('.edge');
        if (eg) { this.openEdgeEditor(eg.dataset.id); return; }
        const sg = t.closest && t.closest('.sg-box');
        if (sg) {
            const s = this.model.sgs.find(x => x.id === sg.dataset.id);
            if (s) this.openTitleEditor(s);
        }
    }

    fastUpdatePositions(ids) {
        for (const el of this.nodeLayer.children) {
            if (!ids.has(el.dataset.id)) continue;
            const n = this.nodeById(el.dataset.id);
            el.setAttribute('transform', `translate(${n.x},${n.y})`);
        }
        for (const e of this.model.edges) {
            if (!ids.has(e.from) && !ids.has(e.to)) continue;
            this.redrawEdge(e);
        }
