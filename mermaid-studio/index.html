                    })}
                    {ghostY != null && <line className="s-dragline" x1={10} y1={ghostY} x2={W - 10} y2={ghostY} />}
                    {(() => {
                        const zones = [];
                        for (let zi = 0; zi <= L.items.length; zi++) {
                            const prev = L.rows[zi - 1];
                            const next = L.rows[zi];
                            const a = prev ? prev.y + prev.h : 58;
                            const b = next ? next.y : (prev ? a + 22 : L.height - 44);
                            if (b <= a) continue;
                            zones.push({ i: zi, top: (a + b) / 2 - 6, mid: (a + b) / 2 });
                        }
                        return zones.map(z => (
                            <g key={'ins' + z.i}>
                                <rect className="s-ins" x={0} y={z.top} width={W} height={12}
                                    onMouseEnter={() => setGapHover(z.i)} onMouseLeave={() => setGapHover(null)} />
                                {gapHover === z.i && (<g>
                                    <circle className="s-ins-btn" cx={22} cy={z.mid} r={9}
                                        onClick={() => { setGapHover(null); insertMsgAt(z.i); }} />
                                    <line x1={34} y1={z.mid} x2={W - 20} y2={z.mid}
                                        stroke="rgba(34,211,238,.3)" strokeDasharray="3 4" pointerEvents="none" />
                                </g>)}
                            </g>
                        ));
                    })()}
                </svg>
                {!L.items.length && <div className="viz-empty">Empty conversation — add a message above.</div>}
                {pill}
            </div>
        </div>
    );
}

const VIEW_PREFS = {};

function ModeShell({ mode, data, api }) {
    const M = C.MODES[mode];
    const [view, setView] = useState(VIEW_PREFS[mode] || 'visual');
    useEffect(() => { VIEW_PREFS[mode] = view; }, [mode, view]);
    const Visual = M.Visual;
    return (
        <aside className="viz-shell">
            <div className="rp-head viz-head">
                <span style={{ fontSize: 12.5, fontWeight: 700, color: 'var(--text)' }}>{M.tab}</span>
                <span className="chip">{C.MODES[mode].stats(data)}</span>
                <span className="grow"></span>
                <button className={view === 'visual' ? 'on' : ''} onClick={() => setView('visual')}>Visual</button>
                <button className={view === 'rows' ? 'on' : ''} onClick={() => setView('rows')}>Rows</button>
            </div>
            {view === 'visual' && Visual
                ? <Visual data={data} api={api} />
                : (
                    <div className="sheet-shell" style={{ background: 'var(--bg)', padding: '14px 18px 40px' }}>
                        <div className="sheet-inner">
                            {mode === 'sequence' && <SeqSheet data={data} api={api} />}
                            {mode === 'gantt' && <GanttSheet data={data} api={api} />}
                            {mode === 'pie' && <PieSheet data={data} api={api} />}
                        </div>
                    </div>
                )}
        </aside>
    );
}

C.MODES.sequence.Visual = SeqVisual;
C.MODES.gantt.Visual = GanttVisual;
C.MODES.pie.Visual = PieVisual;

const MODE_LIST = ['flowchart', 'sequence', 'gantt', 'pie'];

function App() {
    const docsRef = useRef({});
    const [ver, bump] = useReducer(v => v + 1, 0);
    const editSrcRef = useRef('boot');
    const modeRef = useRef('flowchart');
    const [mode, setModeState] = useState('flowchart');
    const [codeText, setCodeText] = useState('');
    const lastGoodRef = useRef('');
    const [sync, setSync] = useState({ state: 'ok', err: '', warn: '' });
    const histRef = useRef([]);
    const futRef = useRef([]);
    const [undoDepth, setUndoDepth] = useState(0);
    const [redoDepth, setRedoDepth] = useState(0);
    const [helpOpen, setHelpOpen] = useState(false);
    const helpOpenRef = useRef(false);
    const [zoomK, setZoomK] = useState(100);
    const [saveChip, setSaveChip] = useState('—');
    const [snapOn, setSnapOnState] = useState(true);
    const snapRef = useRef(true);
    const [palHidden, setPalHiddenState] = useState(false);
    const palRef = useRef(false);
    const [focusMode, setFocusModeState] = useState(false);
    const focusRef = useRef(false);
    const [toasts, setToasts] = useState([]);
    const toastSeq = useRef(0);
    const boardRef = useRef(null);
    const wrapRef = useRef(null);
    const boardHostRef = useRef(null);
    const taRef = useRef(null);
    const pvCounter = useRef(0);
    const pvTimer = useRef(null);
    const saveTimer = useRef(null);
    const syncTimer = useRef(null);
    const [pvHtml, setPvHtml] = useState('');
    const [pvErr, setPvErr] = useState('');

    useEffect(() => { helpOpenRef.current = helpOpen; }, [helpOpen]);

    const pushToast = useCallback((msg, type) => {
        const id = ++toastSeq.current;
        setToasts(ts => [...ts, { id, msg, type }]);
        setTimeout(() => setToasts(ts => ts.filter(t => t.id !== id)), 2400);
    }, []);

    const takeSnapshot = useCallback(() =>
        JSON.stringify({ mode: modeRef.current, data: docsRef.current[modeRef.current].data })
    , []);

    const bootedRef = useRef(false);

    const pushUndoPre = useCallback(pre => {
        const s = pre != null ? pre : JSON.stringify({ mode: modeRef.current, data: docsRef.current[modeRef.current].data });
        histRef.current.push(s);
        if (histRef.current.length > 120) histRef.current.shift();
        futRef.current = [];
        setUndoDepth(histRef.current.length);
        setRedoDepth(0);
    }, []);

    const svc = useMemo(() => ({
        toast: (m, t) => pushToast(m, t),
        snapshot: () => JSON.stringify({ mode: modeRef.current, data: docsRef.current[modeRef.current].data }),
        pushUndo: pre => pushUndoPre(pre),
        onChanged: () => { editSrcRef.current = 'ui'; bump(); },
        onZoom: k => setZoomK(k),
        isHelpOpen: () => helpOpenRef.current,
    }), [pushToast, pushUndoPre]);

    const commitData = useCallback((m, d) => {
        docsRef.current[m] = { data: d };
        editSrcRef.current = 'ui';
        bump();
    }, []);

    const restoreSnapshot = useCallback(json => {
        let s;
        try { s = JSON.parse(json); } catch (e) { return; }
        if (!s || !s.mode || !C.MODES[s.mode]) return;
        docsRef.current[s.mode] = { data: s.data };
        if (s.mode !== modeRef.current) { modeRef.current = s.mode; setModeState(s.mode); }
        if (s.mode === 'flowchart' && boardRef.current) {
            boardRef.current.clearSelection();
            boardRef.current.setModel(s.data);
        }
        editSrcRef.current = 'ui';
        bump();
    }, []);

    const doUndo = useCallback(() => {
        if (!histRef.current.length) return;
        futRef.current.push(JSON.stringify({ mode: modeRef.current, data: docsRef.current[modeRef.current].data }));
        const s = histRef.current.pop();
        setUndoDepth(histRef.current.length);
        setRedoDepth(futRef.current.length);
        restoreSnapshot(s);
        pushToast('undo');
    }, [restoreSnapshot, pushToast]);

    const doRedo = useCallback(() => {
        if (!futRef.current.length) return;
        histRef.current.push(JSON.stringify({ mode: modeRef.current, data: docsRef.current[modeRef.current].data }));
        const s = futRef.current.pop();
        setUndoDepth(histRef.current.length);
        setRedoDepth(futRef.current.length);
        restoreSnapshot(s);
        pushToast('redo');
    }, [restoreSnapshot, pushToast]);

    const applyTyped = useCallback(explicitText => {
        const ta = taRef.current;
        if (!ta) return false;
        const val = explicitText != null ? explicitText : ta.value;
        if (!val.trim()) return false;
        const m = modeRef.current;
        const M = C.MODES[m];
        const res = M.parse(val);
        if (res.errors.length) {
            setSync({ state: 'error', err: 'line ' + res.errors[0].line + ': ' + res.errors[0].msg, warn: res.errors.length > 1 ? '+' + (res.errors.length - 1) + ' more' : '' });
            return false;
        }
        let data = res.data;
        if (m === 'flowchart') {
            const center = boardRef.current ? boardRef.current.centerWorld() : { x: 0, y: 0 };
            data = C.mergeIntoModel(docsRef.current.flowchart.data, data, center);
            docsRef.current.flowchart = { data };
            boardRef.current.clearSelection();
            boardRef.current.setModel(data);
        } else {
            docsRef.current[m] = { data };
        }
        lastGoodRef.current = M.gen(data);
        setSync({ state: 'ok', err: '', warn: res.warnings.length ? '⚠ ' + res.warnings.length + ' ignored' : '' });
        editSrcRef.current = 'code';
        bump();
        return true;
    }, []);

    const renderPreviewNow = useCallback(async () => {
        const ta = taRef.current;
        const txt = ((ta && ta.value.trim()) || lastGoodRef.current || '').trim();
        if (!txt) { setPvHtml(''); setPvErr('nothing to render yet'); return; }
        try {
            if (!window.mermaid) throw new Error('mermaid library not loaded (offline?)');
            const id = 'pv-' + (++pvCounter.current);
            const { svg } = await window.mermaid.render(id, txt);
            const stale = document.getElementById('d' + id);
            if (stale) stale.remove();
            setPvHtml(svg);
            setPvErr('');
        } catch (err) {
            const msg = err && err.message ? err.message : String(err);
            setPvHtml('');
            setPvErr(msg.length > 260 ? msg.slice(0, 260) + '…' : msg);
        }
    }, []);

    const schedulePreview = useCallback(() => {
        clearTimeout(pvTimer.current);
        pvTimer.current = setTimeout(renderPreviewNow, 550);
    }, [renderPreviewNow]);

    const scheduleSave = useCallback(() => {
        if (!bootedRef.current) return;
        clearTimeout(saveTimer.current);
        saveTimer.current = setTimeout(() => {
            try {
                const docs = {};
                for (const k of Object.keys(docsRef.current)) docs[k] = docsRef.current[k];
                localStorage.setItem(STORE_KEY, JSON.stringify({
                    v: 2,
                    docs,
                    prefs: { snapOn: snapRef.current, palHidden: palRef.current, focus: focusRef.current, lastMode: modeRef.current },
                }));
                setSaveChip('saved');
                setTimeout(() => setSaveChip(c => (c === 'saved' ? '' : c)), 1200);
            } catch (e) {}
        }, 450);
    }, []);

    const ensureDoc = useCallback(m => {
        if (docsRef.current[m] && docsRef.current[m].data) return;
        const M = C.MODES[m];
        const tpl = M.templates[0];
        const res = M.parse(tpl.src);
        let data;
        if (res.errors.length) data = M.empty();
        else if (m === 'flowchart') {
            data = C.mergeIntoModel(null, res.data, { x: 0, y: 0 });
            C.autoLayoutModel(data);
        } else {
            data = res.data;
        }
        docsRef.current[m] = { data };
    }, []);

    const applyTemplate = useCallback((m, src) => {
        const M = C.MODES[m];
        const res = M.parse(src);
        if (res.errors.length) { pushToast('template failed to parse', 'err'); return false; }
        if (m === 'flowchart') {
            const fresh = C.mergeIntoModel(null, res.data, boardRef.current ? boardRef.current.centerWorld() : { x: 0, y: 0 });
            C.autoLayoutModel(fresh);
            docsRef.current.flowchart = { data: fresh };
            if (boardRef.current) { boardRef.current.clearSelection(); boardRef.current.setModel(fresh); }
        } else {
            docsRef.current[m] = { data: res.data };
        }
        editSrcRef.current = 'ui';
        bump();
        return true;
    }, [pushToast]);

    const loadTemplate = useCallback(key => {
        const M = C.MODES[modeRef.current];
        const tpl = M.templates.find(t => t.key === key);
        if (!tpl) return;
        pushUndoPre(takeSnapshot());
        if (applyTemplate(modeRef.current, tpl.src)) pushToast('loaded “' + tpl.name + '”');
    }, [applyTemplate, pushUndoPre, takeSnapshot, pushToast]);

    const commitPendingCode = useCallback(() => {
        const ta = taRef.current;
        if (!ta) return;
        if (!ta.value.trim() || ta.value === lastGoodRef.current) return;
        const ok = applyTyped(ta.value);
        if (!ok) pushToast('unsaved code discarded — kept last good diagram', 'err');
    }, [applyTyped, pushToast]);

    const switchMode = useCallback(m => {
        if (m === modeRef.current) return;
        commitPendingCode();
        ensureDoc(m);
        modeRef.current = m;
        setModeState(m);
        editSrcRef.current = 'ui';
        if (boardRef.current) boardRef.current.setActive(m === 'flowchart');
        bump();
    }, [commitPendingCode, ensureDoc]);

    const toggleFocus = useCallback(() => {
        setFocusModeState(v => {
            focusRef.current = !v;
            return !v;
        });
    }, []);

    const togglePal = useCallback(() => {
        setPalHiddenState(v => {
            palRef.current = !v;
            return !v;
        });
    }, []);

    const toggleSnap = useCallback(() => {
        setSnapOnState(v => {
            snapRef.current = !v;
            if (boardRef.current) boardRef.current.setSnap(!v);
            return !v;
        });
    }, []);

    const onTaInput = useCallback(() => {
        setSync({ state: 'editing', err: '', warn: '' });
        clearTimeout(syncTimer.current);
        syncTimer.current = setTimeout(applyTyped, 380);
        schedulePreview();
    }, [applyTyped, schedulePreview]);

    const onTaKey = useCallback(e => {
        if (e.key === 'Tab') {
            e.preventDefault();
            const ta = e.target;
            const s = ta.selectionStart, en = ta.selectionEnd;
            const v = ta.value.slice(0, s) + '    ' + ta.value.slice(en);
            setCodeText(v);
            requestAnimationFrame(() => { ta.selectionStart = ta.selectionEnd = s + 4; });
        }
        e.stopPropagation();
    }, []);

    useEffect(() => {
        const h = e => {
            const tag = (e.target.tagName || '').toLowerCase();
            const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
            if (helpOpenRef.current) {
                if (e.key === 'Escape') setHelpOpen(false);
                return;
            }
            if (typing) return;
            const mod = e.ctrlKey || e.metaKey;
            if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); return; }
            if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); doRedo(); return; }
            if (e.key === 'Tab') { e.preventDefault(); toggleFocus(); return; }
            if (boardRef.current && boardRef.current.onKeyDown(e)) return;
        };
        window.addEventListener('keydown', h);
        return () => window.removeEventListener('keydown', h);
    }, [doUndo, doRedo, toggleFocus]);

    useEffect(() => {
        document.body.classList.toggle('focus-mode', focusMode);
        scheduleSave();
    }, [focusMode, scheduleSave]);

    useEffect(() => {
        document.body.classList.toggle('pal-hidden', palHidden);
        scheduleSave();
    }, [palHidden, scheduleSave]);

    useEffect(() => { scheduleSave(); }, [mode, ver, scheduleSave]);

    useEffect(() => {
        if (window.mermaid) {
            window.mermaid.initialize({
                startOnLoad: false,
                theme: 'dark',
                securityLevel: 'loose',
                fontFamily: C.FONT_STACK,
                themeVariables: {
                    primaryColor: '#16233c',
                    primaryTextColor: '#e2e8f0',
                    primaryBorderColor: '#4a6079',
                    lineColor: '#7e93ae',
                    fontSize: '14px',
                },
            });
        }
        const saved = loadSaved();
        if (saved && saved.docs) {
            for (const k of Object.keys(saved.docs)) {
                if (C.MODES[k]) docsRef.current[k] = saved.docs[k];
            }
            const p = saved.prefs || {};
            if (p.snapOn === false) { snapRef.current = false; setSnapOnState(false); }
            if (p.palHidden) { palRef.current = true; setPalHiddenState(true); }
            if (p.focus) { focusRef.current = true; setFocusModeState(true); }
            if (p.lastMode && C.MODES[p.lastMode]) { modeRef.current = p.lastMode; setModeState(p.lastMode); }
        }
        ensureDoc('flowchart');
        const b = new C.Board(wrapRef.current, boardHostRef.current, svc);
        boardRef.current = b;
        b.setSnap(snapRef.current);
        const fm = docsRef.current.flowchart.data;
        b.setModel(fm);
        b.normalizeModel();
        b.renderAll();
        b.setActive(modeRef.current === 'flowchart');
        requestAnimationFrame(() => {
            b.fitView();
            if (modeRef.current !== 'flowchart') switchMode(modeRef.current);
        });
        editSrcRef.current = 'boot';
        bump();
        setSaveChip(saved ? 'restored' : 'ready');
        bootedRef.current = true;
        window.__STUDIO_READY = true;
        return () => { b.destroy(); };
    }, []);

    useEffect(() => {
        const m = modeRef.current;
        const cur = docsRef.current[m] && docsRef.current[m].data;
        if (!cur) return;
        const text = C.MODES[m].gen(cur);
        lastGoodRef.current = text;
        if (editSrcRef.current !== 'code') {
            setCodeText(text);
            setSync({ state: 'ok', err: '', warn: '' });
        }
        scheduleSave();
        schedulePreview();
        if (m === 'flowchart' && editSrcRef.current !== 'code' && boardRef.current) {
            boardRef.current.renderAll();
        }
    }, [ver, mode, scheduleSave, schedulePreview]);

    const isFc = mode === 'flowchart';
    const curData = docsRef.current[mode] ? docsRef.current[mode].data : null;
    const statsTxt = curData ? C.MODES[mode].stats(curData) : '';
    const fcNodes = isFc && curData ? curData.nodes.length : 0;

    const sheetApi = curData ? makeApi({
        data: curData,
        commitData: d => commitData(mode, d),
        snapOf: () => JSON.stringify({ mode, data: curData }),
        pushPre: s => pushUndoPre(s),
    }) : null;

    const copySource = async () => {
        const txt = lastGoodRef.current;
        try {
            await navigator.clipboard.writeText(txt);
            pushToast('mermaid copied to clipboard ✓');
        } catch (e) {
            const ta = document.createElement('textarea');
            ta.value = txt;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
            pushToast('copied ✓');
        }
    };

    const exportSvg = async () => {
        try {
            if (!window.mermaid) throw new Error('mermaid not loaded (offline?)');
            const id = 'ex-' + (++pvCounter.current);
            const { svg } = await window.mermaid.render(id, lastGoodRef.current);
            const stale = document.getElementById('d' + id);
            if (stale) stale.remove();
            downloadBlob('diagram.svg', new Blob([svg], { type: 'image/svg+xml' }));
            pushToast('SVG downloaded');
        } catch (e) { pushToast('render failed: ' + e.message, 'err'); }
    };

    const exportPng = async () => {
        try {
            if (!window.mermaid) throw new Error('mermaid not loaded (offline?)');
            const id = 'ex-' + (++pvCounter.current);
            const { svg } = await window.mermaid.render(id, lastGoodRef.current);
            const stale = document.getElementById('d' + id);
            if (stale) stale.remove();
            const doc = new DOMParser().parseFromString(svg, 'image/svg+xml');
            const vb = doc.documentElement.getAttribute('viewBox');
            let w = 900, h = 600;
            if (vb) { const p = vb.split(/[\s,]+/).map(Number); w = p[2]; h = p[3]; }
            const scale = Math.min(2, 2400 / Math.max(w, h)) || 2;
            const img = new Image();
            const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
            await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
            const cnv = document.createElement('canvas');
            cnv.width = Math.round(w * scale); cnv.height = Math.round(h * scale);
            const ctx = cnv.getContext('2d');
            ctx.fillStyle = '#0b1220';
            ctx.fillRect(0, 0, cnv.width, cnv.height);
            ctx.drawImage(img, 0, 0, cnv.width, cnv.height);
            URL.revokeObjectURL(url);
            await new Promise(res => cnv.toBlob(b => { downloadBlob('diagram.png', b); res(); }, 'image/png'));
            pushToast('PNG downloaded');
        } catch (e) { pushToast('export failed: ' + e.message, 'err'); }
    };

    return (
        <React.Fragment>
            <div id="topbar">
                <div className="brand"><b>🧜 Mermaid Studio</b><span className="sub">visual ⇄ mermaid</span></div>
                <div className="tb-sep"></div>
                <div className="mode-tabs">
                    {MODE_LIST.map(m => (
                        <button key={m} className={'mode-tab' + (mode === m ? ' on' : '')} onClick={() => switchMode(m)}>
                            {C.MODES[m].tab}
                        </button>
                    ))}
                </div>
                <div className="tb-sep"></div>
                <div style={{ display: isFc ? 'contents' : 'none' }}>
                    <button className={'icon-btn' + (palHidden ? '' : ' on')} title="Toggle shape palette" onClick={togglePal}>▦</button>
                    <span className="tb-group">
                        <button className="icon-btn" title="Undo (Ctrl+Z)" disabled={!undoDepth} onClick={doUndo}>↶</button>
                        <button className="icon-btn" title="Redo (Ctrl+Shift+Z)" disabled={!redoDepth} onClick={doRedo}>↷</button>
                        <button title="Group selection into subgraph (Ctrl+G)" onClick={() => boardRef.current && boardRef.current.groupSel()}>⛶ Group</button>
                        <button className="danger" title="Dissolve subgraph(s) of selection (Ctrl+Shift+G)" onClick={() => boardRef.current && boardRef.current.ungroupSel()}>⤿ Ungroup</button>
                        <button className="danger icon-btn" title="Delete selection (Del)" onClick={() => boardRef.current && boardRef.current.deleteSel()}>🗑</button>
                    </span>
                    <span className="tb-sep"></span>
                    <span className="tb-group">
                        <button className="icon-btn" title="Zoom out" onClick={() => boardRef.current && boardRef.current.zoomCenter(1 / 1.22)}>−</button>
                        <span style={{ fontSize: 11, color: 'var(--muted)', minWidth: 42, textAlign: 'center' }}>{zoomK}%</span>
                        <button className="icon-btn" title="Zoom in" onClick={() => boardRef.current && boardRef.current.zoomCenter(1.22)}>+</button>
                        <button title="Fit to view (F)" onClick={() => boardRef.current && boardRef.current.fitView()}>⤢ Fit</button>
                    </span>
                    <span className="tb-sep"></span>
                    <span className="tb-group">
                        <button className={snapOn ? 'on' : ''} title="Snap to 16px grid" onClick={toggleSnap}>⌗ Snap</button>
                        <button title="Auto-arrange with dagre" onClick={() => boardRef.current && boardRef.current.layoutNow()}>✨ Auto layout</button>
                        <USelect style={{}} value={curData ? curData.dir : 'TB'}
                            options={[
                                { value: 'TB', label: '↓ Top → Bottom' },
                                { value: 'LR', label: '→ Left → Right' },
                                { value: 'BT', label: '↑ Bottom → Top' },
                                { value: 'RL', label: '← Right → Left' },
                            ]}
                            onLive={v => boardRef.current && boardRef.current.changeDir(v)}
                            onCommitPre={{ snap: () => JSON.stringify({ mode: 'flowchart', data: docsRef.current.flowchart.data }), push: s => pushUndoPre(s) }} />
                    </span>
                    <span className="tb-sep"></span>
                </div>
                <span className="tb-group">
                    <select value="" title="Load a template" onChange={e => {
                        const v = e.target.value;
                        e.target.value = '';
                        if (v) loadTemplate(v);
                    }}>
                        <option value="">📄 Templates…</option>
                        {C.MODES[mode].templates.map(t => <option key={t.key} value={t.key}>{t.name}</option>)}
                    </select>
                    <button className="icon-btn" title="Help & shortcuts" onClick={() => setHelpOpen(true)}>?</button>
                    <button className="icon-btn" title="Toggle code panel (Tab)" onClick={toggleFocus}>⇥</button>
                </span>
                <div className="spacer"></div>
                <div className="saveChip">{saveChip}</div>
            </div>

            <div id="main">
                {isFc && (
                    <aside className="palette">
                        <h3>Add node</h3>
                        <div className="pal-grid">
                            {C.SHAPE_ORDER.map(key => (
                                <div key={key} className="pal-tile" draggable
                                    title={C.SHAPES[key].name}
                                    onDragStart={e => e.dataTransfer.setData('text/plain', 'shape:' + key)}
                                    onClick={() => boardRef.current && boardRef.current.addShape(key, null)}>
                                    <PalIcon shape={key} />
                                    <span>{C.SHAPES[key].name}</span>
                                </div>
                            ))}
                        </div>
                        <h3>Quick tips</h3>
                        <div className="pal-tip">
                            Drag a tile in, or click it.<br />
                            <b>Drag rim dots</b> between nodes to link.<br />
                            <b>Double-click</b> nodes &amp; arrows to relabel.<br />
                            <code>Shift</code>+drag canvas = rubber band.<br />
                            <code>Ctrl+G</code> groups into a subgraph.
                        </div>
                    </aside>
                )}

                <div ref={wrapRef} className="canvas-wrap" style={{ display: isFc ? undefined : 'none' }}>
                    <div ref={boardHostRef} style={{ position: 'absolute', inset: 0 }}></div>
                    <div className="stats">
                        <span className="chip">{statsTxt}</span>
                    </div>
                    {!fcNodes && (
                        <div className="empty-hint"><div><b>Empty canvas.</b><br />Drag a shape from the left palette,<br />or paste Mermaid code on the right →</div></div>
                    )}
                </div>

                {!isFc && curData && (
                    <ModeShell mode={mode} data={curData} api={sheetApi} />
                )}

                <aside className="right-panel">
                    <div className="rp-head">
                        <span>Mermaid source</span><span className="grow"></span>
                        <button title="Normalize formatting" onClick={() => {
                            const ta = taRef.current;
                            const before = ta.value;
                            setCodeText(lastGoodRef.current);
                            if (lastGoodRef.current !== before) pushToast('formatted');
                            clearTimeout(syncTimer.current);
                            applyTyped(lastGoodRef.current);
                        }}>Format</button>
                        <button title="Copy source" onClick={copySource}>Copy</button>
                        <button title="Download .mmd file" onClick={() => {
                            downloadBlob('diagram.mmd', new Blob([lastGoodRef.current], { type: 'text/plain' }));
                            pushToast('.mmd downloaded');
                        }}>.mmd</button>
                        <button className="danger" title="Clear everything" onClick={() => {
                            pushUndoPre(null);
                            const m = modeRef.current;
                            const fresh = C.MODES[m].empty();
                            if (m === 'flowchart') {
                                fresh.dir = docsRef.current.flowchart.data.dir;
                                docsRef.current.flowchart = { data: fresh };
                                boardRef.current.clearSelection();
                                boardRef.current.setModel(fresh);
                            } else {
                                docsRef.current[m] = { data: fresh };
                            }
                            editSrcRef.current = 'ui';
                            bump();
                            pushToast('cleared — Ctrl+Z to undo');
                        }}>Clear</button>
                    </div>
                    <textarea ref={taRef} className="code-ta" spellCheck="false" autoCapitalize="off" autoComplete="off"
                        value={codeText}
                        onChange={e => { setCodeText(e.target.value); onTaInput(); }}
                        onKeyDown={onTaKey}></textarea>
                    <div className="sync-row">
                        <span className={'sync-chip ' + sync.state}>{sync.state === 'ok' ? 'synced' : sync.state === 'editing' ? 'editing…' : 'parse error'}</span>
                        <span className="warn-chip">{sync.warn}</span>
                        <span className="err-chip">{sync.err}</span>
                    </div>
                    <div className="rp-head">
                        <span>{isFc ? 'Live render' : 'Official render'}{statsTxt ? '' : ''}</span><span className="grow"></span>
                        <button title="Download SVG" onClick={exportSvg}>⬇ SVG</button>
                        <button title="Download PNG" onClick={exportPng}>⬇ PNG</button>
                    </div>
                    <div className="preview">
                        {pvErr ? <div className="preview-msg err">{pvErr}</div> :
                            pvHtml ? <div dangerouslySetInnerHTML={{ __html: pvHtml }} /> :
                                <div className="preview-msg">rendering…</div>}
                    </div>
                </aside>
            </div>

            <div className="toasts">
                {toasts.map(t => <div key={t.id} className={'toast' + (t.type ? ' ' + t.type : '')}>{t.msg}</div>)}
            </div>

            {helpOpen && (
                <div className="help-modal" onClick={e => { if (e.target === e.currentTarget) setHelpOpen(false); }}>
                    <div className="help-card">
                        <button className="help-close" onClick={() => setHelpOpen(false)}>✕ Close</button>
                        <h2>🧜 Mermaid Studio</h2>
                        <div className="hsub">Four diagram modes, each perfectly in sync between a visual editor and Mermaid text — edit either side, both stay true.</div>
                        <div className="help-cols">
                            <div>
                                <h4>Modes</h4>
                                <ul className="syn">
                                    <li><b>🪢 Graph</b> — drag-and-drop flowchart canvas (all shapes, subgraphs, colours)</li>
                                    <li><b>💬 Sequence</b> — participants &amp; message rows, notes, dividers, activations</li>
                                    <li><b>📊 Gantt</b> — sections &amp; task bars with dates, durations, “after” chains, milestones</li>
                                    <li><b>🥧 Pie</b> — labelled slices with values</li>
                                </ul>
                                <h4>Graph canvas</h4>
                                <table className="keys">
                                    <tr><td><kbd>drag</kbd> node</td><td>move (snaps when enabled)</td></tr>
                                    <tr><td><kbd>drag</kbd> rim dot</td><td>draw an edge</td></tr>
                                    <tr><td><kbd>dbl-click</kbd></td><td>relabel node / edge / group</td></tr>
                                    <tr><td><kbd>Shift</kbd>+drag empty</td><td>rubber-band select</td></tr>
                                    <tr><td><kbd>Space</kbd>+drag · wheel</td><td>pan · zoom</td></tr>
                                </table>
                                <h4>Everywhere</h4>
                                <table className="keys">
                                    <tr><td><kbd>Ctrl</kbd><kbd>Z</kbd> / <kbd>Y</kbd></td><td>undo / redo</td></tr>
                                    <tr><td><kbd>Ctrl</kbd><kbd>D</kbd> <kbd>A</kbd> <kbd>G</kbd></td><td>duplicate · select all · group</td></tr>
                                    <tr><td><kbd>Del</kbd></td><td>delete selection</td></tr>
                                    <tr><td><kbd>F</kbd></td><td>fit graph view</td></tr>
                                    <tr><td><kbd>Tab</kbd></td><td>toggle code panel</td></tr>
                                </table>
                            </div>
                            <div>
                                <h4>Two-way sync, how it works</h4>
                                <ul className="syn">
                                    <li>Visual edits rewrite the source instantly.</li>
                                    <li>Typing in the source re-parses after a short pause and updates the visual side.</li>
                                    <li>Each mode keeps its own document — switching tabs never loses work. Undo history works across modes too.</li>
                                    <li>In Graph mode positions are remembered by node id; newcomers arrive near their neighbours and ✨ Auto layout re-arranges cleanly.</li>
                                </ul>
                                <h4>Supported syntax</h4>
                                <ul className="syn">
                                    <li><code>flowchart TB|LR|BT|RL</code>, all node shapes, <code>--&gt;</code> <code>---</code> <code>-.-&gt;</code> <code>==&gt;</code> with <code>|labels|</code>, <code>&amp;</code> chaining, <code>subgraph</code>, <code>classDef/class/style</code></li>
                                    <li><code>sequenceDiagram</code>: participant/actor, all eight arrows, <code>Note over/left/right</code>, activate/deactivate, autonumber</li>
                                    <li><code>gantt</code>: sections, tasks with <code>done/active/crit/milestone</code>, aliases, dates or <code>after</code> deps, durations, dateFormat/axisFormat/excludes</li>
                                    <li><code>pie</code>: quoted labels, values, showData, title</li>
                                </ul>
                                <div className="muted-note">
                                    Gracefully ignored on import: linkStyle/click, nested subgraphs (flattened), loop/alt blocks.
                                    Everything exports back as clean canonical Mermaid. Work autosaves to this browser.
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            )}
        </React.Fragment>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
