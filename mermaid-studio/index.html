function svgEl(tag, attrs) {
    const el = document.createElementNS(SVG_NS, tag);
    if (attrs) for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
}

const drawShape = (shape, w, h) => {
    const hw = w / 2, hh = h / 2;
    const pts = arr => arr.map(p => p.join(',')).join(' ');
    switch (shape) {
        case 'round': return [{ tag: 'rect', attrs: { x: -hw, y: -hh, width: w, height: h, rx: Math.min(16, hh) } }];
        case 'stadium': return [{ tag: 'rect', attrs: { x: -hw, y: -hh, width: w, height: h, rx: hh } }];
        case 'circle': return [{ tag: 'ellipse', attrs: { cx: 0, cy: 0, rx: hw, ry: hh } }];
        case 'diamond': return [{ tag: 'polygon', attrs: { points: pts([[-hw, 0], [0, -hh], [hw, 0], [0, hh]]) } }];
        case 'hex': {
            const d = w * 0.13;
            return [{ tag: 'polygon', attrs: { points: pts([[-hw + d, -hh], [hw - d, -hh], [hw, 0], [hw - d, hh], [-hw + d, hh], [-hw, 0]]) } }];
        }
        case 'para': {
            const d = 14;
            return [{ tag: 'polygon', attrs: { points: pts([[-hw + d, -hh], [hw, -hh], [hw, hh], [-hw + d, hh], [-hw, 0]]) } }];
        }
        case 'sub': return [
            { tag: 'rect', attrs: { x: -hw, y: -hh, width: w, height: h, rx: 4 } },
            { tag: 'path', attrs: { d: `M${-hw + 8},${-hh}V${hh}M${hw - 8},${-hh}V${hh}`, fill: 'none' } },
        ];
        case 'cyl': {
            const r = Math.min(11, hh * 0.5);
            return [
                { tag: 'path', attrs: { d: `M${-hw},${-hh + r} A ${hw} ${r} 0 0 1 ${hw},${-hh + r} L ${hw},${hh - r} A ${hw} ${r} 0 0 1 ${-hw},${hh - r} Z` } },
                { tag: 'path', attrs: { d: `M${-hw},${-hh + r} A ${hw} ${r} 0 0 0 ${hw},${-hh + r}`, fill: 'none' } },
            ];
        }
        default: return [{ tag: 'rect', attrs: { x: -hw, y: -hh, width: w, height: h, rx: 10 } }];
    }
};

class Board {
    constructor(hostWrap, boardHost, svc) {
        this.svc = svc;
        this.model = null;
        this.view = { x: 0, y: 0, k: 1 };
        this.selNodes = new Set();
        this.selEdges = new Set();
        this.selSg = null;
        this.drag = null;
        this.spaceDown = false;
        this.pendSnap = null;
        this.snapOn = true;
        this.active = true;
        this.editorMode = null;
        this.fitTimer = null;

        const wrap = hostWrap;
        this.wrap = hostWrap;
        this.boardHost = boardHost;
        this.svg = svgEl('svg', { class: 'board' });
        this.defsEl = svgEl('defs', {});
        this.world = svgEl('g', {});
        this.sgLayer = svgEl('g', {});
        this.edgeLayer = svgEl('g', {});
        this.nodeLayer = svgEl('g', {});
        this.tempLayer = svgEl('g', { class: 'tempLayer' });
        this.world.appendChild(this.sgLayer);
        this.world.appendChild(this.edgeLayer);
        this.world.appendChild(this.nodeLayer);
        this.world.appendChild(this.tempLayer);
        this.svg.appendChild(this.defsEl);
        this.svg.appendChild(this.world);
        this.band = document.createElement('div');
        this.band.className = 'band';
        this.pill = document.createElement('div');
        this.pill.className = 'pill';
        const mkBtn = (txt, title, cls) => {
            const b = document.createElement('button');
            b.textContent = txt;
            b.title = title || '';
            if (cls) b.className = cls;
            return b;
        };
        this.pilPrev = mkBtn('‹', 'Previous shape');
        this.pillName = document.createElement('span');
        this.pillName.className = 'pill-shape-name';
        this.pilNext = mkBtn('›', 'Next shape');
        this.pilSw = document.createElement('div');
        this.pilSw.className = 'swatches';
        this.pilEdit = mkBtn('✎', 'Edit label');
        this.pilDup = mkBtn('⧉', 'Duplicate');
        this.pilDel = mkBtn('🗑', 'Delete', 'danger');
        this.pill.appendChild(this.pilPrev);
        this.pill.appendChild(this.pillName);
        this.pill.appendChild(this.pilNext);
        this.pill.appendChild(this.pilSw);
        this.pill.appendChild(this.pilEdit);
        this.pill.appendChild(this.pilDup);
        this.pill.appendChild(this.pilDel);
        this.editor = document.createElement('textarea');
        this.editor.className = 'editor-overlay';
        this.editor.spellcheck = false;
        boardHost.appendChild(this.svg);
        boardHost.appendChild(this.band);
        boardHost.appendChild(this.pill);
        boardHost.appendChild(this.editor);

        this.buildDefs();

        this._onWheel = e => {
            if (!this.active) return;
            e.preventDefault();
            const p = this.screenPt(e);
            this.zoomAt(p.x, p.y, Math.exp(-e.deltaY * 0.0013));
        };
        this._onDown = e => this.onPointerDown(e);
        this._onMove = e => this.onPointerMove(e);
        this._onUp = e => this.onPointerUp(e);
        this._onDbl = e => this.onDblClick(e);
        this.svg.addEventListener('wheel', this._onWheel, { passive: false });
        this.svg.addEventListener('pointerdown', this._onDown);
        this.svg.addEventListener('pointermove', this._onMove);
        this.svg.addEventListener('pointerup', this._onUp);
        this.svg.addEventListener('dblclick', this._onDbl);

        this.pilPrev.addEventListener('click', () => this.cycleShape(-1));
        this.pilNext.addEventListener('click', () => this.cycleShape(1));
        this.pilEdit.addEventListener('click', () => {
            if (this.selNodes.size === 1) this.openNodeEditor([...this.selNodes][0]);
        });
        this.pilDup.addEventListener('click', () => this.duplicateSel());
        this.pilDel.addEventListener('click', () => this.deleteSel());

        this._edInput = () => this.autosizeEditor();
        this._edKey = e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.closeEditor(false); }
            if (e.key === 'Escape') { e.preventDefault(); this.closeEditor(true); }
            e.stopPropagation();
        };
        this._edBlur = () => this.closeEditor(false);
        this.editor.addEventListener('input', this._edInput);
        this.editor.addEventListener('keydown', this._edKey);
        this.editor.addEventListener('blur', this._edBlur);

        this._onKey = e => this.onKeyDown(e);
        this._onKeyUp = e => {
            if (e.key === ' ') { this.spaceDown = false; this.svg.style.cursor = ''; }
        };
        this._onResize = () => this.positionPill();
        window.addEventListener('keydown', this._onKey);
        window.addEventListener('keyup', this._onKeyUp);
        window.addEventListener('resize', this._onResize);

        this._onWrapDragOver = e => { if (!this.active) return; e.preventDefault(); };
        this._onWrapDrop = e => {
            if (!this.active) return;
            e.preventDefault();
            const data = e.dataTransfer.getData('text/plain');
            if (!data.startsWith('shape:')) return;
            const shape = data.slice(6);
            if (!SHAPES[shape]) return;
            const p = this.screenPt(e);
            const w = this.screenToWorld(p.x, p.y);
            this.addShape(shape, w);
        };
        wrap.addEventListener('dragover', this._onWrapDragOver);
        wrap.addEventListener('drop', this._onWrapDrop);
    }

    destroy() {
        window.removeEventListener('keydown', this._onKey);
        window.removeEventListener('keyup', this._onKeyUp);
        window.removeEventListener('resize', this._onResize);
        if (this.wrap) {
            this.wrap.removeEventListener('dragover', this._onWrapDragOver);
            this.wrap.removeEventListener('drop', this._onWrapDrop);
        }
        clearTimeout(this.fitTimer);
    }

    buildDefs() {
        let html = '';
        const mk = (id, color, w) =>
            `<marker id="${id}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="${w}" markerHeight="${w}" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${color}"/></marker>`;
        html += mk('ah-n', '#7e93ae', 6.5) + mk('ah-s', '#22d3ee', 6.5) + mk('ah-n-big', '#7e93ae', 9) + mk('ah-s-big', '#22d3ee', 9);
        this.defsEl.innerHTML = html;
    }

    setModel(m) { this.model = m; this.renderAll(); }

    centerWorld() {
        return this.screenToWorld(this.svg.clientWidth / 2, this.svg.clientHeight / 2);
    }

    setActive(a) { this.active = a; }
    setSnap(b) { this.snapOn = b; }

    nodeById(id) { return this.model.nodes.find(n => n.id === id) || null; }
    nextNodeId() { let i = 1; while (this.nodeById('n' + i)) i++; return 'n' + i; }
    nextEdgeId() { let i = 1; while (this.model.edges.some(e => e.id === 'e' + i)) i++; return 'e' + i; }
    nextSgId() {
        let i = 1;
        const taken = new Set([...this.model.nodes.map(n => n.id), ...this.model.sgs.map(s => s.id)]);
        while (taken.has('SG' + i)) i++;
        return 'SG' + i;
    }

    addShape(shape, worldPt) {
        this.svc.pushUndo(null);
        const c = worldPt || this.centerWorld();
        const n = {
            id: this.nextNodeId(),
            label: SHAPES[shape].name,
            shape, x: 0, y: 0, w: 0, h: 0, style: null,
        };
        sizeNode(n);
        n.x = this.snapOn ? Math.round((c.x + (Math.random() * 60 - 30)) / GRID) * GRID : c.x;
        n.y = this.snapOn ? Math.round((c.y + (Math.random() * 60 - 30)) / GRID) * GRID : c.y;
        this.model.nodes.push(n);
        this.changed({ keepView: true });
        this.clearSelection();
        this.selNodes.add(n.id);
        this.refreshSelClasses();
        this.showPill();
    }

    normalizeModel() {
        this.model.nodes.forEach(sizeNode);
        this.model.edges = this.model.edges.filter(e => this.nodeById(e.from) && this.nodeById(e.to));
        const known = new Set(this.model.nodes.map(n => n.id));
        this.model.sgs.forEach(s => { s.members = s.members.filter(id => known.has(id)); });
        this.model.sgs = this.model.sgs.filter(s => s.members.length > 0);
    }

    changed(opts) {
        opts = opts || {};
        this.normalizeModel();
        this.renderAll();
        if (!opts.keepView) this.fitSoon();
        this.svc.onChanged();
    }

    fitSoon() {
        clearTimeout(this.fitTimer);
        this.fitTimer = setTimeout(() => this.fitView(), 60);
    }

    clearSelection() {
        this.selNodes.clear(); this.selEdges.clear(); this.selSg = null;
        this.hidePill();
    }

    refreshSelClasses() {
        for (const el of this.nodeLayer.children) {
            el.classList.toggle('sel', this.selNodes.has(el.dataset.id));
        }
        for (const el of this.edgeLayer.children) {
            el.classList.toggle('sel', this.selEdges.has(el.dataset.id));
        }
        for (const el of this.sgLayer.children) {
            el.classList.toggle('sel', this.selSg === el.dataset.id);
        }
    }

    deleteSel() {
        if (!this.selNodes.size && !this.selEdges.size && !this.selSg) return;
        this.svc.pushUndo(null);
        for (const id of this.selEdges) this.model.edges = this.model.edges.filter(e => e.id !== id);
        if (this.selNodes.size) {
            this.model.nodes = this.model.nodes.filter(n => !this.selNodes.has(n.id));
            this.model.edges = this.model.edges.filter(e => !this.selNodes.has(e.from) && !this.selNodes.has(e.to));
        }
        if (this.selSg) this.model.sgs = this.model.sgs.filter(s => s.id !== this.selSg);
        this.clearSelection();
        this.changed({ keepView: true });
    }

    duplicateSel() {
        if (!this.selNodes.size) return;
        this.svc.pushUndo(null);
        const map = new Map();
        const clones = [];
        for (const id of this.selNodes) {
            const src = this.nodeById(id);
            const n = JSON.parse(JSON.stringify(src));
            n.id = this.nextNodeId();
            map.set(id, n.id);
            n.x += 28; n.y += 28;
            this.model.nodes.push(n);
            clones.push(n.id);
        }
        for (const e of this.model.edges.slice()) {
            if (map.has(e.from) && map.has(e.to)) {
                this.model.edges.push({ id: this.nextEdgeId(), from: map.get(e.from), to: map.get(e.to), kind: e.kind, label: e.label });
            }
        }
        this.clearSelection();
        clones.forEach(id => this.selNodes.add(id));
        this.changed({ keepView: true });
        this.refreshSelClasses();
        this.showPill();
    }

    groupSel() {
        if (!this.selNodes.size) { this.svc.toast('select some nodes first'); return; }
        this.svc.pushUndo(null);
        const existing = this.model.sgs.find(s => s.members.some(id => this.selNodes.has(id)));
        let sg;
        if (existing) {
            sg = existing;
            for (const id of this.selNodes) if (!sg.members.includes(id)) sg.members.push(id);
        } else {
            sg = { id: this.nextSgId(), title: 'Group ' + (this.model.sgs.length + 1), members: [...this.selNodes] };
            this.model.sgs.push(sg);
        }
        this.selSg = sg.id;
        this.changed({ keepView: true });
        this.svc.toast('grouped as ' + sg.id);
    }

    ungroupSel() {
        const hits = this.model.sgs.filter(s => (this.selSg === s.id) || s.members.some(id => this.selNodes.has(id)));
        if (!hits.length) { this.svc.toast('no group under selection'); return; }
        this.svc.pushUndo(null);
        this.model.sgs = this.model.sgs.filter(s => !hits.includes(s));
        this.selSg = null;
        this.changed({ keepView: true });
    }

    cycleShape(dir) {
        if (this.selNodes.size !== 1) return;
        const n = this.nodeById([...this.selNodes][0]);
        this.svc.pushUndo(null);
        let i = SHAPE_ORDER.indexOf(n.shape);
        i = (i + dir + SHAPE_ORDER.length) % SHAPE_ORDER.length;
        n.shape = SHAPE_ORDER[i];
        sizeNode(n);
        this.changed({ keepView: true });
    }

    applySwatch(style) {
        this.svc.pushUndo(null);
        for (const id of this.selNodes) {
            const n = this.nodeById(id);
            n.style = style ? Object.assign({}, style) : null;
        }
        this.changed({ keepView: true });
    }

    changeDir(d) {
        this.svc.pushUndo(null);
        this.model.dir = d;
        this.changed({ keepView: true });
    }

    layoutNow() {
        const ok = autoLayoutModel(this.model);
        if (!ok) { this.svc.toast(window.dagre ? 'nothing to lay out' : 'dagre not loaded — check connection', window.dagre ? undefined : 'err'); return false; }
        this.changed({ keepView: true });
        setTimeout(() => this.fitView(), 80);
        return true;
    }

    screenPt(e) {
        const r = this.svg.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    screenToWorld(px, py) {
        return { x: (px - this.view.x) / this.view.k, y: (py - this.view.y) / this.view.k };
    }
    worldToScreen(wx, wy) {
        return { x: wx * this.view.k + this.view.x, y: wy * this.view.k + this.view.y };
    }

    applyViewTransform() {
        this.world.setAttribute('transform', `translate(${this.view.x},${this.view.y}) scale(${this.view.k})`);
        this.svc.onZoom(Math.round(this.view.k * 100));
        this.positionPill();
    }

    zoomAt(px, py, factor) {
        const k2 = Math.min(3, Math.max(0.2, this.view.k * factor));
        factor = k2 / this.view.k;
        this.view.x = px - (px - this.view.x) * factor;
        this.view.y = py - (py - this.view.y) * factor;
        this.view.k = k2;
        this.applyViewTransform();
    }

    zoomCenter(f) { this.zoomAt(this.svg.clientWidth / 2, this.svg.clientHeight / 2, f); }

    fitView() {
        const m = this.model;
        if (!m || !m.nodes.length) { this.view = { x: 0, y: 0, k: 1 }; this.applyViewTransform(); return; }
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const n of m.nodes) {
            minX = Math.min(minX, n.x - n.w / 2); maxX = Math.max(maxX, n.x + n.w / 2);
            minY = Math.min(minY, n.y - n.h / 2); maxY = Math.max(maxY, n.y + n.h / 2);
        }
        const cw = this.svg.clientWidth, ch = this.svg.clientHeight;
        const pad = 70;
        const k = Math.min((cw - pad * 2) / Math.max(maxX - minX, 1), (ch - pad * 2) / Math.max(maxY - minY, 1), 1.4);
        this.view.k = Math.max(k, 0.2);
        this.view.x = (cw - (minX + maxX) * this.view.k) / 2;
        this.view.y = (ch - (minY + maxY) * this.view.k) / 2;
        this.applyViewTransform();
    }

    onPointerDown(e) {
        if (!this.active || !this.model) return;
        if (e.button === 2) return;
        this.closeEditor(true);
        const sp = this.screenPt(e);
        const t = e.target;
        const handleEl = t.closest && t.closest('.handle');
        if (handleEl) {
            const nid = handleEl.closest('.node').dataset.id;
            const n = this.nodeById(nid);
            this.drag = { mode: 'link', from: nid, side: handleEl.dataset.side, start: anchorOf(n, handleEl.dataset.side), hover: null };
            this.pendSnap = this.svc.snapshot();
            const temp = svgEl('path', {});
            this.tempLayer.appendChild(temp);
            this.drag.temp = temp;
            try { if (this.svg.setPointerCapture) this.svg.setPointerCapture(e.pointerId); } catch (err) {}
            return;
        }
        const ng = t.closest && t.closest('.node');
        if (ng) {
            const id = ng.dataset.id;
            if (e.shiftKey) {
                this.selNodes.has(id) ? this.selNodes.delete(id) : this.selNodes.add(id);
            } else if (!this.selNodes.has(id)) {
                this.clearSelection();
                this.selNodes.add(id);
            }
            this.refreshSelClasses();
            this.showPill();
            const wp = this.screenToWorld(sp.x, sp.y);
            const orig = new Map();
            for (const nid of this.selNodes) { const n = this.nodeById(nid); orig.set(nid, { x: n.x, y: n.y }); }
            this.drag = { mode: 'nodes', startW: wp, orig, moved: false, sx: sp.x, sy: sp.y };
            this.pendSnap = this.svc.snapshot();
            try { if (this.svg.setPointerCapture) this.svg.setPointerCapture(e.pointerId); } catch (err) {}
            return;
        }
        const eg = t.closest && t.closest('.edge');
        if (eg) {
            const id = eg.dataset.id;
            if (e.shiftKey) this.selEdges.has(id) ? this.selEdges.delete(id) : this.selEdges.add(id);
            else { this.clearSelection(); this.selEdges.add(id); }
            this.refreshSelClasses();
            this.hidePill();
            return;
        }
        const sgEl = t.closest && t.closest('.sg-box');
        if (sgEl) {
            const sid = sgEl.dataset.id;
            this.selSg = sid;
            this.refreshSelClasses();
            const sg = this.model.sgs.find(s => s.id === sid);
            const orig = new Map();
            for (const id of sg.members) { const n = this.nodeById(id); if (n) orig.set(id, { x: n.x, y: n.y }); }
            this.drag = { mode: 'sg', sid, startW: this.screenToWorld(sp.x, sp.y), orig, moved: false };
            this.pendSnap = this.svc.snapshot();
            try { if (this.svg.setPointerCapture) this.svg.setPointerCapture(e.pointerId); } catch (err) {}
            return;
        }
        if (this.spaceDown || e.button === 1) {
            this.drag = { mode: 'pan', sx: sp.x, sy: sp.y, vx: this.view.x, vy: this.view.y };
            try { if (this.svg.setPointerCapture) this.svg.setPointerCapture(e.pointerId); } catch (err) {}
            return;
        }
        if (e.shiftKey) {
            this.drag = { mode: 'band', sx: sp.x, sy: sp.y };
            this.band.style.display = 'block';
            this.band.style.left = sp.x + 'px'; this.band.style.top = sp.y + 'px';
            this.band.style.width = '0px'; this.band.style.height = '0px';
            this.drag.baseSel = new Set(this.selNodes);
            try { if (this.svg.setPointerCapture) this.svg.setPointerCapture(e.pointerId); } catch (err) {}
        } else {
            this.clearSelection();
            this.refreshSelClasses();
            this.drag = { mode: 'pan', sx: sp.x, sy: sp.y, vx: this.view.x, vy: this.view.y };
            try { if (this.svg.setPointerCapture) this.svg.setPointerCapture(e.pointerId); } catch (err) {}
        }
    }

    onPointerMove(e) {
        const drag = this.drag;
        if (!drag || !this.active) return;
        const sp = this.screenPt(e);
        if (drag.mode === 'pan') {
            this.view.x = drag.vx + (sp.x - drag.sx);
            this.view.y = drag.vy + (sp.y - drag.sy);
            this.applyViewTransform();
            return;
        }
        if (drag.mode === 'band') {
            const x = Math.min(drag.sx, sp.x), y = Math.min(drag.sy, sp.y);
            this.band.style.left = x + 'px'; this.band.style.top = y + 'px';
            this.band.style.width = Math.abs(sp.x - drag.sx) + 'px';
            this.band.style.height = Math.abs(sp.y - drag.sy) + 'px';
            const a = this.screenToWorld(drag.sx, drag.sy), b = this.screenToWorld(sp.x, sp.y);
            const r = { x1: Math.min(a.x, b.x), y1: Math.min(a.y, b.y), x2: Math.max(a.x, b.x), y2: Math.max(a.y, b.y) };
            this.selNodes = new Set(drag.baseSel);
            for (const n of this.model.nodes) {
                if (n.x + n.w / 2 >= r.x1 && n.x - n.w / 2 <= r.x2 && n.y + n.h / 2 >= r.y1 && n.y - n.h / 2 <= r.y2) this.selNodes.add(n.id);
            }
            this.refreshSelClasses();
            return;
        }
        if (drag.mode === 'nodes') {
            const wp = this.screenToWorld(sp.x, sp.y);
            let dx = wp.x - drag.startW.x, dy = wp.y - drag.startW.y;
            if (!drag.moved && Math.abs(sp.x - drag.sx) + Math.abs(sp.y - drag.sy) < 3) return;
            if (!drag.moved) { this.svc.pushUndo(this.pendSnap); drag.moved = true; }
            if (this.snapOn && drag.orig.size === 1) {
                const o = [...drag.orig.values()][0];
                dx = Math.round((o.x + dx) / GRID) * GRID - o.x;
                dy = Math.round((o.y + dy) / GRID) * GRID - o.y;
            } else {
                dx = Math.round(dx); dy = Math.round(dy);
            }
            const touched = new Set();
            for (const [nid, o] of drag.orig) {
                const n = this.nodeById(nid);
                if (!n) continue;
                n.x = o.x + dx; n.y = o.y + dy;
                touched.add(nid);
            }
            this.fastUpdatePositions(touched);
            return;
        }
        if (drag.mode === 'sg') {
            const wp = this.screenToWorld(sp.x, sp.y);
            const dx = Math.round(wp.x - drag.startW.x), dy = Math.round(wp.y - drag.startW.y);
            if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 3) return;
            if (!drag.moved) { this.svc.pushUndo(this.pendSnap); drag.moved = true; }
            const touched = new Set();
            for (const [nid, o] of drag.orig) {
                const n = this.nodeById(nid);
                if (!n) continue;
                n.x = o.x + dx; n.y = o.y + dy;
                touched.add(nid);
            }
            this.fastUpdatePositions(touched);
            return;
        }
        if (drag.mode === 'link') {
            const wp = this.screenToWorld(sp.x, sp.y);
            let best = null, bestD = Infinity;
            for (const n of this.model.nodes) {
                if (n.id === drag.from) continue;
                const d = (n.x - wp.x) ** 2 + (n.y - wp.y) ** 2;
                const rad = Math.max(Math.hypot(n.w, n.h) / 2 + 34 / this.view.k, 52 / this.view.k);
                if (d < rad * rad && d < bestD) { best = n; bestD = d; }
            }
            drag.hover = best ? best.id : null;
            const end = best
                ? anchorOf(best, sideTowards(best, drag.start.x, drag.start.y))
                : wp;
            drag.temp.setAttribute('d', `M${drag.start.x},${drag.start.y} Q ${(drag.start.x + end.x) / 2},${Math.min(drag.start.y, end.y) - 40} ${end.x},${end.y}`);
        }
    }

    onPointerUp(e) {
        const drag = this.drag;
        if (!drag) return;
        if (drag.mode === 'link') {
            drag.temp.remove();
            if (drag.hover) {
                this.svc.pushUndo(this.pendSnap);
                this.model.edges.push({ id: this.nextEdgeId(), from: drag.from, to: drag.hover, kind: 'arrow', label: '' });
                this.changed({ keepView: true });
            }
        } else if ((drag.mode === 'nodes' || drag.mode === 'sg') && drag.moved) {
            this.changed({ keepView: true });
        }
        this.band.style.display = 'none';
        this.drag = null;
        this.pendSnap = null;
    }

    onDblClick(e) {
        if (!this.active || !this.model) return;
        const t = e.target;
        const ng = t.closest && t.closest('.node');
        if (ng) { this.openNodeEditor(ng.dataset.id); return; }
        const eg = t.closest && t.closest('.edge');
        if (eg) { this.openEdgeEditor(eg.dataset.id); return; }
        const sg = t.closest && t.closest('.sg-box');
        if (sg) {
            const s = this.model.sgs.find(x => x.id === sg.dataset.id);
            if (s) this.openTitleEditor(s);
        }
    }

    fastUpdatePositions(ids) {
        for (const el of this.nodeLayer.children) {
            if (!ids.has(el.dataset.id)) continue;
            const n = this.nodeById(el.dataset.id);
            el.setAttribute('transform', `translate(${n.x},${n.y})`);
        }
        for (const e of this.model.edges) {
            if (!ids.has(e.from) && !ids.has(e.to)) continue;
            this.redrawEdge(e);
        }
        for (const el of this.sgLayer.children) {
            const sg = this.model.sgs.find(s => s.id === el.dataset.id);
            if (!sg) continue;
            if (!sg.members.some(id => ids.has(id))) continue;
            const b = this.sgBounds(sg);
            const rect = el.querySelector('rect');
            const label = el.querySelector('text');
            rect.setAttribute('x', b.x); rect.setAttribute('y', b.y);
            rect.setAttribute('width', b.w); rect.setAttribute('height', b.h);
            label.setAttribute('x', b.x + 12); label.setAttribute('y', b.y + 17);
        }
        this.positionPill();
    }

    redrawEdge(e) {
        const g = this.edgeLayer.querySelector(`[data-id="${e.id}"]`);
        if (!g) return;
        const geo = this.edgeGeom(e);
        if (!geo) return;
        g.querySelector('.hit').setAttribute('d', geo.d);
        g.querySelector('.line').setAttribute('d', geo.d);
        const lab = g.querySelector('.elabel');
        if (lab) {
            lab.remove();
            this.buildEdgeLabel(g, e, geo);
        }
    }

    edgeGeom(e) {
        const a = this.nodeById(e.from), b = this.nodeById(e.to);
        if (!a || !b) return null;
        if (a.id === b.id) {
            const sx = a.x + a.w * 0.25, sy = a.y - a.h / 2;
            const ex = a.x + a.w / 2, ey = a.y - a.h * 0.25;
            const mx = (sx + ex) / 2 + 62, my = (sy + ey) / 2 - 62;
            return { d: `M${sx},${sy} C ${sx + 105},${sy - 105} ${ex + 105},${ey - 105} ${ex},${ey}`, mx, my };
        }
        const s1 = sideTowards(a, b.x, b.y), s2 = sideTowards(b, a.x, a.y);
        const p1 = anchorOf(a, s1), p2 = anchorOf(b, s2);
        const par = this.model.edges.filter(o =>
            (o.from === e.from && o.to === e.to) || (o.from === e.to && o.to === e.from));
        const pi = par.indexOf(e);
        const off = pi <= 0 ? 0 : (pi % 2 ? 1 : -1) * Math.ceil(pi / 2) * 24;
        const dirV = v => v === 'l' ? [-1, 0] : v === 'r' ? [1, 0] : v === 't' ? [0, -1] : [0, 1];
        const dv1 = dirV(s1), dv2 = dirV(s2);
        const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const k = Math.min(Math.max(dist * 0.34, 26), 140);
        let nx = 0, ny = 0;
        if (off) {
            const lx = (p2.x - p1.x) / dist, ly = (p2.y - p1.y) / dist;
            nx = -ly * off; ny = lx * off;
        }
        const c1 = { x: p1.x + dv1[0] * k + nx, y: p1.y + dv1[1] * k + ny };
        const c2 = { x: p2.x + dv2[0] * k + nx, y: p2.y + dv2[1] * k + ny };
        const d = `M${p1.x},${p1.y} C ${c1.x},${c1.y} ${c2.x},${c2.y} ${p2.x},${p2.y}`;
        const mx = (p1.x + 3 * c1.x + 3 * c2.x + p2.x) / 8;
        const my = (p1.y + 3 * c1.y + 3 * c2.y + p2.y) / 8;
        return { d, mx, my };
    }

    buildEdgeLabel(g, e, geo) {
        if (!e.label) return;
        const w = textWidth(e.label) + 12;
        const h = 18;
        const lab = svgEl('g', { class: 'elabel', transform: `translate(${geo.mx},${geo.my})` });
        lab.appendChild(svgEl('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: 5 }));
        const txt = svgEl('text', { 'text-anchor': 'middle', dy: '4' });
        txt.textContent = e.label;
        lab.appendChild(txt);
        g.appendChild(lab);
    }

    renderEdges() {
        this.edgeLayer.innerHTML = '';
        for (const e of this.model.edges) {
            const geo = this.edgeGeom(e);
            if (!geo) continue;
            const g = svgEl('g', { class: 'edge k-' + e.kind + (this.selEdges.has(e.id) ? ' sel' : ''), 'data-id': e.id });
            g.appendChild(svgEl('path', { class: 'hit', d: geo.d }));
            const lineAttrs = { class: 'line', d: geo.d };
            const col = this.selEdges.has(e.id) ? 's' : 'n';
            const mk = e.kind === 'thick' ? `url(#ah-${col}-big)` :
                (e.kind === 'arrow' || e.kind === 'dotted') ? `url(#ah-${col})` : null;
            if (mk) lineAttrs['marker-end'] = mk;
            g.appendChild(svgEl('path', lineAttrs));
            this.buildEdgeLabel(g, e, geo);
            this.edgeLayer.appendChild(g);
        }
    }

    sgBounds(sg) {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const id of sg.members) {
            const n = this.nodeById(id);
            if (!n) continue;
            minX = Math.min(minX, n.x - n.w / 2);
            minY = Math.min(minY, n.y - n.h / 2);
            maxX = Math.max(maxX, n.x + n.w / 2);
            maxY = Math.max(maxY, n.y + n.h / 2);
        }
        if (minX === Infinity) return { x: 0, y: 0, w: 10, h: 10 };
        return { x: minX - 26, y: minY - 48, w: maxX - minX + 52, h: maxY - minY + 76 };
    }

    renderSgs() {
        this.sgLayer.innerHTML = '';
        for (const sg of this.model.sgs) {
            const b = this.sgBounds(sg);
            const g = svgEl('g', { class: 'sg-box' + (this.selSg === sg.id ? ' sel' : ''), 'data-id': sg.id });
            g.appendChild(svgEl('rect', { x: b.x, y: b.y, width: b.w, height: b.h }));
            const t = svgEl('text', { x: b.x + 12, y: b.y + 19 });
            t.textContent = sg.title || sg.id;
            g.appendChild(t);
            this.sgLayer.appendChild(g);
        }
    }

    renderNodes() {
        this.nodeLayer.innerHTML = '';
        for (const n of this.model.nodes) {
            const g = svgEl('g', {
                class: 'node' + (this.selNodes.has(n.id) ? ' sel' : ''),
                'data-id': n.id,
                transform: `translate(${n.x},${n.y})`,
            });
            for (const spec of drawShape(n.shape, n.w, n.h)) {
                const isDetail = spec.attrs.fill === 'none';
                const el = svgEl(spec.tag, spec.attrs);
                el.classList.add(isDetail ? 'shape-detail' : 'shape');
                if (!isDetail) {
                    if (n.style && n.style.fill) el.setAttribute('fill', n.style.fill);
                    if (n.style && n.style.stroke) el.setAttribute('stroke', n.style.stroke);
                }
                g.appendChild(el);
            }
            const lines = n._lines || [n.label];
            const blockH = lines.length * LH;
            const startY = -blockH / 2 + LH * 0.74;
            const txt = svgEl('text', { 'text-anchor': 'middle' });
            lines.forEach((ln, i) => {
                const ts = svgEl('tspan', { x: 0, y: startY + i * LH });
                ts.textContent = ln;
                txt.appendChild(ts);
            });
            if (n.style && n.style.color) txt.setAttribute('fill', n.style.color);
            g.appendChild(txt);
            for (const side of ['t', 'r', 'b', 'l']) {
                const p = { t: [0, -n.h / 2], r: [n.w / 2, 0], b: [0, n.h / 2], l: [-n.w / 2, 0] }[side];
                const hd = svgEl('circle', { class: 'handle', 'data-side': side, cx: p[0], cy: p[1] });
                g.appendChild(hd);
            }
            this.nodeLayer.appendChild(g);
        }
    }

    renderAll() {
        if (!this.model) return;
        this.renderSgs();
        this.renderEdges();
        this.renderNodes();
    }

    showPill() {
        if (!this.selNodes.size) { this.hidePill(); return; }
        this.pill.style.display = 'flex';
        if (this.selNodes.size === 1) {
            const n = this.nodeById([...this.selNodes][0]);
            this.pillName.textContent = SHAPES[n.shape].name;
        } else {
            this.pillName.textContent = this.selNodes.size + ' nodes';
        }
        this.buildPillSwatches();
        this.positionPill();
    }

    hidePill() { this.pill.style.display = 'none'; }

    buildPillSwatches() {
        const box = this.pilSw;
        box.innerHTML = '';
        let curIdx = 0;
        if (this.selNodes.size === 1) {
            const n = this.nodeById([...this.selNodes][0]);
            SWATCHES.forEach((s, i) => {
                if (JSON.stringify(s.style) === JSON.stringify(n.style)) curIdx = i;
            });
        }
        SWATCHES.forEach((s, i) => {
            const b = document.createElement('button');
            b.className = 'sw' + (s.style ? '' : ' default') + (i === curIdx ? ' cur' : '');
            if (s.style) {
                b.style.background = s.style.fill;
                b.style.borderColor = s.style.stroke;
            }
            b.title = s.name;
            b.addEventListener('click', () => this.applySwatch(s.style));
            box.appendChild(b);
        });
    }

    positionPill() {
        if (this.pill.style.display === 'none' || !this.selNodes.size || !this.model) return;
        let minX = Infinity, minY = Infinity, maxX = -Infinity;
        for (const id of this.selNodes) {
            const n = this.nodeById(id);
            if (!n) continue;
            minX = Math.min(minX, n.x - n.w / 2); maxX = Math.max(maxX, n.x + n.w / 2);
            minY = Math.min(minY, n.y - n.h / 2);
        }
        if (minX === Infinity) { this.hidePill(); return; }
        const tl = this.worldToScreen((minX + maxX) / 2, minY);
        const pw = this.pill.offsetWidth || 280;
        let x = tl.x - pw / 2;
        x = Math.max(8, Math.min(x, this.svg.clientWidth - pw - 8));
        let y = Math.max(8, tl.y - 44);
        this.pill.style.left = x + 'px';
        this.pill.style.top = y + 'px';
    }

    openEditor(screenX, screenY, width, value, onCommit) {
        this.editorMode = { onCommit };
        this.editor.style.display = 'block';
        this.editor.value = value;
        this.editor.style.left = Math.round(screenX - width / 2) + 'px';
        this.editor.style.top = Math.round(screenY) + 'px';
        this.autosizeEditor();
        this.editor.focus();
        this.editor.select();
    }
    autosizeEditor() {
        this.editor.style.width = 'auto';
        this.editor.style.height = 'auto';
        const w = Math.max(90, Math.min(this.editor.scrollWidth + 18, 260));
        this.editor.style.width = w + 'px';
        this.editor.style.height = Math.min(this.editor.scrollHeight + 4, 120) + 'px';
    }
    closeEditor(cancel) {
        if (this.editor.style.display !== 'block') return false;
        const val = this.editor.value;
        const cb = this.editorMode && this.editorMode.onCommit;
        this.editor.style.display = 'none';
        this.editorMode = null;
        if (!cancel && cb) cb(val);
        return true;
    }
    hasOpenEditor() { return this.editor.style.display === 'block'; }

    openNodeEditor(id) {
        const n = this.nodeById(id);
        if (!n) return;
        const p = this.worldToScreen(n.x, n.y - n.h / 2 - 8);
        this.openEditor(p.x, p.y, Math.max(110, n.w * this.view.k), n.label, v => {
            this.svc.pushUndo(null);
            n.label = v.trim() || n.id;
            sizeNode(n);
            this.changed({ keepView: true });
        });
    }
    openEdgeEditor(id) {
        const e = this.model.edges.find(x => x.id === id);
        if (!e) return;
        const geo = this.edgeGeom(e);
        const p = this.worldToScreen(geo.mx, geo.my);
        this.openEditor(p.x, p.y - 12, 110, e.label, v => {
            this.svc.pushUndo(null);
            e.label = v.trim();
            this.changed({ keepView: true });
        });
    }
    openTitleEditor(sg) {
        const b = this.sgBounds(sg);
        const p = this.worldToScreen(b.x + 12, b.y + 4);
        this.openEditor(p.x, p.y, 130, sg.title, v => {
            this.svc.pushUndo(null);
            sg.title = v.trim() || sg.id;
            this.changed({ keepView: true });
        });
    }

    selectAll() {
        this.clearSelection();
        this.model.nodes.forEach(n => this.selNodes.add(n.id));
        this.refreshSelClasses();
        this.showPill();
    }

    onKeyDown(e) {
        if (!this.active || !this.model) return false;
        const tag = (e.target.tagName || '').toLowerCase();
        const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
        if (e.key === ' ' && !typing) { this.spaceDown = true; this.svg.style.cursor = 'grab'; }
        if (typing) return false;
        if (this.svc.isHelpOpen()) return false;
        const mod = e.ctrlKey || e.metaKey;
        if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); this.duplicateSel(); return true; }
        if (mod && e.key.toLowerCase() === 'a') { e.preventDefault(); this.selectAll(); return true; }
        if (mod && e.key.toLowerCase() === 'g') { e.preventDefault(); e.shiftKey ? this.ungroupSel() : this.groupSel(); return true; }
        if (mod) return false;
        if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); this.deleteSel(); return true; }
        if (e.key === 'Escape') { this.clearSelection(); this.refreshSelClasses(); return true; }
        if (e.key === 'Enter') { if (this.selNodes.size === 1) { e.preventDefault(); this.openNodeEditor([...this.selNodes][0]); } return true; }
        if (e.key === 'f' || e.key === 'F') { this.fitView(); return true; }
        if (e.key.startsWith('Arrow')) {
            e.preventDefault();
            if (!this.selNodes.size) return true;
            const step = e.shiftKey ? 1 : GRID;
            const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
            this.svc.pushUndo(null);
            const touched = new Set();
            for (const id of this.selNodes) {
                const n = this.nodeById(id);
                if (!n) continue;
                n.x += d[0]; n.y += d[1];
                touched.add(id);
            }
            this.fastUpdatePositions(touched);
            this.changed({ keepView: true });
            return true;
        }
        return false;
    }
}

window.StudioCore.Board = Board;

})();
</script>
