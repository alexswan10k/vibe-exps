                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(
                        sx + Math.cos(na) * (R - 12),
                        sy + Math.sin(na) * (R - 12),
                    );
                    ctx.stroke();
                    ctx.fillStyle = "#fff";
                    ctx.textAlign = "center";
                    ctx.font = "800 20px system-ui";
                    ctx.fillText(Math.round(kmhReal), sx, sy + 6);
                    ctx.font = "600 10px system-ui";
                    ctx.fillStyle = "rgba(255,255,255,0.7)";
                    ctx.fillText("km/h", sx, sy + 22);

                    // controls hint (fades after driving starts)
                    const hintA =
                        this.startedAt === null
                            ? 1
                            : clamp(1 - (this.hintT - 6) / 2, 0, 1);
                    if (hintA > 0.01) {
                        ctx.globalAlpha = hintA;
                        ctx.textAlign = "center";
                        ctx.fillStyle = "rgba(0,0,0,0.4)";
                        const msg =
                            "↑/W gas · ↓/S brake · ←/→ rotate in air · SPACE nitro · G swap car · R restart · M mute";
                        ctx.font = "600 14px system-ui";
                        const tw = ctx.measureText(msg).width;
                        this.rr(
                            ctx,
                            W / 2 - tw / 2 - 16,
                            H - 40,
                            tw + 32,
                            30,
                            15,
                        );
                        ctx.fill();
                        ctx.fillStyle = "#fff";
                        ctx.fillText(msg, W / 2, H - 20);
                        if (this.startedAt === null) {
                            ctx.font = "800 26px system-ui";
                            ctx.globalAlpha = 0.7 + 0.3 * Math.sin(time * 4);
                            ctx.fillText("HOLD ↑ TO DRIVE", W / 2, H * 0.3);
                        }
                        ctx.globalAlpha = 1;
                    }

                    if (this.gameOver) {
                        ctx.fillStyle = "rgba(8,10,20,0.72)";
                        ctx.fillRect(0, 0, W, H);
                        ctx.textAlign = "center";
                        ctx.fillStyle = "#ff6b6b";
                        ctx.font = "900 44px system-ui";
                        ctx.fillText("OUT OF FUEL", W / 2, H * 0.36);
                        ctx.fillStyle = "#fff";
                        ctx.font = "700 22px system-ui";
                        ctx.fillText(
                            Math.floor(this.maxDist) +
                                " m  ·  score " +
                                this.score.toLocaleString() +
                                "  ·  " +
                                this.coins +
                                " coins",
                            W / 2,
                            H * 0.36 + 44,
                        );
                        if (
                            Math.floor(this.maxDist) >= this.best &&
                            this.best > 0
                        ) {
                            ctx.fillStyle = "#ffd166";
                            ctx.font = "800 20px system-ui";
                            ctx.fillText(
                                "★ NEW RECORD ★",
                                W / 2,
                                H * 0.36 + 80,
                            );
                        }
                        ctx.globalAlpha = 0.7 + 0.3 * Math.sin(time * 5);
                        ctx.fillStyle = "#fff";
                        ctx.font = "700 20px system-ui";
                        ctx.fillText("press R for a new world", W / 2, H * 0.6);
                        ctx.globalAlpha = 1;
                    }
                }
            }

            // ------------------------------------------------------------- input
            const canvas = document.getElementById("c");
            let game = null;
            try {
                game = new Game(canvas);
            } catch (e) {
                document.getElementById("err").style.display = "block";
                document.getElementById("err").textContent =
                    "boot error: " + e.message + "\n" + e.stack;
                throw e;
            }
            window.game = game;
            window.addEventListener("error", (ev) => {
                document.getElementById("err").style.display = "block";
                document.getElementById("err").textContent =
                    ev.message + " @" + ev.filename + ":" + ev.lineno;
            });

            const KEYMAP = {
                ArrowUp: "up",
                KeyW: "up",
                ArrowDown: "down",
                KeyS: "down",
                ArrowLeft: "left",
                KeyA: "left",
                ArrowRight: "right",
                KeyD: "right",
                Space: "nitro",
                ShiftLeft: "nitro",
                ShiftRight: "nitro",
            };
            window.addEventListener("keydown", (e) => {
                Audio2.init();
                Audio2.resume();
                const m = KEYMAP[e.code];
                if (m) {
                    game.input[m] = true;
                    if (game.startedAt === null && (m === "up" || m === "down"))
                        game.startedAt = 0;
                    e.preventDefault();
                }
                if (e.code === "KeyG") game.pickVehicle(game.vi + 1);
                if (e.code === "KeyR") game.reset((Math.random() * 1e9) | 0);
                if (e.code === "KeyM") {
                    Audio2.init();
                    Audio2.setMute(!Audio2.muted);
                }
            });
            window.addEventListener("keyup", (e) => {
                const m = KEYMAP[e.code];
                if (m) game.input[m] = false;
            });
            window.addEventListener("blur", () => {
                for (const k in game.input) game.input[k] = false;
            });
        </script>
    </body>
</html>
